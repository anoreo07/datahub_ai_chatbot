      - name: component_category
        description: Nhóm linh kiện
        data_type: varchar
        nullable: true
        business_definition: Nhóm linh kiện (Pin/Động cơ/Điện tử/Thân xe/Gầm/Nội thất/Ngoại thất)
        example: Pin
      - name: subcategory
        description: Phân nhóm
        data_type: varchar
        nullable: true
        business_definition: Phân nhóm chi tiết (Cell/Module/Pack/BMS/Inverter)
        example: Cell
      - name: material
        description: Vật liệu
        data_type: varchar
        nullable: true
        business_definition: Vật liệu chế tạo linh kiện
        example: NCM 811
      - name: unit
        description: Đơn vị tính
        data_type: varchar
        nullable: true
        business_definition: Đơn vị (chiếc, bộ, kg, m, lít)
        example: chiếc
      - name: weight_kg
        description: Trọng lượng
        data_type: decimal
        nullable: true
        business_definition: Trọng lượng đơn vị linh kiện (kg)
        example: 0.07
      - name: dimension_mm
        description: Kích thước
        data_type: varchar
        nullable: true
        business_definition: Kích thước (Dài x Rộng x Cao) tính bằng mm
        example: 21 x 70
      - name: procurement_type
        description: Loại hình thu mua
        data_type: varchar
        nullable: true
        business_definition: Phân loại mua sắm (Purchased/Manufactured/Subcontracted)
        example: Purchased
      - name: country_of_origin
        description: Xuất xứ
        data_type: varchar
        nullable: true
        business_definition: Quốc gia sản xuất linh kiện
        example: Hàn Quốc
      - name: component_status
        description: Trạng thái
        data_type: varchar
        nullable: true
        business_definition: Trạng thái (Active/In Development/Obsolete/Phase-out)
        example: Active
      - name: replacement_for
        description: Thay thế cho
        data_type: varchar
        nullable: true
        business_definition: Mã linh kiện cũ được thay thế bởi linh kiện này
        example: CELL-NCM-622-001
      - name: created_date
        description: Ngày tạo
        data_type: date
        nullable: true
        business_definition: Ngày linh kiện được tạo trong hệ thống
        example: 2024-06-01
    owners:
      - RD_COMPONENT_ENG
    refresh_frequency: Daily

  - name: fact_test_cycle
    description: Chu kỳ thử nghiệm xe điện và linh kiện
    domain: Phát triển xe (R&D)
    platform: Redshift
    tags:
      - test_cycle
      - durability
      - validation
    columns:
      - name: test_cycle_id
        description: Mã chu kỳ thử
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi chu kỳ thử nghiệm
        example: TCYC-VF9-2025-001
      - name: prototype_id
        description: Mã nguyên mẫu
        data_type: varchar
        nullable: true
        business_definition: Mã nguyên mẫu trải qua chu kỳ thử
        example: PROTO-VF9-2025-012
      - name: test_cycle_name
        description: Tên chu kỳ
        data_type: varchar
        nullable: false
        business_definition: Tên của chu kỳ thử nghiệm
        example: Chu kỳ độ bền pin 1000 chu kỳ sạc
      - name: cycle_type
        description: Loại chu kỳ
        data_type: varchar
        nullable: false
        business_definition: Phân loại (Durability/Performance/Environmental/Endurance/Life)
        example: Durability
      - name: test_standard
        description: Tiêu chuẩn thử
        data_type: varchar
        nullable: true
        business_definition: Tiêu chuẩn thử nghiệm áp dụng
        example: ISO 12405-4
      - name: total_cycles_planned
        description: Tổng chu kỳ kế hoạch
        data_type: int
        nullable: false
        business_definition: Số chu kỳ dự kiến thực hiện
        example: 1000
      - name: total_cycles_completed
        description: Chu kỳ đã hoàn thành
        data_type: int
        nullable: true
        business_definition: Số chu kỳ đã thực hiện đến thời điểm hiện tại
        example: 450
      - name: start_date
        description: Ngày bắt đầu
        data_type: date
        nullable: false
        business_definition: Ngày bắt đầu chu kỳ thử nghiệm
        example: 2025-06-01
      - name: end_date
        description: Ngày kết thúc
        data_type: date
        nullable: true
        business_definition: Ngày dự kiến kết thúc hoặc ngày kết thúc thực tế
        example: 2025-09-30
      - name: pass_criteria
        description: Tiêu chí đạt
        data_type: varchar
        nullable: true
        business_definition: Điều kiện được coi là Pass (dung lượng còn >80%)
        example: Dung lượng pin sau thử > 80% danh định
      - name: current_result
        description: Kết quả hiện tại
        data_type: varchar
        nullable: true
        business_definition: Kết quả tạm thời khi đang thử (Passing/Failing/Inconclusive)
        example: Passing
      - name: final_result
        description: Kết quả cuối cùng
        data_type: varchar
        nullable: true
        business_definition: Kết quả sau khi hoàn thành chu kỳ (Pass/Fail)
        example: null
      - name: test_engineer
        description: Kỹ sư thử nghiệm
        data_type: varchar
        nullable: true
        business_definition: Mã kỹ sư phụ trách chu kỳ thử
        example: EMP00901
      - name: test_equipment
        description: Thiết bị thử
        data_type: varchar
        nullable: true
        business_definition: Thiết bị sử dụng cho chu kỳ thử
        example: Máy sạc-xả pin chu kỳ Arbin LBT-500
      - name: remarks
        description: Ghi chú
        data_type: varchar
        nullable: true
        business_definition: Ghi chú về diễn biến bất thường trong chu kỳ thử
        example: Nhiệt độ phòng thử dao động 25-30°C
    owners:
      - RD_TEST_LAB
    refresh_frequency: Daily
