datasets:
  - name: dim_project
    description: Danh mục dự án phát triển xe của VinFast
    domain: Phát triển xe (R&D)
    platform: Redshift
    tags:
      - project
      - rnd
      - master_data
    columns:
      - name: project_id
        description: Mã dự án
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi dự án phát triển sản phẩm mới
        example: PRJ-VFE-001
      - name: project_name
        description: Tên dự án
        data_type: varchar
        nullable: false
        business_definition: Tên mã của dự án phát triển xe
        example: Dự án VF 9 nâng cấp 2026
      - name: project_type
        description: Loại dự án
        data_type: varchar
        nullable: false
        business_definition: Phân loại (New Model/Facelift/Model Year/Engine Variant)
        example: Facelift
      - name: product_line
        description: Dòng sản phẩm
        data_type: varchar
        nullable: true
        business_definition: Dòng xe áp dụng (VF 3, VF 5, VF 6, VF 7, VF 8, VF 9)
        example: VF 9
      - name: program_manager
        description: Quản lý chương trình
        data_type: varchar
        nullable: true
        business_definition: Mã nhân viên quản lý dự án
        example: EMP00123
      - name: start_date
        description: Ngày bắt đầu
        data_type: date
        nullable: false
        business_definition: Ngày dự án chính thức khởi động
        example: 2025-01-01
      - name: planned_end_date
        description: Ngày kết thúc dự kiến
        data_type: date
        nullable: true
        business_definition: Ngày kết thúc dự án theo kế hoạch
        example: 2025-12-31
      - name: actual_end_date
        description: Ngày kết thúc thực tế
        data_type: date
        nullable: true
        business_definition: Ngày dự án hoàn thành thực tế
        example: null
      - name: budget
        description: Ngân sách dự án
        data_type: decimal
        nullable: true
        business_definition: Tổng ngân sách được phê duyệt cho dự án (USD)
        example: 25000000.00
      - name: budget_consumed
        description: Ngân sách đã sử dụng
        data_type: decimal
        nullable: true
        business_definition: Ngân sách đã giải ngân đến thời điểm hiện tại
        example: 15000000.00
      - name: project_status
        description: Trạng thái dự án
        data_type: varchar
        nullable: false
        business_definition: Trạng thái (Initiated/Planning/Execution/Testing/Closed/Cancelled)
        example: Execution
      - name: gate_review_level
        description: Mức gate review
        data_type: varchar
        nullable: true
        business_definition: Giai đoạn phê duyệt dự án (Gate 0 đến Gate 7)
        example: Gate 4
      - name: risk_level
        description: Mức độ rủi ro
        data_type: varchar
        nullable: true
        business_definition: Đánh giá rủi ro tổng thể dự án (Low/Medium/High/Critical)
        example: Medium
    owners:
      - RD_PROJECT_MGMT
    refresh_frequency: Daily

  - name: dim_platform
    description: Danh mục nền tảng khung gầm xe điện
    domain: Phát triển xe (R&D)
    platform: Redshift
    tags:
      - platform
      - chassis
      - architecture
    columns:
      - name: platform_id
        description: Mã nền tảng
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi nền tảng khung gầm xe
        example: PLT-B-SUV
      - name: platform_name
        description: Tên nền tảng
        data_type: varchar
        nullable: false
        business_definition: Tên mã nền tảng phát triển
        example: Nền tảng B-SUV điện
      - name: vehicle_type
        description: Loại xe
        data_type: varchar
        nullable: true
        business_definition: Phân loại xe sử dụng nền tảng (SUV/Sedan/Hatchback/MPV/Pickup)
        example: SUV
      - name: segment
        description: Phân khúc
        data_type: varchar
        nullable: true
        business_definition: Phân khúc xe (A/B/C/D/E)
        example: B
      - name: wheelbase_mm
        description: Chiều dài cơ sở
        data_type: int
        nullable: true
        business_definition: Khoảng cách giữa 2 trục bánh xe (mm)
        example: 2700
      - name: battery_format
        description: Định dạng pin
        data_type: varchar
        nullable: true
        business_definition: Loại pin sử dụng trên nền tảng (LFP/NCM/Blade/Pouch/Cylindrical)
        example: NCM 21700
      - name: motor_placement
        description: Vị trí motor
        data_type: varchar
        nullable: true
        business_definition: Cấu hình motor (FWD/RWD/AWD/Dual Motor/Tri Motor)
        example: AWD
      - name: max_power_kw
        description: Công suất tối đa
        data_type: int
        nullable: true
        business_definition: Công suất motor tối đa nền tảng hỗ trợ (kW)
        example: 300
      - name: max_battery_kwh
        description: Dung lượng pin tối đa
        data_type: decimal
        nullable: true
        business_definition: Dung lượng pin tối đa nền tảng hỗ trợ (kWh)
        example: 123.00
      - name: platform_status
        description: Trạng thái nền tảng
        data_type: varchar
        nullable: true
        business_definition: Trạng thái (Active/Deprecated/Under Development)
        example: Active
      - name: launch_date
        description: Ngày ra mắt
        data_type: date
        nullable: true
        business_definition: Ngày nền tảng đầu tiên được ra mắt
        example: 2024-03-15
      - name: derived_models
        description: Số mẫu xe phát triển
        data_type: int
        nullable: true
        business_definition: Số mẫu xe đã và đang phát triển trên nền tảng này
        example: 3
    owners:
      - RD_VEHICLE_ARCH
    refresh_frequency: Weekly

  - name: dim_engineering_change
    description: Danh mục thay đổi kỹ thuật trên sản phẩm
    domain: Phát triển xe (R&D)
    platform: Redshift
    tags:
      - engineering
      - change
      - ecc
    columns:
      - name: change_id
        description: Mã thay đổi kỹ thuật
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi đề xuất thay đổi kỹ thuật (ECO/ECN)
        example: ECO-2025-00456
      - name: project_id
        description: Mã dự án
        data_type: varchar
        nullable: false
        business_definition: Mã dự án áp dụng thay đổi kỹ thuật
        example: PRJ-VFE-001
      - name: change_type
        description: Loại thay đổi
        data_type: varchar
        nullable: false
        business_definition: Phân loại (Design Change/Process Change/Material Change/Supplier Change)
        example: Design Change
      - name: component_code
        description: Mã linh kiện thay đổi
        data_type: varchar
        nullable: false
        business_definition: Mã linh kiện bị ảnh hưởng bởi thay đổi
        example: BAT-PACK-VF9-001
      - name: change_reason
        description: Lý do thay đổi
        data_type: varchar
        nullable: true
        business_definition: Lý do thực hiện thay đổi (Cost Reduction/Quality Improvement/Regulatory/New Feature)
        example: Quality Improvement
      - name: description
        description: Mô tả thay đổi
        data_type: varchar
        nullable: true
        business_definition: Mô tả chi tiết nội dung thay đổi kỹ thuật
        example: Thay đổi cell pin từ NCM 622 sang NCM 811 để tăng mật độ năng lượng
      - name: change_owner
        description: Người phụ trách
        data_type: varchar
        nullable: true
        business_definition: Mã nhân viên kỹ thuật phụ trách thay đổi
        example: EMP00678
      - name: priority
        description: Mức ưu tiên
        data_type: varchar
        nullable: true
        business_definition: Mức độ ưu tiên (Critical/High/Medium/Low)
        example: High
      - name: submitted_date
        description: Ngày đề xuất
        data_type: date
        nullable: false
        business_definition: Ngày đề xuất thay đổi được gửi lên
        example: 2025-04-10
      - name: approval_date
        description: Ngày phê duyệt
        data_type: date
        nullable: true
        business_definition: Ngày thay đổi được phê duyệt
        example: 2025-05-01
      - name: implementation_date
        description: Ngày triển khai
        data_type: date
        nullable: true
        business_definition: Ngày thay đổi được áp dụng vào sản xuất
        example: 2025-06-15
      - name: change_status
        description: Trạng thái
        data_type: varchar
        nullable: false
        business_definition: Trạng thái của ECO (Draft/Submitted/Under Review/Approved/Implemented/Cancelled)
        example: Approved
      - name: cost_impact
        description: Tác động chi phí
        data_type: decimal
        nullable: true
        business_definition: Thay đổi chi phí trên mỗi đơn vị sản phẩm (USD)
        example: -15.50
      - name: phase_in_method
        description: Phương thức áp dụng
        data_type: varchar
        nullable: true
        business_definition: Cách thức áp dụng thay đổi (Running Change/Cut-in VIN/Phase-out)
        example: Cut-in VIN
      - name: affected_models
        description: Mẫu xe bị ảnh hưởng
        data_type: varchar
        nullable: true
        business_definition: Danh sách mẫu xe bị ảnh hưởng bởi thay đổi
        example: VF 9, VF 8
    owners:
      - RD_ENGINEERING
    refresh_frequency: Daily

  - name: fact_design_release
    description: Phát hành thiết kế bản vẽ và tài liệu kỹ thuật
    domain: Phát triển xe (R&D)
    platform: Redshift
    tags:
      - design
      - release
      - drawing
    columns:
      - name: release_id
        description: Mã phát hành
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi lần phát hành thiết kế
        example: DR-VF9-2025-001
      - name: drawing_number
        description: Số bản vẽ
        data_type: varchar
        nullable: false
        business_definition: Số hiệu bản vẽ kỹ thuật được phát hành
        example: DWG-VF9-BAT-00123
      - name: project_id
        description: Mã dự án
        data_type: varchar
        nullable: false
        business_definition: Mã dự án liên quan đến phát hành
        example: PRJ-VFE-001
      - name: revision
        description: Phiên bản
        data_type: varchar
        nullable: false
        business_definition: Số phiên bản của bản vẽ hoặc tài liệu
        example: Rev C
      - name: document_type
        description: Loại tài liệu
        data_type: varchar
        nullable: true
        business_definition: Phân loại (3D Model/2D Drawing/Specification/Report/Schematic)
        example: 2D Drawing
      - name: release_date
        description: Ngày phát hành
        data_type: date
        nullable: false
        business_definition: Ngày phát hành chính thức bản vẽ lên hệ thống PLM
        example: 2025-05-20
      - name: designed_by
        description: Người thiết kế
        data_type: varchar
        nullable: true
        business_definition: Mã kỹ sư thiết kế
        example: EMP00543
      - name: checked_by
        description: Người kiểm tra
        data_type: varchar
        nullable: true
        business_definition: Mã kỹ sư kiểm tra thiết kế
        example: EMP00789
      - name: approved_by
        description: Người phê duyệt
        data_type: varchar
        nullable: true
        business_definition: Mã quản lý phê duyệt phát hành
        example: EMP00123
      - name: release_status
        description: Trạng thái phát hành
        data_type: varchar
        nullable: false
        business_definition: Trạng thái (Draft/In Review/Released/Obsolete/Superseded)
        example: Released
      - name: plm_system
        description: Hệ thống PLM
        data_type: varchar
        nullable: true
        business_definition: Hệ thống quản lý vòng đời sản phẩm lưu trữ
        example: Siemens Teamcenter
      - name: effective_date
        description: Ngày hiệu lực
        data_type: date
        nullable: true
        business_definition: Ngày bắt đầu áp dụng bản vẽ vào sản xuất
        example: 2025-06-01
    owners:
      - RD_DESIGN
    refresh_frequency: Daily

  - name: fact_prototype
    description: Quản lý nguyên mẫu xe trong quá trình phát triển
    domain: Phát triển xe (R&D)
    platform: Redshift
    tags:
      - prototype
      - build
      - testing
    columns:
      - name: prototype_id
        description: Mã nguyên mẫu
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi nguyên mẫu xe được chế tạo
        example: PROTO-VF9-2025-012
      - name: project_id
        description: Mã dự án
        data_type: varchar
        nullable: false
        business_definition: Mã dự án phát triển của nguyên mẫu
        example: PRJ-VFE-001
      - name: prototype_phase
        description: Giai đoạn nguyên mẫu
        data_type: varchar
        nullable: false
        business_definition: Phân loại (Alpha/Beta/Pre-Pilot/Pilot/PPAP)
        example: Beta
      - name: build_number
        description: Số lần chế tạo
        data_type: int
        nullable: true
        business_definition: Số thứ tự lần chế tạo nguyên mẫu
        example: 3
      - name: vin_number
        description: Số VIN
        data_type: varchar
        nullable: true
        business_definition: Số nhận dạng xe gán cho nguyên mẫu
        example: VIN-PROTO-VF9-00012
      - name: build_date
        description: Ngày chế tạo
        data_type: date
        nullable: false
        business_definition: Ngày hoàn thành chế tạo nguyên mẫu
        example: 2025-06-20
      - name: body_style
        description: Kiểu thân xe
        data_type: varchar
        nullable: true
        business_definition: Kiểu dáng thân xe nguyên mẫu
        example: SUV 5 chỗ
      - name: color
        description: Màu sắc
        data_type: varchar
        nullable: true
        business_definition: Màu sơn thân xe nguyên mẫu
        example: Đỏ VinFast
      - name: battery_type
        description: Loại pin
        data_type: varchar
        nullable: true
        business_definition: Loại pin trang bị trên nguyên mẫu
        example: NCM 811 100kWh
      - name: motor_type
        description: Loại motor
        data_type: varchar
        nullable: true
        business_definition: Loại motor điện trang bị trên nguyên mẫu
        example: Motor đồng bộ nam châm vĩnh cửu
      - name: purpose
        description: Mục đích chế tạo
        data_type: varchar
        nullable: true
        business_definition: Mục đích của nguyên mẫu (Validation/Durability/Crash/Emissions)
        example: Validation
      - name: current_location
        description: Vị trí hiện tại
        data_type: varchar
        nullable: true
        business_definition: Vị trí lưu giữ nguyên mẫu hiện tại
        example: Trung tâm thử nghiệm Vũng Tàu
      - name: prototype_status
        description: Trạng thái
        data_type: varchar
        nullable: false
        business_definition: Trạng thái (Planned/Building/Completed/In Test/Scrapped/Retired)
        example: In Test
      - name: created_at
        description: Thời gian tạo
        data_type: timestamp
        nullable: false
        business_definition: Thời điểm tạo bản ghi nguyên mẫu
        example: 2025-05-01 08:00:00
    owners:
      - RD_PROTOTYPE
    refresh_frequency: Daily

  - name: fact_test_result
    description: Kết quả thử nghiệm xe và linh kiện
    domain: Phát triển xe (R&D)
    platform: Redshift
    tags:
      - test
      - result
      - validation
    columns:
      - name: test_result_id
        description: Mã kết quả thử nghiệm
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi kết quả thử nghiệm
        example: TR-VF9-BAT-001
      - name: prototype_id
        description: Mã nguyên mẫu
        data_type: varchar
        nullable: true
        business_definition: Mã nguyên mẫu được thử nghiệm
        example: PROTO-VF9-2025-012
      - name: component_code
        description: Mã linh kiện
        data_type: varchar
        nullable: true
        business_definition: Mã linh kiện thử nghiệm (nếu là thử nghiệm linh kiện)
        example: BAT-PACK-VF9-001
      - name: test_case_code
        description: Mã ca thử
        data_type: varchar
        nullable: false
        business_definition: Mã kịch bản thử nghiệm theo tiêu chuẩn
        example: TC-BAT-DUR-001
      - name: test_name
        description: Tên thử nghiệm
        data_type: varchar
        nullable: false
        business_definition: Tên thử nghiệm cụ thể
        example: Thử nghiệm chu kỳ sạc-xả pin ở nhiệt độ cao
      - name: test_date
        description: Ngày thử nghiệm
        data_type: date
        nullable: false
        business_definition: Ngày thực hiện thử nghiệm
        example: 2025-07-10
      - name: test_location
        description: Địa điểm thử
        data_type: varchar
        nullable: true
        business_definition: Phòng thí nghiệm hoặc địa điểm thử nghiệm
        example: Phòng thử nghiệm pin Lab 1
      - name: test_duration_hours
        description: Thời gian thử
        data_type: decimal
        nullable: true
        business_definition: Tổng thời gian thực hiện thử nghiệm (giờ)
        example: 240.00
      - name: measured_value
        description: Giá trị đo được
        data_type: varchar
        nullable: true
        business_definition: Giá trị đo được chính của thử nghiệm
        example: 95.50
      - name: unit
        description: Đơn vị đo
        data_type: varchar
        nullable: true
        business_definition: Đơn vị của giá trị đo
        example: '%'
      - name: specification_min
        description: Giới hạn dưới
        data_type: varchar
        nullable: true
        business_definition: Giá trị tối thiểu yêu cầu của thông số
        example: 90.00
      - name: specification_max
        description: Giới hạn trên
        data_type: varchar
        nullable: true
        business_definition: Giá trị tối đa cho phép của thông số
        example: 100.00
      - name: test_result
        description: Kết quả
        data_type: varchar
        nullable: false
        business_definition: Kết quả đánh giá (Pass/Fail/Inconclusive)
        example: Pass
      - name: failure_mode
        description: Chế độ lỗi
        data_type: varchar
        nullable: true
        business_definition: Mô tả chế độ lỗi nếu kết quả Fail
        example: null
      - name: test_engineer
        description: Kỹ sư thử nghiệm
        data_type: varchar
        nullable: true
        business_definition: Mã kỹ sư chịu trách nhiệm thử nghiệm
        example: EMP00901
    owners:
      - RD_TEST_VALIDATION
    refresh_frequency: Daily

  - name: dim_specification
    description: Danh mục thông số kỹ thuật của xe và linh kiện
    domain: Phát triển xe (R&D)
    platform: Redshift
    tags:
      - specification
      - technical
      - parameter
    columns:
      - name: spec_id
        description: Mã thông số
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi thông số kỹ thuật
        example: SPEC-BAT-CAP-001
      - name: spec_code
        description: Mã thông số kỹ thuật
        data_type: varchar
        nullable: false
        business_definition: Mã thông số kỹ thuật viết tắt theo chuẩn VinFast
        example: BAT_NOM_CAP
      - name: spec_name
        description: Tên thông số
        data_type: varchar
        nullable: false
        business_definition: Tên đầy đủ của thông số kỹ thuật
        example: Dung lượng pin danh định
      - name: component_code
        description: Mã linh kiện
        data_type: varchar
        nullable: true
        business_definition: Mã linh kiện áp dụng thông số
        example: BAT-PACK-VF9-001
      - name: model_line
        description: Dòng xe
        data_type: varchar
        nullable: true
        business_definition: Dòng xe áp dụng thông số
        example: VF 9
      - name: unit
        description: Đơn vị
        data_type: varchar
        nullable: true
        business_definition: Đơn vị đo lường của thông số
        example: kWh
      - name: nominal_value
        description: Giá trị danh định
        data_type: varchar
        nullable: true
        business_definition: Giá trị thiết kế tiêu chuẩn của thông số
        example: 100.00
      - name: tolerance_min
        description: Dung sai dưới
        data_type: varchar
        nullable: true
        business_definition: Giới hạn dung sai dưới của thông số
        example: -2.00
      - name: tolerance_max
        description: Dung sai trên
        data_type: varchar
        nullable: true
        business_definition: Giới hạn dung sai trên của thông số
        example: 2.00
      - name: spec_category
        description: Nhóm thông số
        data_type: varchar
        nullable: true
        business_definition: Nhóm thông số (Hiệu suất/An toàn/Kích thước/Điện/Trọng lượng)
        example: Điện
      - name: test_method
        description: Phương pháp kiểm tra
        data_type: varchar
        nullable: true
        business_definition: Tiêu chuẩn hoặc quy trình kiểm tra thông số
        example: ISO 12405-4
      - name: spec_status
