        business_definition: Số chứng từ gốc liên quan
        example: RC-2024-08-00345
      - name: cash_flow_category
        description: Nhóm chi tiết
        data_type: varchar
        nullable: false
        business_definition: Nhóm trong Operating như SalesCollection, SupplierPayment, EmployeeCost, Tax
        example: SalesCollection
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp ghi nhận giao dịch
        example: 2024-08-31 23:00:00
