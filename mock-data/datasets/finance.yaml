        data_type: varchar
        nullable: true
        business_definition: Số hóa đơn bán hàng xuất cho khách
        example: INV-2024-08-56789
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp ghi nhận doanh thu
        example: 2024-08-31 16:00:00
    owners:
      - finance-accounting
    refresh_frequency: Daily

