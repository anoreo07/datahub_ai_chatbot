datasets:
  - name: dim_cost_center
    description: Danh mục trung tâm chi phí theo cấu trúc quản lý tài chính
    domain: Tài chính
    platform: Redshift
    tags:
      - master-data
      - cost-center
    columns:
      - name: cost_center_id
        description: Mã định danh trung tâm chi phí
        data_type: varchar
        nullable: false
        business_definition: Khóa chính, mã duy nhất theo hệ thống SAP
        example: CC-5001-ASM
      - name: cost_center_name
        description: Tên trung tâm chi phí
        data_type: varchar
        nullable: false
        business_definition: Tên mô tả đầy đủ của trung tâm chi phí
        example: Chi phí lắp ráp dây chuyền số 1
      - name: plant_id
        description: Mã nhà máy
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_plant
        example: VFHP
      - name: department
        description: Bộ phận quản lý
        data_type: varchar
        nullable: false
        business_definition: Phòng ban chịu trách nhiệm quản lý trung tâm chi phí
        example: Sản xuất
      - name: cost_center_type
        description: Loại trung tâm chi phí
        data_type: varchar
        nullable: false
        business_definition: Phân loại trung tâm chi phí Production, Administration, Sales, RAndD
        example: Production
      - name: cost_center_manager
        description: Người quản lý trung tâm
        data_type: varchar
        nullable: false
        business_definition: Mã nhân viên quản lý trung tâm chi phí
        example: EMP00123
      - name: budget_owner
        description: Chủ ngân sách
        data_type: varchar
        nullable: true
        business_definition: Người phê duyệt và chịu trách nhiệm ngân sách của trung tâm chi phí
        example: EMP00567
      - name: is_active
        description: Còn hoạt động không
        data_type: boolean
        nullable: false
        business_definition: True nếu trung tâm chi phí đang được sử dụng
        example: true
      - name: effective_date
        description: Ngày hiệu lực
        data_type: date
        nullable: false
        business_definition: Ngày trung tâm chi phí bắt đầu hoạt động
        example: 2024-01-01
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tạo bản ghi trong hệ thống
        example: 2024-01-01 08:00:00
    owners:
      - finance-controlling
    refresh_frequency: Daily

  - name: dim_gl_account
    description: Danh mục tài khoản kế toán theo hệ thống tài khoản quốc gia
    domain: Tài chính
    platform: Redshift
    tags:
      - master-data
      - gl-account
    columns:
      - name: gl_account_id
        description: Mã tài khoản kế toán
        data_type: varchar
        nullable: false
        business_definition: Khóa chính, mã tài khoản theo chuẩn hệ thống tài khoản kế toán Việt Nam
        example: 1121
      - name: account_name
        description: Tên tài khoản
        data_type: varchar
        nullable: false
        business_definition: Tên đầy đủ của tài khoản kế toán
        example: Tiền gửi ngân hàng VND
      - name: account_type
        description: Loại tài khoản
        data_type: varchar
        nullable: false
        business_definition: Phân loại Asset, Liability, Equity, Revenue, Expense
        example: Asset
      - name: account_group
        description: Nhóm tài khoản
        data_type: varchar
        nullable: false
        business_definition: Nhóm con trong loại tài khoản, ví dụ Cash, Receivable, Inventory, FixedAsset
        example: Cash
      - name: is_control_account
        description: Là tài khoản tổng hợp
        data_type: boolean
        nullable: false
        business_definition: True nếu là tài khoản tổng hợp, False nếu là tài khoản chi tiết
        example: true
      - name: currency
        description: Loại tiền tệ
        data_type: varchar
        nullable: false
        business_definition: Đơn vị tiền tệ hạch toán theo chuẩn ISO, chủ yếu VND hoặc USD
        example: VND
      - name: is_active
        description: Còn sử dụng
        data_type: boolean
        nullable: false
        business_definition: True nếu tài khoản đang được sử dụng trong kỳ kế toán
        example: true
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tạo tài khoản trong hệ thống
        example: 2024-01-01 08:00:00
    owners:
      - finance-controlling
    refresh_frequency: Daily

  - name: dim_profit_center
    description: Danh mục trung tâm lợi nhuận theo dòng sản phẩm
    domain: Tài chính
    platform: Redshift
    tags:
      - master-data
      - profit-center
    columns:
      - name: profit_center_id
        description: Mã định danh trung tâm lợi nhuận
        data_type: varchar
        nullable: false
        business_definition: Khóa chính, mã duy nhất cho mỗi trung tâm lợi nhuận
        example: PC-VF8
      - name: profit_center_name
        description: Tên trung tâm lợi nhuận
        data_type: varchar
        nullable: false
        business_definition: Tên mô tả trung tâm lợi nhuận theo dòng xe
        example: Dòng xe VF 8
      - name: product_line
        description: Dòng sản phẩm
        data_type: varchar
        nullable: false
        business_definition: Dòng sản phẩm mà trung tâm lợi nhuận phụ trách
        example: VF 8
      - name: profit_center_manager
        description: Người quản lý
        data_type: varchar
        nullable: true
        business_definition: Mã nhân viên chịu trách nhiệm lợi nhuận dòng sản phẩm
        example: EMP00999
      - name: is_active
        description: Còn hoạt động
        data_type: boolean
        nullable: false
        business_definition: True nếu trung tâm lợi nhuận đang hoạt động
        example: true
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tạo bản ghi
        example: 2024-01-01 08:00:00
    owners:
      - finance-controlling
    refresh_frequency: Daily

  - name: fact_general_ledger
    description: Sổ cái ghi nhận tất cả bút toán kế toán của doanh nghiệp
    domain: Tài chính
    platform: Redshift
    tags:
      - transaction
      - gl
    columns:
      - name: journal_entry_id
        description: Mã định danh bút toán
        data_type: bigint
        nullable: false
        business_definition: Khóa chính, mã duy nhất cho mỗi dòng bút toán sổ cái
        example: 20000001
      - name: gl_account_id
        description: Mã tài khoản kế toán
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_gl_account
        example: 1121
      - name: cost_center_id
        description: Mã trung tâm chi phí
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_cost_center
        example: CC-5001-ASM
      - name: profit_center_id
        description: Mã trung tâm lợi nhuận
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_profit_center
        example: PC-VF8
      - name: posting_date
        description: Ngày hạch toán
        data_type: date
        nullable: false
        business_definition: Ngày ghi sổ của bút toán kế toán
        example: 2024-08-31
      - name: document_type
        description: Loại chứng từ
        data_type: varchar
        nullable: false
        business_definition: Phân loại chứng từ SA (Bán hàng), MM (Mua hàng), FI (Tài chính), CO (Kiểm soát)
        example: FI
      - name: document_number
        description: Số chứng từ
        data_type: varchar
        nullable: false
        business_definition: Số hiệu chứng từ gốc theo hệ thống
        example: FI-2024-08-12345
      - name: debit_amount
        description: Số tiền nợ
        data_type: decimal
        nullable: false
        business_definition: Số tiền phát sinh bên nợ của tài khoản, tính bằng VND
        example: 500000000.00
      - name: credit_amount
        description: Số tiền có
        data_type: decimal
        nullable: false
        business_definition: Số tiền phát sinh bên có của tài khoản, tính bằng VND
        example: 0.00
      - name: currency
        description: Loại tiền
        data_type: varchar
        nullable: false
        business_definition: Mã tiền tệ của bút toán
        example: VND
      - name: exchange_rate
        description: Tỷ giá quy đổi
        data_type: decimal
        nullable: true
        business_definition: Tỷ giá quy đổi từ ngoại tệ sang VND, 1 nếu là VND
        example: 1.0000
      - name: posting_text
        description: Nội dung hạch toán
        data_type: varchar
        nullable: true
        business_definition: Mô tả nội dung bút toán kế toán
        example: Thu tiền bán xe VF 8 khách hàng A
      - name: fiscal_year
        description: Năm tài chính
        data_type: int
        nullable: false
        business_definition: Năm tài chính của bút toán
        example: 2024
      - name: fiscal_period
        description: Kỳ kế toán
        data_type: int
        nullable: false
        business_definition: Tháng trong năm tài chính từ 1 đến 12
        example: 8
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp ghi nhận bút toán vào hệ thống
        example: 2024-08-31 14:30:00
    owners:
      - finance-accounting
    refresh_frequency: Daily

  - name: fact_actual_cost
    description: Chi phí sản xuất thực tế phát sinh theo từng đối tượng
    domain: Tài chính
    platform: Redshift
    tags:
      - transaction
      - cost
    columns:
      - name: actual_cost_id
        description: Mã định danh chi phí thực tế
        data_type: bigint
        nullable: false
        business_definition: Khóa chính, mã duy nhất cho mỗi bản ghi chi phí thực tế
        example: 30000001
      - name: cost_center_id
        description: Mã trung tâm chi phí
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_cost_center
        example: CC-5001-ASM
      - name: gl_account_id
        description: Mã tài khoản
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_gl_account
        example: 6271
      - name: order_id
        description: Mã lệnh sản xuất
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến fact_production_order nếu chi phí theo lệnh
        example: PO-2024-08-000123
      - name: cost_element
        description: Yếu tố chi phí
        data_type: varchar
        nullable: false
        business_definition: Phân loại Material, Labor, Overhead, Tooling, Energy
        example: Material
      - name: actual_amount
        description: Số tiền thực tế
        data_type: decimal
        nullable: false
        business_definition: Giá trị chi phí thực tế phát sinh, tính bằng VND
        example: 850000000.00
      - name: quantity
        description: Số lượng
        data_type: decimal
        nullable: true
        business_definition: Số lượng đơn vị phát sinh chi phí
        example: 50.00
      - name: unit_cost
        description: Đơn giá thực tế
        data_type: decimal
        nullable: true
        business_definition: Chi phí trên mỗi đơn vị sản phẩm hoặc dịch vụ
        example: 17000000.00
      - name: posting_date
        description: Ngày hạch toán
        data_type: date
        nullable: false
        business_definition: Ngày ghi nhận chi phí thực tế
        example: 2024-08-31
      - name: reference_document
        description: Chứng từ tham chiếu
        data_type: varchar
        nullable: true
        business_definition: Số chứng từ gốc liên quan đến chi phí như phiếu xuất kho, hóa đơn
        example: MM-2024-08-54321
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tạo bản ghi
        example: 2024-08-31 17:00:00
    owners:
      - finance-controlling
    refresh_frequency: Daily

  - name: fact_standard_cost
    description: Chi phí tiêu chuẩn được xây dựng cho từng sản phẩm
    domain: Tài chính
    platform: Redshift
    tags:
      - transaction
      - cost
    columns:
      - name: standard_cost_id
        description: Mã định danh chi phí tiêu chuẩn
        data_type: bigint
        nullable: false
        business_definition: Khóa chính, mã duy nhất cho mỗi bản ghi định mức chi phí
        example: 40000001
      - name: product_id
        description: Mã sản phẩm
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_product
        example: VF-VF8-PLUS
      - name: version
        description: Phiên bản định mức
        data_type: varchar
        nullable: false
        business_definition: Phiên bản của bộ định mức chi phí, thay đổi theo kỳ
        example: 2024.08
      - name: cost_component
        description: Thành phần chi phí
        data_type: varchar
        nullable: false
        business_definition: Cấu phần chi phí như RawMaterial, PurchasedParts, DirectLabor, MfgOverhead, SGandA
        example: RawMaterial
      - name: material_code
        description: Mã vật tư
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_material, áp dụng cho thành phần vật tư
        example: MT-THEP-001
      - name: standard_quantity
        description: Lượng tiêu chuẩn
        data_type: decimal
        nullable: false
        business_definition: Số lượng vật tư hoặc giờ công định mức cho một sản phẩm
        example: 320.00
      - name: standard_unit_cost
        description: Đơn giá tiêu chuẩn
        data_type: decimal
        nullable: false
        business_definition: Đơn giá chuẩn cho mỗi đơn vị vật tư hoặc giờ công
        example: 15000.00
      - name: standard_total_cost
        description: Tổng chi phí tiêu chuẩn
        data_type: decimal
        nullable: false
        business_definition: Tích của standard_quantity x standard_unit_cost, tổng chi phí chuẩn cho một xe
        example: 4800000.00
      - name: valid_from
        description: Hiệu lực từ ngày
        data_type: date
        nullable: false
        business_definition: Ngày bắt đầu áp dụng bộ định mức chi phí
        example: 2024-08-01
      - name: valid_to
        description: Hiệu lực đến ngày
        data_type: date
        nullable: true
        business_definition: Ngày kết thúc áp dụng, null nếu đang dùng
        example: 2024-08-31
      - name: is_active
        description: Còn hiệu lực
        data_type: boolean
        nullable: false
        business_definition: True nếu định mức đang được áp dụng cho định giá tồn kho
        example: false
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tạo bản ghi
        example: 2024-07-15 10:00:00
    owners:
      - finance-controlling
    refresh_frequency: Daily

  - name: fact_budget
    description: Ngân sách chi phí và doanh thu theo từng trung tâm
    domain: Tài chính
    platform: Redshift
    tags:
      - transaction
      - budget
    columns:
      - name: budget_id
        description: Mã định danh dòng ngân sách
        data_type: bigint
        nullable: false
        business_definition: Khóa chính, mã duy nhất cho mỗi dòng ngân sách
        example: 50000001
      - name: cost_center_id
        description: Mã trung tâm chi phí
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_cost_center
        example: CC-5001-ASM
      - name: profit_center_id
        description: Mã trung tâm lợi nhuận
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_profit_center
        example: PC-VF8
      - name: gl_account_id
        description: Mã tài khoản ngân sách
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_gl_account
        example: 6271
      - name: fiscal_year
        description: Năm ngân sách
        data_type: int
        nullable: false
        business_definition: Năm tài chính của ngân sách
        example: 2024
      - name: fiscal_period
        description: Kỳ ngân sách
        data_type: int
        nullable: false
        business_definition: Tháng trong năm từ 1 đến 12, hoặc 0 cho ngân sách năm
        example: 8
      - name: budget_type
        description: Loại ngân sách
        data_type: varchar
        nullable: false
        business_definition: Phân loại Revenue, Cost, CapitalExpenditure, OperatingExpense
        example: Cost
      - name: budget_amount
        description: Số tiền ngân sách
        data_type: decimal
        nullable: false
        business_definition: Số tiền được phê duyệt trong ngân sách, tính bằng VND
        example: 2000000000.00
      - name: approved_by
        description: Người phê duyệt
        data_type: varchar
        nullable: true
        business_definition: Mã nhân viên phê duyệt ngân sách
        example: EMP00567
      - name: approval_date
        description: Ngày phê duyệt
        data_type: date
        nullable: true
        business_definition: Ngày ngân sách được phê duyệt
        example: 2024-01-15
      - name: notes
        description: Ghi chú
        data_type: varchar
        nullable: true
        business_definition: Mô tả căn cứ lập ngân sách
        example: Ngân sách sản xuất quý 3 - dây chuyền lắp ráp
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp nhập ngân sách vào hệ thống
        example: 2024-01-15 14:00:00
    owners:
      - finance-controlling
    refresh_frequency: Daily

  - name: fact_budget_variance
    description: Chênh lệch giữa ngân sách và chi phí doanh thu thực tế
    domain: Tài chính
    platform: Redshift
    tags:
      - transaction
      - variance
    columns:
      - name: variance_id
        description: Mã định danh chênh lệch
        data_type: bigint
        nullable: false
        business_definition: Khóa chính, mã duy nhất cho mỗi bản ghi chênh lệch
        example: 60000001
      - name: cost_center_id
        description: Mã trung tâm chi phí
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_cost_center
        example: CC-5001-ASM
      - name: profit_center_id
        description: Mã trung tâm lợi nhuận
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_profit_center
        example: PC-VF8
      - name: gl_account_id
        description: Mã tài khoản
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_gl_account
        example: 6271
      - name: fiscal_year
        description: Năm tài chính
        data_type: int
        nullable: false
        business_definition: Năm tài chính đánh giá
        example: 2024
      - name: fiscal_period
        description: Kỳ đánh giá
        data_type: int
        nullable: false
        business_definition: Tháng đánh giá từ 1 đến 12
        example: 8
      - name: budget_amount
        description: Ngân sách
        data_type: decimal
        nullable: false
        business_definition: Số tiền ngân sách đã được phê duyệt cho kỳ
        example: 2000000000.00
      - name: actual_amount
        description: Thực tế
        data_type: decimal
        nullable: false
        business_definition: Số tiền thực tế phát sinh trong kỳ
        example: 2150000000.00
      - name: variance_amount
        description: Chênh lệch
        data_type: decimal
        nullable: false
        business_definition: actual_amount trừ budget_amount, dương là vượt ngân sách
        example: 150000000.00
      - name: variance_pct
        description: Tỷ lệ chênh lệch phần trăm
        data_type: decimal
        nullable: true
        business_definition: Variance_amount chia budget_amount nhân 100%
        example: 7.50
      - name: variance_type
        description: Loại chênh lệch
        data_type: varchar
        nullable: false
        business_definition: Unfavorable nếu chi vượt hoặc thu thấp hơn, Favorable nếu ngược lại
        example: Unfavorable
      - name: variance_reason
        description: Nguyên nhân chênh lệch
        data_type: varchar
        nullable: true
        business_definition: Giải trình lý do chênh lệch từ bộ phận quản lý
        example: Tăng sản lượng ngoài kế hoạch
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tạo bản ghi
        example: 2024-09-05 10:00:00
    owners:
      - finance-controlling
    refresh_frequency: Daily

  - name: fact_revenue
    description: Doanh thu bán xe và dịch vụ theo từng kỳ
    domain: Tài chính
    platform: Redshift
    tags:
