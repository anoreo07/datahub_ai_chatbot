datasets:
  - name: dim_product
    description: Danh mục sản phẩm xe ô tô, bao gồm tất cả phiên bản và tùy chọn
    domain: Sản xuất
    platform: Redshift
    tags:
      - master-data
      - product
    columns:
      - name: product_id
        description: Mã định danh duy nhất của sản phẩm xe
        data_type: varchar
        nullable: false
        business_definition: Khóa chính, mã sản phẩm được sinh tự động theo format VF-{dòng xe}-{phiên bản}
        example: VF-VF8-PLUS
      - name: model_name
        description: Tên dòng xe
        data_type: varchar
        nullable: false
        business_definition: Tên thương mại của dòng xe, ví dụ VF e34, VF 8, VF 9
        example: VF 8
      - name: variant
        description: Phiên bản của dòng xe
        data_type: varchar
        nullable: true
        business_definition: Phiên bản cấu hình như Eco, Plus, Premium
        example: Plus
      - name: body_type
        description: Kiểu thân xe
        data_type: varchar
        nullable: false
        business_definition: Phân loại theo cấu trúc thân xe như SUV, Sedan, Hatchback
        example: SUV
      - name: fuel_type
        description: Loại nhiên liệu
        data_type: varchar
        nullable: false
        business_definition: Động cơ sử dụng xăng, điện, hybrid hoặc xăng-điện kết hợp
        example: Electric
      - name: battery_capacity_kwh
        description: Dung lượng pin tính bằng kWh
        data_type: decimal
        nullable: true
        business_definition: Dung lượng pin của xe điện, áp dụng với dòng xe điện
        example: 82.0
      - name: engine_power_hp
        description: Công suất động cơ tính bằng mã lực
        data_type: decimal
        nullable: true
        business_definition: Công suất tối đa của động cơ
        example: 349.0
      - name: seating_capacity
        description: Số chỗ ngồi
        data_type: int
        nullable: false
        business_definition: Số ghế tối đa trên xe
        example: 5
      - name: exterior_color
        description: Màu sắc ngoại thất
        data_type: varchar
        nullable: true
        business_definition: Mã màu sơn ngoài thân xe theo danh mục màu VinFast
        example: Đỏ
      - name: interior_material
        description: Chất liệu nội thất
        data_type: varchar
        nullable: true
        business_definition: Loại vật liệu bọc ghế và trang trí nội thất
        example: Da cao cấp
      - name: standard_warranty_months
        description: Thời gian bảo hành tiêu chuẩn tính bằng tháng
        data_type: int
        nullable: false
        business_definition: Số tháng bảo hành chính hãng cho xe mới
        example: 60
      - name: base_price
        description: Giá niêm yết cơ bản chưa bao gồm tùy chọn
        data_type: decimal
        nullable: false
        business_definition: Giá bán lẻ đề xuất của nhà sản xuất
        example: 1050000000.00
      - name: product_status
        description: Trạng thái sản phẩm
        data_type: varchar
        nullable: false
        business_definition: Trạng thái vòng đời sản phẩm, Active là đang sản xuất, Discontinued là ngừng sản xuất
        example: Active
      - name: launch_date
        description: Ngày ra mắt sản phẩm
        data_type: date
        nullable: true
        business_definition: Ngày chính thức giới thiệu sản phẩm ra thị trường
        example: 2023-06-15
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tự động ghi nhận khi bản ghi được tạo trong hệ thống
        example: 2024-01-01 08:00:00
    owners:
      - product-master-team
    refresh_frequency: Daily

  - name: dim_plant
    description: Danh mục nhà máy sản xuất của VinFast
    domain: Sản xuất
    platform: Redshift
    tags:
      - master-data
      - plant
    columns:
      - name: plant_id
        description: Mã định danh nhà máy
        data_type: varchar
        nullable: false
        business_definition: Khóa chính, mã nhà máy gồm 4 ký tự
        example: VFHP
      - name: plant_name
        description: Tên nhà máy
        data_type: varchar
        nullable: false
        business_definition: Tên đầy đủ của nhà máy sản xuất
        example: Nhà máy VinFast Hải Phòng
      - name: plant_location
        description: Địa điểm nhà máy
        data_type: varchar
        nullable: false
        business_definition: Tỉnh/thành phố nơi đặt nhà máy
        example: Hải Phòng
      - name: plant_area_sqm
        description: Diện tích nhà máy tính bằng mét vuông
        data_type: decimal
        nullable: true
        business_definition: Tổng diện tích mặt bằng của nhà máy
        example: 335000.00
      - name: production_capacity_per_year
        description: Công suất sản xuất hàng năm
        data_type: int
        nullable: true
        business_definition: Số lượng xe tối đa có thể sản xuất trong một năm
        example: 250000
      - name: plant_status
        description: Trạng thái hoạt động nhà máy
        data_type: varchar
        nullable: false
        business_definition: Trạng thái vận hành của nhà máy, Active hoặc Inactive
        example: Active
      - name: operating_since
        description: Ngày đi vào hoạt động
        data_type: date
        nullable: true
        business_definition: Ngày nhà máy bắt đầu đi vào sản xuất chính thức
        example: 2019-06-14
      - name: plant_manager
        description: Giám đốc nhà máy
        data_type: varchar
        nullable: true
        business_definition: Họ tên người quản lý điều hành nhà máy
        example: Nguyễn Văn A
      - name: shift_model
        description: Mô hình ca làm việc
        data_type: varchar
        nullable: false
        business_definition: Số ca sản xuất mỗi ngày, thường là 2Shift, 3Shift
        example: 3Shift
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tự động ghi nhận khi bản ghi được tạo
        example: 2024-01-01 08:00:00
    owners:
      - plant-operations
    refresh_frequency: Daily

  - name: dim_assembly_line
    description: Danh mục dây chuyền lắp ráp trong nhà máy
    domain: Sản xuất
    platform: Redshift
    tags:
      - master-data
      - assembly-line
    columns:
      - name: assembly_line_id
        description: Mã định danh dây chuyền
        data_type: varchar
        nullable: false
        business_definition: Khóa chính, mã định danh duy nhất cho mỗi dây chuyền
        example: AL-BODY-01
      - name: plant_id
        description: Mã nhà máy
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_plant, xác định nhà máy sở hữu dây chuyền
        example: VFHP
      - name: line_name
        description: Tên dây chuyền
        data_type: varchar
        nullable: false
        business_definition: Tên mô tả dây chuyền lắp ráp
        example: Dây chuyền hàn thân xe số 1
      - name: line_type
        description: Loại dây chuyền
        data_type: varchar
        nullable: false
        business_definition: Phân loại dây chuyền theo công đoạn sản xuất như BodyShop, PaintShop, Assembly, Trim
        example: BodyShop
      - name: cycle_time_seconds
        description: Thời gian chu kỳ tính bằng giây
        data_type: int
        nullable: false
        business_definition: Thời gian tối đa cho phép để hoàn thành một công đoạn trên dây chuyền
        example: 120
      - name: line_speed
        description: Tốc độ dây chuyền
        data_type: decimal
        nullable: true
        business_definition: Số lượng sản phẩm đi qua dây chuyền trong một giờ
        example: 30.0
      - name: length_meters
        description: Chiều dài dây chuyền tính bằng mét
        data_type: decimal
        nullable: true
        business_definition: Tổng chiều dài vật lý của dây chuyền lắp ráp
        example: 450.00
      - name: line_status
        description: Trạng thái dây chuyền
        data_type: varchar
        nullable: false
        business_definition: Trạng thái vận hành Running, Stopped, Maintenance
        example: Running
      - name: supervisor_id
        description: Mã giám sát dây chuyền
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_worker, người chịu trách nhiệm dây chuyền
        example: WRK0045
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tự động ghi nhận khi bản ghi được tạo
        example: 2024-01-01 08:00:00
    owners:
      - plant-operations
    refresh_frequency: Daily

  - name: dim_station
    description: Danh mục trạm làm việc trên dây chuyền lắp ráp
    domain: Sản xuất
    platform: Redshift
    tags:
      - master-data
      - station
    columns:
      - name: station_id
        description: Mã định danh trạm làm việc
        data_type: varchar
        nullable: false
        business_definition: Khóa chính, mã duy nhất cho mỗi trạm làm việc
        example: STN-WELD-015
      - name: assembly_line_id
        description: Mã dây chuyền
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_assembly_line, xác định dây chuyền chứa trạm
        example: AL-BODY-01
      - name: station_code
        description: Mã trạm
        data_type: varchar
        nullable: false
        business_definition: Mã ngắn gọn theo quy ước nhà máy
        example: W015
      - name: station_name
        description: Tên trạm làm việc
        data_type: varchar
        nullable: false
        business_definition: Mô tả công việc thực hiện tại trạm
        example: Hàn cụm cửa trái
      - name: station_type
        description: Loại trạm
        data_type: varchar
        nullable: false
        business_definition: Phân loại trạm Manual, SemiAuto, Auto
        example: SemiAuto
      - name: sequence_number
        description: Số thứ tự trên dây chuyền
        data_type: int
        nullable: false
        business_definition: Vị trí của trạm trên dây chuyền, số càng nhỏ càng đầu quy trình
        example: 15
      - name: standard_cycle_time
        description: Thời gian chu kỳ tiêu chuẩn giây
        data_type: int
        nullable: false
        business_definition: Thời gian tiêu chuẩn để hoàn thành thao tác tại trạm
        example: 120
      - name: min_workers_required
        description: Số công nhân tối thiểu
        data_type: int
        nullable: false
        business_definition: Số lượng công nhân tối thiểu cần bố trí tại trạm để vận hành
        example: 2
      - name: station_status
        description: Trạng thái trạm
        data_type: varchar
        nullable: false
        business_definition: Trạng thái hoạt động Operational, UnderMaintenance, Closed
        example: Operational
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp tự động ghi nhận khi bản ghi được tạo
        example: 2024-01-01 08:00:00
    owners:
      - plant-operations
    refresh_frequency: Daily

  - name: fact_production_order
    description: Lệnh sản xuất xe, bao gồm thông tin chi tiết từng lô xe được sản xuất
    domain: Sản xuất
    platform: Redshift
    tags:
      - transaction
      - production
    columns:
      - name: order_id
        description: Mã định danh lệnh sản xuất
        data_type: varchar
        nullable: false
        business_definition: Khóa chính, mã lệnh sản xuất duy nhất được sinh từ hệ thống ERP
        example: PO-2024-08-000123
      - name: product_id
        description: Mã sản phẩm
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_product, xác định dòng xe cần sản xuất
        example: VF-VF8-PLUS
      - name: plant_id
        description: Mã nhà máy
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_plant, nơi thực hiện lệnh sản xuất
        example: VFHP
      - name: assembly_line_id
        description: Mã dây chuyền
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_assembly_line, dây chuyền phụ trách sản xuất
        example: AL-ASM-01
      - name: order_quantity
        description: Số lượng xe theo lệnh
        data_type: int
        nullable: false
        business_definition: Tổng số lượng xe cần sản xuất theo lệnh
        example: 50
      - name: order_date
        description: Ngày tạo lệnh
        data_type: date
        nullable: false
        business_definition: Ngày lệnh sản xuất được khởi tạo trong hệ thống
        example: 2024-08-15
      - name: planned_start_date
        description: Ngày bắt đầu kế hoạch
        data_type: date
        nullable: false
        business_definition: Ngày dự kiến bắt đầu sản xuất theo kế hoạch sản xuất tổng thể
        example: 2024-08-20
      - name: planned_end_date
        description: Ngày kết thúc kế hoạch
        data_type: date
        nullable: false
        business_definition: Ngày dự kiến hoàn thành lệnh sản xuất
        example: 2024-09-05
      - name: actual_start_date
        description: Ngày bắt đầu thực tế
        data_type: date
        nullable: true
        business_definition: Ngày thực tế bắt đầu sản xuất lô xe
        example: 2024-08-20
      - name: actual_end_date
        description: Ngày kết thúc thực tế
        data_type: date
        nullable: true
        business_definition: Ngày thực tế hoàn thành lệnh sản xuất
        example: 2024-09-06
      - name: order_status
        description: Trạng thái lệnh sản xuất
        data_type: varchar
        nullable: false
        business_definition: Trạng thái của lệnh gồm Created, Released, InProgress, Completed, Cancelled
        example: InProgress
      - name: priority
        description: Mức độ ưu tiên
        data_type: varchar
        nullable: false
        business_definition: Mức ưu tiên xử lý lệnh, gồm Normal, High, Urgent
        example: High
      - name: customer_order_ref
        description: Tham chiếu đơn hàng khách
        data_type: varchar
        nullable: true
        business_definition: Mã đơn hàng của khách hàng nếu thuộc đơn đặt hàng cụ thể
        example: SO-2024-08-005678
      - name: created_at
        description: Thời điểm tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Timestamp ghi nhận thời điểm nhập lệnh vào hệ thống
        example: 2024-08-15 09:30:00
    owners:
      - production-planning
    refresh_frequency: Daily

  - name: fact_production_output
    description: Sản lượng sản xuất thực tế theo từng ca và dây chuyền
    domain: Sản xuất
    platform: Redshift
    tags:
      - transaction
      - output
    columns:
      - name: output_id
        description: Mã định danh bản ghi sản lượng
        data_type: bigint
        nullable: false
        business_definition: Khóa chính, sinh tự động từ sequence
        example: 1000001
      - name: order_id
        description: Mã lệnh sản xuất
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến fact_production_order
        example: PO-2024-08-000123
      - name: shift_id
        description: Mã ca làm việc
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_shift
        example: SHIFT-A-20240820
      - name: assembly_line_id
        description: Mã dây chuyền
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_assembly_line
        example: AL-ASM-01
      - name: station_id
        description: Mã trạm
        data_type: varchar
        nullable: true
        business_definition: Khóa ngoại tham chiếu đến dim_station
        example: STN-ASM-035
      - name: output_date
        description: Ngày sản xuất
        data_type: date
        nullable: false
        business_definition: Ngày ghi nhận sản lượng
        example: 2024-08-21
      - name: product_id
        description: Mã sản phẩm
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_product
        example: VF-VF8-PLUS
      - name: vin_number
        description: Số VIN của xe
        data_type: varchar
        nullable: true
        business_definition: Số nhận dạng xe duy nhất gồm 17 ký tự theo tiêu chuẩn quốc tế, được gán khi xe hoàn thiện
        example: VLFV8P30XP80012345
      - name: good_quantity
        description: Số lượng đạt chuẩn
        data_type: int
        nullable: false
        business_definition: Số sản phẩm đạt chất lượng sau kiểm tra
        example: 45
      - name: reject_quantity
        description: Số lượng lỗi
        data_type: int
        nullable: false
        business_definition: Số sản phẩm không đạt chất lượng cần sửa chữa hoặc loại bỏ
        example: 2
      - name: rework_quantity
        description: Số lượng cần làm lại
        data_type: int
        nullable: false
        business_definition: Số sản phẩm cần sửa lỗi trước khi đạt chuẩn
        example: 3
      - name: recorded_at
        description: Thời điểm ghi nhận
        data_type: timestamp
        nullable: false
        business_definition: Timestamp ghi nhận thời điểm cập nhật sản lượng
        example: 2024-08-21 16:30:00
    owners:
      - production-supervisor
    refresh_frequency: Hourly

  - name: fact_defect_tracking
    description: Theo dõi lỗi phát sinh trong quá trình sản xuất và lắp ráp
    domain: Sản xuất
    platform: Redshift
    tags:
      - transaction
      - quality
    columns:
      - name: defect_id
        description: Mã định danh lỗi
        data_type: bigint
        nullable: false
        business_definition: Khóa chính, mã duy nhất cho mỗi lỗi phát hiện
        example: 5001234
      - name: order_id
        description: Mã lệnh sản xuất
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến fact_production_order
        example: PO-2024-08-000123
      - name: vin_number
        description: Số VIN xe bị lỗi
        data_type: varchar
        nullable: true
        business_definition: Số VIN của xe phát hiện lỗi, null nếu lỗi phát hiện trước khi gán VIN
        example: VLFV8P30XP80012347
      - name: station_id
        description: Mã trạm phát hiện lỗi
        data_type: varchar
        nullable: false
        business_definition: Khóa ngoại tham chiếu đến dim_station, trạm phát hiện ra lỗi
        example: STN-PNT-022
      - name: defect_code
        description: Mã loại lỗi
        data_type: varchar
        nullable: false
        business_definition: Mã phân loại lỗi theo danh mục chất lượng, ví dụ PAINT-SCRATCH, WELD-GAP
        example: PAINT-DUST
      - name: defect_description
        description: Mô tả chi tiết lỗi
        data_type: varchar
        nullable: false
        business_definition: Nội dung mô tả chi tiết về lỗi phát hiện được
        example: Bụi bẩn trong lớp sơn cửa trái
      - name: defect_severity
        description: Mức độ nghiêm trọng
        data_type: varchar
        nullable: false
        business_definition: Phân loại mức độ Critical, Major, Minor
        example: Major
      - name: defect_category
        description: Nhóm lỗi
        data_type: varchar
        nullable: false
        business_definition: Nhóm nguyên nhân gốc rễ như Material, Process, Equipment, Human
        example: Process
      - name: detected_at
        description: Thời điểm phát hiện
        data_type: timestamp
        nullable: false
        business_definition: Thời gian phát hiện lỗi tại trạm kiểm tra
        example: 2024-08-21 10:15:00
      - name: reported_by
        description: Người phát hiện lỗi
        data_type: varchar
        nullable: true
        business_definition: Mã công nhân hoặc hệ thống phát hiện lỗi
        example: WRK0123
      - name: root_cause
        description: Nguyên nhân gốc rễ
        data_type: varchar
        nullable: true
        business_definition: Kết quả phân tích nguyên nhân gốc rễ sau khi điều tra
        example: Nhiệt độ sấy không đạt chuẩn
      - name: corrective_action
        description: Hành động khắc phục
        data_type: varchar
        nullable: true
