datasets:
  - name: dim_service_center
    description: Thông tin các trung tâm dịch vụ ủy quyền và trạm bảo dưỡng VinFast
    domain: Hậu mãi
    platform: Redshift
    tags:
      - service
      - master-data
    columns:
      - name: service_center_id
        description: Mã trung tâm dịch vụ
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất của trung tâm dịch vụ
        example: SC_HN_001
      - name: center_code
        description: Mã viết tắt
        data_type: varchar
        nullable: false
        business_definition: Mã viết tắt của trung tâm dịch vụ
        example: VF_SVC_HN_TAN_XUAN
      - name: center_name
        description: Tên trung tâm
        data_type: varchar
        nullable: false
        business_definition: Tên đầy đủ của trung tâm dịch vụ
        example: Trạm dịch vụ VinFast Tân Xuân
      - name: center_type
        description: Loại trung tâm
        data_type: varchar
        nullable: true
        business_definition: Phân loại: Trạm dịch vụ, Trung tâm bảo dưỡng, Xưởng sửa chữa chuyên sâu
        example: Trạm dịch vụ
      - name: dealer_id
        description: Mã đại lý
        data_type: varchar
        nullable: true
        business_definition: Mã đại lý liên kết với trung tâm dịch vụ (nếu là 3S)
        example: DL_HN_00123
      - name: region_id
        description: Mã khu vực
        data_type: varchar
        nullable: true
        business_definition: Mã khu vực địa lý quản lý trung tâm
        example: REG_BB
      - name: province
        description: Tỉnh/Thành phố
        data_type: varchar
        nullable: true
        business_definition: Tỉnh thành nơi đặt trung tâm
        example: Hà Nội
      - name: address
        description: Địa chỉ
        data_type: varchar
        nullable: true
        business_definition: Địa chỉ đầy đủ của trung tâm
        example: Quốc lộ 6, Xã Tân Xuân
      - name: phone
        description: Số điện thoại
        data_type: varchar
        nullable: true
        business_definition: Số điện thoại đường dây nóng
        example: 1900232389
      - name: working_hours
        description: Giờ làm việc
        data_type: varchar
        nullable: true
        business_definition: Khung giờ phục vụ khách hàng
        example: 07:30-17:30, Thứ 2-Chủ nhật
      - name: capacity_per_day
        description: Công suất/ngày
        data_type: int
        nullable: true
        business_definition: Số lượng xe tối đa có thể tiếp nhận mỗi ngày
        example: 20
      - name: status
        description: Trạng thái
        data_type: varchar
        nullable: true
        business_definition: Trạng thái hoạt động: Hoạt động, Bảo trì, Đóng cửa
        example: Hoạt động
    owners:
      - after_sales_ops
    refresh_frequency: Daily

  - name: dim_warranty_policy
    description: Danh mục chính sách bảo hành xe và phụ tùng
    domain: Hậu mãi
    platform: Redshift
    tags:
      - warranty
      - master-data
    columns:
      - name: warranty_policy_id
        description: Mã chính sách bảo hành
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất của chính sách bảo hành
        example: BH_VF8_2024
      - name: policy_name
        description: Tên chính sách
        data_type: varchar
        nullable: false
        business_definition: Tên chính sách bảo hành
        example: Bảo hành VinFast VF 8 tiêu chuẩn
      - name: applicable_model_id
        description: Mã model áp dụng
        data_type: varchar
        nullable: true
        business_definition: Model xe được áp dụng chính sách bảo hành
        example: VF8
      - name: warranty_type
        description: Loại bảo hành
        data_type: varchar
        nullable: true
        business_definition: Phân loại: Xe mới, Phụ tùng, Pin, Sơn, Chống gỉ
        example: Xe mới
      - name: duration_months
        description: Thời hạn (tháng)
        data_type: int
        nullable: true
        business_definition: Thời hạn bảo hành tính bằng tháng
        example: 84
      - name: distance_limit_km
        description: Giới hạn km
        data_type: int
        nullable: true
        business_definition: Giới hạn số km tối đa được bảo hành
        example: 160000
      - name: coverage_description
        description: Mô tả phạm vi bảo hành
        data_type: varchar
        nullable: true
        business_definition: Chi tiết các hạng mục được bảo hành
        example: Động cơ điện, bộ pin, hệ thống treo, hệ thống điện tử
      - name: exclusion_items
        description: Các mục không bảo hành
        data_type: varchar
        nullable: true
        business_definition: Các hạng mục không nằm trong phạm vi bảo hành
        example: Hao mòn tự nhiên, lốp, má phanh, cần gạt nước
      - name: effective_date
        description: Ngày hiệu lực
        data_type: date
        nullable: true
        business_definition: Ngày bắt đầu áp dụng chính sách
        example: "2024-01-01"
      - name: policy_status
        description: Trạng thái
        data_type: varchar
        nullable: true
        business_definition: Trạng thái: Hiện hành, Hết hạn, Sắp áp dụng
        example: Hiện hành
    owners:
      - after_sales_ops
    refresh_frequency: Daily

  - name: fact_service_appointment
    description: Lịch hẹn dịch vụ bảo dưỡng và sửa chữa của khách hàng
    domain: Hậu mãi
    platform: Redshift
    tags:
      - service
      - appointment
    columns:
      - name: appointment_id
        description: Mã lịch hẹn
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất cho lịch hẹn dịch vụ
        example: APPT_202408_000456
      - name: customer_id
        description: Mã khách hàng
        data_type: varchar
        nullable: false
        business_definition: Mã khách hàng đặt lịch hẹn
        example: KH_202403_0012345
      - name: service_center_id
        description: Mã trung tâm dịch vụ
        data_type: varchar
        nullable: false
        business_definition: Mã trung tâm dịch vụ tiếp nhận lịch hẹn
        example: SC_HN_001
      - name: vin_number
        description: Số VIN xe
        data_type: varchar
        nullable: false
        business_definition: Số nhận dạng xe cần bảo dưỡng/sửa chữa
        example: VIN6543210987654321
      - name: appointment_date
        description: Ngày hẹn
        data_type: date
        nullable: false
        business_definition: Ngày khách hàng hẹn đến trung tâm
        example: "2024-08-15"
      - name: appointment_time
        description: Giờ hẹn
        data_type: varchar
        nullable: true
        business_definition: Khung giờ khách hàng đặt lịch
        example: 09:00
      - name: service_type
        description: Loại dịch vụ
        data_type: varchar
        nullable: true
        business_definition: Loại: Bảo dưỡng định kỳ, Sửa chữa, Kiểm tra, Thu hồi
        example: Bảo dưỡng định kỳ
      - name: appointment_status
        description: Trạng thái
        data_type: varchar
        nullable: true
        business_definition: Trạng thái: Đã đặt, Đã xác nhận, Đã đến, Hoàn thành, Vắng mặt, Hủy
        example: Đã xác nhận
      - name: odometer_km
        description: Số km hiện tại
        data_type: int
        nullable: true
        business_definition: Số km trên đồng hồ xe tại thời điểm đặt lịch
        example: 12500
      - name: notes
        description: Ghi chú
        data_type: varchar
        nullable: true
        business_definition: Yêu cầu đặc biệt của khách hàng
        example: Xe có tiếng ồn lạ khi tăng tốc
      - name: created_date
        description: Ngày tạo lịch
        data_type: date
        nullable: true
        business_definition: Ngày khách hàng tạo lịch hẹn trên hệ thống
        example: "2024-08-10"
    owners:
      - after_sales_ops
    refresh_frequency: Daily

  - name: fact_service_order
    description: Phiếu sửa chữa và chi tiết dịch vụ thực hiện cho xe
    domain: Hậu mãi
    platform: Redshift
    tags:
      - service
      - transactional
    columns:
      - name: service_order_id
        description: Mã phiếu dịch vụ
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất cho phiếu sửa chữa
        example: SR_202408_000789
      - name: appointment_id
        description: Mã lịch hẹn
        data_type: varchar
        nullable: true
        business_definition: Mã lịch hẹn tham chiếu
        example: APPT_202408_000456
      - name: customer_id
        description: Mã khách hàng
        data_type: varchar
        nullable: false
        business_definition: Mã khách hàng sử dụng dịch vụ
        example: KH_202403_0012345
      - name: service_center_id
        description: Mã trung tâm dịch vụ
        data_type: varchar
        nullable: false
        business_definition: Mã trung tâm thực hiện dịch vụ
        example: SC_HN_001
      - name: vin_number
        description: Số VIN xe
        data_type: varchar
        nullable: false
        business_definition: Số nhận dạng xe
        example: VIN6543210987654321
      - name: received_date
        description: Ngày tiếp nhận
        data_type: date
        nullable: false
        business_definition: Ngày xe được tiếp nhận vào xưởng
        example: "2024-08-15"
      - name: completion_date
        description: Ngày hoàn thành
        data_type: date
        nullable: true
        business_definition: Ngày hoàn thành sửa chữa và bàn giao xe
        example: "2024-08-15"
      - name: service_type
        description: Loại dịch vụ
        data_type: varchar
        nullable: true
        business_definition: Bảo dưỡng, Sửa chữa nhẹ, Sửa chữa lớn, Sơn, Vá lốp
        example: Bảo dưỡng
      - name: odometer_in
        description: Số km khi vào
        data_type: int
        nullable: true
        business_definition: Số km khi xe vào xưởng
        example: 12500
      - name: labor_hours
        description: Giờ công
        data_type: decimal
        nullable: true
        business_definition: Tổng số giờ công thực hiện dịch vụ
        example: 2.5
      - name: total_labor_cost
        description: Tiền công
        data_type: decimal
        nullable: true
        business_definition: Tổng chi phí nhân công dịch vụ
        example: 750000.00
      - name: total_part_cost
        description: Tiền phụ tùng
        data_type: decimal
        nullable: true
        business_definition: Tổng giá trị phụ tùng sử dụng
        example: 1250000.00
      - name: total_amount
        description: Tổng tiền
        data_type: decimal
        nullable: true
        business_definition: Tổng giá trị hóa đơn dịch vụ (công + phụ tùng + thuế)
        example: 2200000.00
      - name: payment_status
        description: Trạng thái thanh toán
        data_type: varchar
        nullable: true
        business_definition: Đã thanh toán, Chờ thanh toán, Bảo hành, Còn nợ
        example: Đã thanh toán
      - name: technician_id
        description: Mã kỹ thuật viên
        data_type: varchar
        nullable: true
        business_definition: Mã kỹ thuật viên phụ trách chính
        example: KT_HN_001
    owners:
      - after_sales_ops
    refresh_frequency: Daily

  - name: fact_warranty_claim
    description: Yêu cầu bảo hành từ đại lý và trung tâm dịch vụ
    domain: Hậu mãi
    platform: Redshift
    tags:
      - warranty
      - claim
    columns:
      - name: warranty_claim_id
        description: Mã yêu cầu bảo hành
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất cho yêu cầu bảo hành
        example: WC_202408_000234
      - name: service_order_id
        description: Mã phiếu dịch vụ
        data_type: varchar
        nullable: false
        business_definition: Mã phiếu dịch vụ liên quan
        example: SR_202408_000789
      - name: customer_id
        description: Mã khách hàng
        data_type: varchar
        nullable: false
        business_definition: Mã khách hàng yêu cầu bảo hành
        example: KH_202403_0012345
      - name: service_center_id
        description: Mã trung tâm dịch vụ
        data_type: varchar
        nullable: false
        business_definition: Mã trung tâm gửi yêu cầu bảo hành
        example: SC_HN_001
      - name: claim_date
        description: Ngày yêu cầu
        data_type: date
        nullable: false
        business_definition: Ngày gửi yêu cầu bảo hành
        example: "2024-08-16"
      - name: warranty_policy_id
        description: Mã chính sách bảo hành
        data_type: varchar
        nullable: true
        business_definition: Chính sách bảo hành áp dụng cho yêu cầu
        example: BH_VF8_2024
      - name: defect_category
        description: Loại lỗi
        data_type: varchar
        nullable: true
        business_definition: Phân loại lỗi: Động cơ, Pin, Điện tử, Nội thất, Ngoại thất, Hệ thống phanh
        example: Điện tử
      - name: defect_description
        description: Mô tả lỗi
        data_type: varchar
        nullable: true
        business_definition: Mô tả chi tiết về lỗi của khách hàng
        example: Màn hình trung tâm bị đơ khi sử dụng Apple CarPlay
      - name: repair_action
        description: Hành động sửa chữa
        data_type: varchar
        nullable: true
        business_definition: Hành động khắc phục đã thực hiện
        example: Cập nhật phần mềm mới cho màn hình
      - name: claim_amount
        description: Số tiền yêu cầu
        data_type: decimal
        nullable: true
        business_definition: Chi phí yêu cầu bảo hành (công + phụ tùng)
        example: 500000.00
      - name: approved_amount
        description: Số tiền duyệt
        data_type: decimal
        nullable: true
        business_definition: Số tiền được duyệt chi trả bảo hành
        example: 450000.00
      - name: claim_status
        description: Trạng thái
        data_type: varchar
        nullable: true
        business_definition: Đã gửi, Đang thẩm định, Chấp nhận, Từ chối, Đã thanh toán
        example: Chấp nhận
      - name: rejection_reason
        description: Lý do từ chối
        data_type: varchar
        nullable: true
        business_definition: Lý do từ chối bảo hành (nếu bị từ chối)
        example: ""
    owners:
      - warranty_management
    refresh_frequency: Daily

  - name: fact_maintenance_record
    description: Lịch sử bảo dưỡng định kỳ của từng xe
    domain: Hậu mãi
    platform: Redshift
    tags:
      - maintenance
      - vehicle
    columns:
      - name: maintenance_id
        description: Mã bảo dưỡng
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất cho phiếu bảo dưỡng
        example: MT_202408_000567
      - name: vin_number
        description: Số VIN xe
        data_type: varchar
        nullable: false
        business_definition: Số nhận dạng xe
        example: VIN6543210987654321
      - name: customer_id
        description: Mã khách hàng
        data_type: varchar
        nullable: false
        business_definition: Mã khách hàng chủ xe
        example: KH_202403_0012345
      - name: service_center_id
        description: Mã trung tâm dịch vụ
        data_type: varchar
        nullable: false
        business_definition: Mã trung tâm thực hiện bảo dưỡng
        example: SC_HN_001
      - name: service_order_id
        description: Mã phiếu dịch vụ
        data_type: varchar
        nullable: true
        business_definition: Mã tham chiếu đến phiếu dịch vụ tương ứng
        example: SR_202408_000789
      - name: maintenance_type
        description: Loại bảo dưỡng
        data_type: varchar
        nullable: true
        business_definition: Bảo dưỡng cấp 1, Bảo dưỡng cấp 2, Bảo dưỡng theo km
        example: Bảo dưỡng cấp 1
      - name: odometer_km
        description: Số km lúc bảo dưỡng
        data_type: int
        nullable: true
        business_definition: Số km trên đồng hồ tại thời điểm bảo dưỡng
        example: 12500
      - name: maintenance_date
        description: Ngày bảo dưỡng
        data_type: date
        nullable: false
        business_definition: Ngày thực hiện bảo dưỡng
        example: "2024-08-15"
      - name: next_maintenance_km
        description: Km bảo dưỡng tiếp theo
        data_type: int
        nullable: true
        business_definition: Số km dự kiến cho lần bảo dưỡng tiếp theo
        example: 17500
      - name: next_maintenance_date
        description: Ngày bảo dưỡng tiếp theo
        data_type: date
        nullable: true
        business_definition: Ngày dự kiến bảo dưỡng tiếp theo
        example: "2025-02-15"
      - name: performed_items
        description: Các hạng mục đã thực hiện
        data_type: varchar
        nullable: true
        business_definition: Danh sách các hạng mục bảo dưỡng đã thực hiện
        example: Thay dầu phanh, kiểm tra pin, cân chỉnh lốp
      - name: total_cost
        description: Tổng chi phí
        data_type: decimal
        nullable: true
        business_definition: Tổng chi phí bảo dưỡng
        example: 0.00
      - name: warranty_covered
        description: Bảo hành chi trả
        data_type: varchar
        nullable: true
        business_definition: Cờ xác định bảo dưỡng được bảo hành chi trả: Y/N
        example: Y
    owners:
      - after_sales_ops
    refresh_frequency: Daily

  - name: dim_spare_part
    description: Danh mục phụ tùng, linh kiện thay thế VinFast
    domain: Hậu mãi
    platform: Redshift
    tags:
      - spare-part
      - master-data
    columns:
      - name: part_id
        description: Mã phụ tùng
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất của phụ tùng
        example: PT_VF8_BRAKE_PAD_001
      - name: part_name
        description: Tên phụ tùng
        data_type: varchar
        nullable: false
        business_definition: Tên gọi của phụ tùng
        example: Má phanh trước VF8
      - name: part_category
        description: Nhóm phụ tùng
        data_type: varchar
        nullable: true
        business_definition: Phân nhóm: Hệ thống phanh, Động cơ, Điện tử, Nội thất, Ngoại thất
        example: Hệ thống phanh
      - name: applicable_models
        description: Model áp dụng
        data_type: varchar
        nullable: true
        business_definition: Danh sách các model xe sử dụng phụ tùng này
        example: VF8, VF9
      - name: unit_price
        description: Đơn giá
        data_type: decimal
        nullable: true
        business_definition: Giá bán của phụ tùng
        example: 1250000.00
      - name: unit
        description: Đơn vị tính
        data_type: varchar
        nullable: true
        business_definition: Đơn vị: Cái, Bộ, Lít, Mét
        example: Bộ
      - name: manufacturer
        description: Nhà sản xuất
        data_type: varchar
        nullable: true
        business_definition: Nhà sản xuất phụ tùng gốc (OEM)
        example: VinFast
      - name: warranty_months
        description: Bảo hành (tháng)
        data_type: int
        nullable: true
        business_definition: Thời hạn bảo hành của phụ tùng
        example: 12
      - name: min_stock_level
        description: Tồn tối thiểu
        data_type: int
        nullable: true
        business_definition: Mức tồn kho tối thiểu cảnh báo đặt hàng
        example: 10
      - name: status
        description: Trạng thái
        data_type: varchar
        nullable: true
        business_definition: Còn kinh doanh, Ngừng kinh doanh, Tạm hết
        example: Còn kinh doanh
    owners:
      - spare_part_management
    refresh_frequency: Daily

  - name: fact_part_inventory
    description: Tồn kho phụ tùng tại các trung tâm dịch vụ
    domain: Hậu mãi
    platform: Redshift
    tags:
      - inventory
      - spare-part
    columns:
      - name: inventory_id
        description: Mã tồn kho
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất cho bản ghi tồn kho
        example: INV_202408_SC001
      - name: service_center_id
        description: Mã trung tâm dịch vụ
        data_type: varchar
        nullable: false
        business_definition: Mã trung tâm nơi lưu kho
        example: SC_HN_001
      - name: part_id
        description: Mã phụ tùng
        data_type: varchar
        nullable: false
