datasets:
  - name: dim_foreign_vendor
    description: Danh mục nhà cung cấp nước ngoài của VinFast
    domain: Cung ứng (NĐH)
    platform: Redshift
    tags:
      - vendor
      - supply_chain
      - master_data
    columns:
      - name: vendor_id
        description: Mã định danh nhà cung cấp
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi nhà cung cấp nước ngoài, sinh tự động theo hệ thống
        example: VND0001234
      - name: vendor_name
        description: Tên nhà cung cấp
        data_type: varchar
        nullable: false
        business_definition: Tên đầy đủ của tổ chức cung cấp linh kiện/nguyên vật liệu
        example: Samsung SDI Co., Ltd.
      - name: vendor_country
        description: Quốc gia của nhà cung cấp
        data_type: varchar
        nullable: false
        business_definition: Quốc gia nơi nhà cung cấp đặt trụ sở chính hoặc nhà máy sản xuất
        example: Hàn Quốc
      - name: vendor_tier
        description: Cấp nhà cung cấp
        data_type: varchar
        nullable: true
        business_definition: Phân loại cấp độ trong chuỗi cung ứng (Tier 1, Tier 2, Tier 3)
        example: Tier 1
      - name: vendor_category
        description: Loại hình cung cấp
        data_type: varchar
        nullable: true
        business_definition: Nhóm hàng hóa/dịch vụ mà nhà cung cấp cung cấp
        example: Pin & Battery
      - name: vendor_status
        description: Trạng thái nhà cung cấp
        data_type: varchar
        nullable: false
        business_definition: Trạng thái hoạt động của nhà cung cấp (Active/Inactive/Blacklisted/Pending)
        example: Active
      - name: contract_start_date
        description: Ngày bắt đầu hợp đồng
        data_type: date
        nullable: true
        business_definition: Ngày hiệu lực của hợp đồng khung với nhà cung cấp
        example: 2024-01-15
      - name: contract_end_date
        description: Ngày kết thúc hợp đồng
        data_type: date
        nullable: true
        business_definition: Ngày hết hạn của hợp đồng khung với nhà cung cấp
        example: 2026-01-14
      - name: payment_terms
        description: Điều khoản thanh toán
        data_type: varchar
        nullable: true
        business_definition: Thời gian và phương thức thanh toán thỏa thuận với nhà cung cấp
        example: LC 90 days
      - name: vendor_rating
        description: Đánh giá nhà cung cấp
        data_type: decimal
        nullable: true
        business_definition: Điểm đánh giá tổng thể dựa trên chất lượng, giao hàng và giá cả
        example: 4.5
      - name: contact_email
        description: Email liên hệ
        data_type: varchar
        nullable: true
        business_definition: Địa chỉ email chính của đầu mối liên hệ bên nhà cung cấp
        example: procurement@samsungsdi.com
      - name: duns_number
        description: Mã DUNS
        data_type: varchar
        nullable: true
        business_definition: Mã số định danh doanh nghiệp toàn cầu do Dun & Bradstreet cấp
        example: 123456789
      - name: certification
        description: Chứng chỉ đạt được
        data_type: varchar
        nullable: true
        business_definition: Các chứng chỉ chất lượng ISO/TS 16949, ISO 14001 mà nhà cung cấp đạt được
        example: ISO 9001:2015, IATF 16949
      - name: created_at
        description: Thời gian tạo bản ghi
        data_type: timestamp
        nullable: false
        business_definition: Thời điểm hệ thống ghi nhận thông tin nhà cung cấp lần đầu
        example: 2024-01-10 08:30:00
    owners:
      - NDH_PROCUREMENT
    refresh_frequency: Daily

  - name: dim_import_duty
    description: Danh mục thuế nhập khẩu linh kiện ô tô
    domain: Cung ứng (NĐH)
    platform: Redshift
    tags:
      - import
      - tax
      - customs
    columns:
      - name: duty_id
        description: Mã định danh thuế nhập khẩu
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi dòng thuế nhập khẩu áp dụng
        example: DUTY000789
      - name: hs_code
        description: Mã HS
        data_type: varchar
        nullable: false
        business_definition: Mã số hài hòa của mặt hàng nhập khẩu theo quy định quốc tế
        example: 8507.60.00
      - name: duty_rate
        description: Thuế suất nhập khẩu
        data_type: decimal
        nullable: false
        business_definition: Phần trăm thuế nhập khẩu áp dụng lên giá trị hàng hóa
        example: 5.00
      - name: vat_rate
        description: Thuế VAT nhập khẩu
        data_type: decimal
        nullable: false
        business_definition: Thuế giá trị gia tăng áp dụng cho hàng nhập khẩu
        example: 10.00
      - name: special_tax
        description: Thuế tiêu thụ đặc biệt
        data_type: decimal
        nullable: true
        business_definition: Thuế tiêu thụ đặc biệt áp dụng cho một số mặt hàng nhập khẩu
        example: 0.00
      - name: duty_start_date
        description: Ngày bắt đầu hiệu lực
        data_type: date
        nullable: false
        business_definition: Ngày bắt đầu áp dụng mức thuế này
        example: 2024-01-01
      - name: duty_end_date
        description: Ngày kết thúc hiệu lực
        data_type: date
        nullable: true
        business_definition: Ngày hết hiệu lực của mức thuế (null nếu còn hiệu lực)
        example: null
      - name: country_of_origin
        description: Nước xuất xứ
        data_type: varchar
        nullable: false
        business_definition: Quốc gia xuất xứ của hàng hóa để áp dụng thuế ưu đãi
        example: Hàn Quốc
      - name: preferential_tariff
        description: Thuế suất ưu đãi
        data_type: varchar
        nullable: true
        business_definition: Chương trình ưu đãi thuế quan đặc biệt (CPTPP, EVFTA, RCEP, ASEAN)
        example: EVFTA
      - name: preferential_rate
        description: Thuế suất ưu đãi
        data_type: decimal
        nullable: true
        business_definition: Thuế suất ưu đãi nếu có hiệp định thương mại với nước xuất xứ
        example: 1.50
      - name: commodity_description
        description: Mô tả hàng hóa
        data_type: varchar
        nullable: false
        business_definition: Mô tả chi tiết chủng loại hàng hóa áp dụng mức thuế
        example: Bộ pin lithium-ion cho xe điện
      - name: unit_of_measure
        description: Đơn vị tính
        data_type: varchar
        nullable: true
        business_definition: Đơn vị tính thuế (kg, cái, bộ, tấn)
        example: chiếc
      - name: legal_basis
        description: Căn cứ pháp lý
        data_type: varchar
        nullable: true
        business_definition: Văn bản pháp luật quy định mức thuế này
        example: Thông tư 111/2024/TT-BTC
      - name: last_updated
        description: Lần cập nhật cuối
        data_type: timestamp
        nullable: false
        business_definition: Thời điểm cập nhật thông tin thuế nhập khẩu gần nhất
        example: 2025-06-15 14:00:00
    owners:
      - NDH_TAX
    refresh_frequency: Daily

  - name: dim_hs_code
    description: Danh mục mã HS dùng trong nhập khẩu linh kiện ô tô
    domain: Cung ứng (NĐH)
    platform: Redshift
    tags:
      - hs_code
      - customs
      - classification
    columns:
      - name: hs_code
        description: Mã HS 8 chữ số
        data_type: varchar
        nullable: false
        business_definition: Mã số hài hòa 8 chữ số phân loại hàng hóa nhập khẩu
        example: 8708.29.90
      - name: hs_description
        description: Mô tả mã HS
        data_type: varchar
        nullable: false
        business_definition: Mô tả chi tiết mặt hàng theo danh mục HS quốc tế
        example: Bộ phận và phụ tùng thân xe khác
      - name: hs_section
        description: Chương HS
        data_type: varchar
        nullable: true
        business_definition: Chương trong danh mục HS (17-Chương 17)
        example: XVII
      - name: chapter
        description: Chương
        data_type: varchar
        nullable: false
        business_definition: Chương của mã HS (2 chữ số đầu)
        example: 87
      - name: heading
        description: Nhóm
        data_type: varchar
        nullable: true
        business_definition: Nhóm của mã HS (4 chữ số đầu)
        example: 8708
      - name: product_group
        description: Nhóm sản phẩm
        data_type: varchar
        nullable: true
        business_definition: Nhóm hàng hóa tổng hợp (Pin, Motor, Thân xe, Điện tử,...)
        example: Thân xe
      - name: duty_rate_standard
        description: Thuế suất tiêu chuẩn
        data_type: decimal
        nullable: true
        business_definition: Thuế suất nhập khẩu tiêu chuẩn
        example: 25.00
      - name: restricted_import
        description: Hàng nhập khẩu có điều kiện
        data_type: varchar
        nullable: true
        business_definition: Mức độ hạn chế nhập khẩu (Free/Restricted/Prohibited)
        example: Free
      - name: coo_required
        description: Yêu cầu chứng nhận xuất xứ
        data_type: varchar
        nullable: true
        business_definition: Yêu cầu C/O để hưởng thuế ưu đãi (Required/Not Required)
        example: Required
      - name: risk_level
        description: Mức độ rủi ro
        data_type: varchar
        nullable: true
        business_definition: Mức độ rủi ro do hải quan đánh giá (Low/Medium/High)
        example: Low
      - name: valid_from
        description: Hiệu lực từ ngày
        data_type: date
        nullable: false
        business_definition: Ngày mã HS có hiệu lực
        example: 2024-01-01
      - name: valid_to
        description: Hiệu lực đến ngày
        data_type: date
        nullable: true
        business_definition: Ngày mã HS hết hiệu lực
        example: null
      - name: last_update
        description: Cập nhật cuối
        data_type: timestamp
        nullable: false
        business_definition: Thời điểm cập nhật mã HS gần nhất
        example: 2025-01-10 10:00:00
    owners:
      - NDH_CUSTOMS
    refresh_frequency: Daily

  - name: fact_import_order
    description: Đơn nhập khẩu linh kiện từ nhà cung cấp nước ngoài
    domain: Cung ứng (NĐH)
    platform: Redshift
    tags:
      - import
      - purchase_order
      - procurement
    columns:
      - name: import_order_id
        description: Mã đơn nhập khẩu
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi đơn hàng nhập khẩu linh kiện
        example: IMP20250601001
      - name: vendor_id
        description: Mã nhà cung cấp
        data_type: varchar
        nullable: false
        business_definition: Mã nhà cung cấp nước ngoài liên kết với đơn nhập khẩu
        example: VND0001234
      - name: order_date
        description: Ngày đặt hàng
        data_type: date
        nullable: false
        business_definition: Ngày phát hành đơn đặt hàng đến nhà cung cấp
        example: 2025-06-01
      - name: po_number
        description: Số PO
        data_type: varchar
        nullable: false
        business_definition: Số Purchase Order của VinFast cho lô hàng nhập khẩu
        example: PO-VF-2025-06123
      - name: incoterm
        description: Điều kiện Incoterm
        data_type: varchar
        nullable: false
        business_definition: Điều kiện giao hàng quốc tế áp dụng cho đơn hàng (CIF, FOB, EXW, CFR)
        example: CIF Hải Phòng
      - name: currency
        description: Loại tiền tệ
        data_type: varchar
        nullable: false
        business_definition: Đơn vị tiền tệ sử dụng trong giao dịch
        example: USD
      - name: total_amount
        description: Tổng giá trị đơn hàng
        data_type: decimal
        nullable: false
        business_definition: Tổng giá trị lô hàng theo đơn vị tiền tệ giao dịch
        example: 1250000.00
      - name: vnd_amount
        description: Giá trị quy đổi VND
        data_type: decimal
        nullable: true
        business_definition: Giá trị đơn hàng quy đổi sang VND theo tỷ giá tại thời điểm đặt hàng
        example: 31875000000.00
      - name: line_items_count
        description: Số dòng hàng
        data_type: int
        nullable: true
        business_definition: Tổng số mặt hàng/dòng trong đơn hàng
        example: 15
      - name: delivery_date_requested
        description: Ngày yêu cầu giao hàng
        data_type: date
        nullable: true
        business_definition: Ngày yêu cầu giao hàng theo thỏa thuận với nhà cung cấp
        example: 2025-07-15
      - name: delivery_date_actual
        description: Ngày giao hàng thực tế
        data_type: date
        nullable: true
        business_definition: Ngày hàng về đến cảng hoặc kho đích thực tế
        example: 2025-07-20
      - name: order_status
        description: Trạng thái đơn hàng
        data_type: varchar
        nullable: false
        business_definition: Trạng thái hiện tại (Pending/Confirmed/Shipped/Received/Cancelled)
        example: Shipped
      - name: payment_status
        description: Trạng thái thanh toán
        data_type: varchar
        nullable: true
        business_definition: Trạng thái thanh toán (Unpaid/Partially Paid/Paid/Overdue)
        example: Partially Paid
      - name: created_by
        description: Người tạo đơn
        data_type: varchar
        nullable: true
        business_definition: Mã nhân viên thu mua tạo đơn nhập khẩu
        example: EMP00342
      - name: created_at
        description: Thời gian tạo
        data_type: timestamp
        nullable: false
        business_definition: Thời điểm tạo đơn hàng trong hệ thống
        example: 2025-06-01 09:15:00
    owners:
      - NDH_PROCUREMENT
    refresh_frequency: Daily

  - name: fact_customs_declaration
    description: Tờ khai hải quan cho lô hàng nhập khẩu linh kiện
    domain: Cung ứng (NĐH)
    platform: Redshift
    tags:
      - customs
      - declaration
      - import
    columns:
      - name: declaration_id
        description: Mã tờ khai hải quan
        data_type: varchar
        nullable: false
        business_definition: Số tờ khai hải quan do cơ quan hải quan cấp
        example: 103425678901
      - name: import_order_id
        description: Mã đơn nhập khẩu
        data_type: varchar
        nullable: true
        business_definition: Mã đơn nhập khẩu liên quan đến tờ khai
        example: IMP20250601001
      - name: hs_code
        description: Mã HS
        data_type: varchar
        nullable: false
        business_definition: Mã HS của mặt hàng khai báo
        example: 8507.60.00
      - name: customs_branch
        description: Chi cục hải quan
        data_type: varchar
        nullable: false
        business_definition: Chi cục hải quan nơi đăng ký tờ khai
        example: Hải quan Cảng Hải Phòng
      - name: declaration_date
        description: Ngày đăng ký tờ khai
        data_type: date
        nullable: false
        business_definition: Ngày tờ khai được đăng ký với hải quan
        example: 2025-07-18
      - name: clearance_date
        description: Ngày thông quan
        data_type: date
        nullable: true
        business_definition: Ngày lô hàng được thông quan
        example: 2025-07-19
      - name: container_number
        description: Số container
        data_type: varchar
        nullable: true
        business_definition: Số container vận chuyển lô hàng
        example: MSCU4820534
      - name: gross_weight_kg
        description: Tổng trọng lượng
        data_type: decimal
        nullable: true
        business_definition: Tổng trọng lượng lô hàng tính bằng kilogram
        example: 12500.00
      - name: cargo_description
        description: Mô tả hàng hóa
        data_type: varchar
        nullable: false
        business_definition: Mô tả hàng hóa khai báo trên tờ khai
        example: Bộ pin lithium-ion cho xe ô tô điện VF 9
      - name: invoice_value
        description: Giá trị hóa đơn
        data_type: decimal
        nullable: false
        business_definition: Giá trị khai báo theo hóa đơn thương mại
        example: 850000.00
      - name: customs_value
        description: Trị giá hải quan
        data_type: decimal
        nullable: false
        business_definition: Trị giá tính thuế do hải quan xác định
        example: 865000.00
      - name: duty_amount
        description: Số tiền thuế nhập khẩu
        data_type: decimal
        nullable: true
        business_definition: Số tiền thuế nhập khẩu phải nộp
        example: 43250.00
      - name: vat_amount
        description: Số tiền thuế VAT
        data_type: decimal
        nullable: true
        business_definition: Số tiền thuế GTGT hàng nhập khẩu
        example: 86500.00
      - name: declaration_type
        description: Loại tờ khai
        data_type: varchar
        nullable: true
        business_definition: Phân loại tờ khai (Nhập kinh doanh/Nhập gia công/Nhập sản xuất XK)
        example: Nhập kinh doanh
      - name: broker_id
        description: Mã đại lý hải quan
        data_type: varchar
        nullable: true
        business_definition: Mã đại lý làm thủ tục hải quan (nếu có)
        example: DL000561
    owners:
      - NDH_CUSTOMS
    refresh_frequency: Daily

  - name: fact_shipping_manifest
    description: Vận đơn hàng hóa nhập khẩu
    domain: Cung ứng (NĐH)
    platform: Redshift
    tags:
      - shipping
      - logistics
      - manifest
    columns:
      - name: manifest_id
        description: Mã vận đơn
        data_type: varchar
        nullable: false
        business_definition: Số vận đơn đường biển/đường hàng không của lô hàng
        example: MSCUVF4820534
      - name: bill_of_lading_type
        description: Loại vận đơn
        data_type: varchar
        nullable: false
        business_definition: Phân loại vận đơn (Master BL/House BL/Telex Release/Seaway Bill)
        example: Master BL
      - name: carrier_id
        description: Mã hãng tàu
        data_type: varchar
        nullable: false
        business_definition: Hãng vận chuyển quốc tế (MSC, Maersk, Cosco, Evergreen,...)
        example: MSC
      - name: vessel_name
        description: Tên tàu
        data_type: varchar
        nullable: true
        business_definition: Tên tàu biển vận chuyển lô hàng
        example: MSC Aries III
      - name: voyage_number
        description: Số chuyến
        data_type: varchar
        nullable: true
        business_definition: Số hiệu chuyến đi của tàu
        example: 625W
      - name: port_of_loading
        description: Cảng xếp hàng
        data_type: varchar
        nullable: false
        business_definition: Cảng nơi hàng được xếp lên tàu
        example: Busan, Hàn Quốc
      - name: port_of_discharge
        description: Cảng dỡ hàng
        data_type: varchar
        nullable: false
        business_definition: Cảng đích nơi hàng được dỡ xuống
        example: Cảng Hải Phòng, Việt Nam
      - name: container_count
        description: Số lượng container
        data_type: int
        nullable: true
        business_definition: Tổng số container trong vận đơn
        example: 5
      - name: etd
        description: Ngày khởi hành dự kiến
        data_type: date
        nullable: true
        business_definition: Ngày tàu dự kiến rời cảng xếp
        example: 2025-07-05
      - name: eta
        description: Ngày đến dự kiến
        data_type: date
        nullable: true
        business_definition: Ngày tàu dự kiến đến cảng đích
        example: 2025-07-18
      - name: actual_arrival
        description: Ngày đến thực tế
        data_type: date
        nullable: true
        business_definition: Ngày tàu cập cảng đích thực tế
        example: 2025-07-19
      - name: cargo_weight_kg
        description: Trọng lượng hàng
        data_type: decimal
        nullable: true
        business_definition: Tổng trọng lượng hàng hóa trên vận đơn
        example: 45200.00
      - name: cargo_volume_cbm
        description: Thể tích hàng
        data_type: decimal
        nullable: true
        business_definition: Tổng thể tích hàng hóa tính bằng mét khối
        example: 215.50
      - name: freight_cost
        description: Cước vận chuyển
        data_type: decimal
        nullable: true
        business_definition: Chi phí vận chuyển đường biển/đường hàng không
        example: 12500.00
      - name: created_at
        description: Thời gian tạo bản ghi
        data_type: timestamp
        nullable: false
