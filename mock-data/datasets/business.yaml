datasets:
  - name: dim_dealer
    description: Thông tin chi tiết các đại lý ủy quyền của VinFast trên toàn quốc
    domain: Kinh doanh
    platform: Redshift
    tags:
      - dealer
      - master-data
    columns:
      - name: dealer_id
        description: Mã định danh duy nhất của đại lý
        data_type: varchar
        nullable: false
        business_definition: Mã đại lý do hệ thống sinh tự động, dùng để tham chiếu đến đại lý trên toàn bộ hệ thống
        example: DL_HN_00123
      - name: dealer_code
        description: Mã đại lý viết tắt
        data_type: varchar
        nullable: false
        business_definition: Mã viết tắt của đại lý dùng trong giao dịch nội bộ và báo cáo
        example: VF_HN_BA_DINH
      - name: dealer_name
        description: Tên đầy đủ của đại lý
        data_type: varchar
        nullable: false
        business_definition: Tên thương mại đăng ký kinh doanh của đại lý
        example: VinFast Hà Nội - Ba Đình
      - name: dealer_type
        description: Loại hình đại lý
        data_type: varchar
        nullable: true
        business_definition: "Phân loại đại lý theo quy mô và cấp độ: 3S, 2S, 1S, Showroom"
        example: 3S
      - name: region_id
        description: Mã khu vực địa lý
        data_type: varchar
        nullable: true
        business_definition: Mã tham chiếu đến khu vực quản lý của đại lý
        example: REG_MN
      - name: province
        description: Tỉnh/Thành phố
        data_type: varchar
        nullable: true
        business_definition: Tỉnh hoặc thành phố trực thuộc trung ương nơi đại lý đặt trụ sở
        example: Hà Nội
      - name: district
        description: Quận/Huyện
        data_type: varchar
        nullable: true
        business_definition: Quận hoặc huyện nơi đại lý đặt trụ sở
        example: Ba Đình
      - name: address
        description: Địa chỉ chi tiết
        data_type: varchar
        nullable: true
        business_definition: Địa chỉ đầy đủ của đại lý bao gồm số nhà, đường, phường/xã
        example: 123 Đường Láng, Phường Láng Thượng
      - name: phone
        description: Số điện thoại liên hệ
        data_type: varchar
        nullable: true
        business_definition: Số điện thoại đường dây nóng của đại lý
        example: 02438889999
      - name: dealer_status
        description: Trạng thái hoạt động
        data_type: varchar
        nullable: true
        business_definition: "Trạng thái hiện tại của đại lý: Hoạt động, Tạm ngưng, Chấm dứt hợp đồng"
        example: Hoạt động
      - name: open_date
        description: Ngày khai trương
        data_type: date
        nullable: true
        business_definition: Ngày chính thức đi vào hoạt động của đại lý
        example: "2022-06-15"
      - name: tax_code
        description: Mã số thuế
        data_type: varchar
        nullable: true
        business_definition: Mã số thuế doanh nghiệp của đại lý
        example: 0123456789
      - name: sales_manager
        description: Giám đốc kinh doanh
        data_type: varchar
        nullable: true
        business_definition: Họ tên người phụ trách kinh doanh tại đại lý
        example: Nguyễn Văn An
    owners:
      - sales_ops
    refresh_frequency: Daily

  - name: dim_customer
    description: Thông tin khách hàng cá nhân và doanh nghiệp
    domain: Kinh doanh
    platform: Redshift
    tags:
      - customer
      - master-data
    columns:
      - name: customer_id
        description: Mã định danh khách hàng
        data_type: varchar
        nullable: false
        business_definition: Mã khách hàng duy nhất trên toàn hệ thống, sinh tự động
        example: KH_202403_0012345
      - name: full_name
        description: Họ và tên khách hàng
        data_type: varchar
        nullable: true
        business_definition: Họ và tên đầy đủ của khách hàng cá nhân
        example: Trần Thị Bích
      - name: customer_type
        description: Loại khách hàng
        data_type: varchar
        nullable: true
        business_definition: "Phân loại khách hàng: Cá nhân hoặc Doanh nghiệp"
        example: Cá nhân
      - name: phone
        description: Số điện thoại
        data_type: varchar
        nullable: true
        business_definition: Số điện thoại di động hoặc cố định của khách hàng
        example: 0987654321
      - name: email
        description: Địa chỉ email
        data_type: varchar
        nullable: true
        business_definition: Địa chỉ email của khách hàng dùng để liên hệ và gửi thông tin
        example: bich.tran@gmail.com
      - name: identity_number
        description: Số CMND/CCCD
        data_type: varchar
        nullable: true
        business_definition: Số chứng minh nhân dân hoặc căn cước công dân
        example: 001234567890
      - name: date_of_birth
        description: Ngày sinh
        data_type: date
        nullable: true
        business_definition: Ngày tháng năm sinh của khách hàng
        example: "1990-05-20"
      - name: gender
        description: Giới tính
        data_type: varchar
        nullable: true
        business_definition: "Giới tính của khách hàng: Nam, Nữ, Khác"
        example: Nữ
      - name: province
        description: Tỉnh/Thành phố nơi cư trú
        data_type: varchar
        nullable: true
        business_definition: Địa chỉ thường trú của khách hàng
        example: Hồ Chí Minh
      - name: occupation
        description: Nghề nghiệp
        data_type: varchar
        nullable: true
        business_definition: Nghề nghiệp của khách hàng phục vụ phân tích hành vi
        example: Kế toán
      - name: customer_segment
        description: Phân khúc khách hàng
        data_type: varchar
        nullable: true
        business_definition: "Phân khúc theo hành vi và giá trị: Vàng, Bạc, Đồng, Tiềm năng"
        example: Vàng
      - name: registration_date
        description: Ngày đăng ký
        data_type: date
        nullable: true
        business_definition: Ngày khách hàng được tạo trên hệ thống CRM
        example: "2023-08-01"
      - name: dealer_id
        description: Mã đại lý phụ trách
        data_type: varchar
        nullable: true
        business_definition: Mã đại lý quản lý mối quan hệ với khách hàng này
        example: DL_HN_00123
    owners:
      - crm_team
    refresh_frequency: Daily

  - name: dim_sales_channel
    description: Danh mục kênh bán hàng của VinFast
    domain: Kinh doanh
    platform: Redshift
    tags:
      - channel
      - master-data
    columns:
      - name: channel_id
        description: Mã kênh bán hàng
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất của kênh bán hàng
        example: CH_OTT
      - name: channel_name
        description: Tên kênh bán hàng
        data_type: varchar
        nullable: false
        business_definition: Tên đầy đủ của kênh bán hàng
        example: Online trực tiếp
      - name: channel_group
        description: Nhóm kênh
        data_type: varchar
        nullable: true
        business_definition: "Nhóm phân loại kênh: Online, Offline, Đối tác"
        example: Online
      - name: channel_type
        description: Loại kênh
        data_type: varchar
        nullable: true
        business_definition: Loại hình cụ thể của kênh bán hàng
        example: Website thương mại điện tử
      - name: is_active
        description: Kích hoạt
        data_type: varchar
        nullable: true
        business_definition: "Trạng thái kênh đang được sử dụng hay không: Y/N"
        example: Y
      - name: commission_rate
        description: Tỷ lệ hoa hồng
        data_type: decimal
        nullable: true
        business_definition: Tỷ lệ hoa hồng chi trả cho kênh bán hàng trên mỗi đơn hàng
        example: 0.02
      - name: effective_date
        description: Ngày hiệu lực
        data_type: date
        nullable: true
        business_definition: Ngày bắt đầu áp dụng kênh bán hàng
        example: "2021-01-01"
    owners:
      - sales_ops
    refresh_frequency: Daily

  - name: fact_sales_order
    description: Thông tin chi tiết đơn đặt hàng xe và phụ kiện
    domain: Kinh doanh
    platform: Redshift
    tags:
      - sales
      - transactional
    columns:
      - name: sales_order_id
        description: Mã đơn hàng
        data_type: varchar
        nullable: false
        business_definition: Mã số duy nhất của đơn đặt hàng, dùng để tra cứu toàn bộ thông tin đơn hàng
        example: SO_202407_001234
      - name: order_date
        description: Ngày đặt hàng
        data_type: date
        nullable: false
        business_definition: Ngày khách hàng đặt cọc và xác nhận đơn hàng
        example: "2024-07-15"
      - name: customer_id
        description: Mã khách hàng
        data_type: varchar
        nullable: false
        business_definition: Mã tham chiếu đến khách hàng đặt hàng
        example: KH_202403_0012345
      - name: dealer_id
        description: Mã đại lý
        data_type: varchar
        nullable: false
        business_definition: Mã đại lý tiếp nhận và xử lý đơn hàng
        example: DL_HN_00123
      - name: channel_id
        description: Mã kênh bán hàng
        data_type: varchar
        nullable: true
        business_definition: Kênh bán hàng phát sinh đơn hàng
        example: CH_OTT
      - name: model_id
        description: Mã model xe
        data_type: varchar
        nullable: false
        business_definition: Mã model xe khách hàng đặt mua
        example: VF8
      - name: quantity
        description: Số lượng
        data_type: int
        nullable: true
        business_definition: Số lượng xe đặt mua trong đơn hàng
        example: 1
      - name: unit_price
        description: Đơn giá niêm yết
        data_type: decimal
        nullable: true
        business_definition: Giá niêm yết của xe tại thời điểm đặt hàng (chưa bao gồm thuế, phí)
        example: 1050000000.00
      - name: discount_amount
        description: Giá trị chiết khấu
        data_type: decimal
        nullable: true
        business_definition: Tổng giá trị chiết khấu, khuyến mãi áp dụng cho đơn hàng
        example: 50000000.00
      - name: total_amount
        description: Tổng giá trị đơn hàng
        data_type: decimal
        nullable: true
        business_definition: Tổng giá trị thanh toán sau chiết khấu, bao gồm VAT
        example: 1100000000.00
      - name: order_status
        description: Trạng thái đơn hàng
        data_type: varchar
        nullable: true
        business_definition: "Trạng thái xử lý đơn hàng: Chờ xác nhận, Đã xác nhận, Đang giao, Hoàn thành, Đã hủy"
        example: Đã xác nhận
      - name: payment_method
        description: Phương thức thanh toán
        data_type: varchar
        nullable: true
        business_definition: "Hình thức thanh toán khách hàng lựa chọn: Tiền mặt, Chuyển khoản, Trả góp"
        example: Trả góp
      - name: expected_delivery_date
        description: Ngày giao dự kiến
        data_type: date
        nullable: true
        business_definition: Ngày dự kiến bàn giao xe cho khách hàng theo cam kết
        example: "2024-08-15"
      - name: promotion_id
        description: Mã chương trình KM
        data_type: varchar
        nullable: true
        business_definition: Mã chương trình khuyến mãi áp dụng cho đơn hàng (nếu có)
        example: PROMO_T7_2024
    owners:
      - sales_ops
    refresh_frequency: Daily

  - name: fact_sales_delivery
    description: Thông tin bàn giao xe cho khách hàng
    domain: Kinh doanh
    platform: Redshift
    tags:
      - sales
      - delivery
    columns:
      - name: delivery_id
        description: Mã giao hàng
        data_type: varchar
        nullable: false
        business_definition: Mã phiếu bàn giao xe duy nhất
        example: DEL_202408_000567
      - name: sales_order_id
        description: Mã đơn hàng
        data_type: varchar
        nullable: false
        business_definition: Mã đơn hàng tham chiếu đến đơn đặt hàng tương ứng
        example: SO_202407_001234
      - name: delivery_date
        description: Ngày giao xe thực tế
        data_type: date
        nullable: false
        business_definition: Ngày thực tế bàn giao xe cho khách hàng
        example: "2024-08-20"
      - name: customer_id
        description: Mã khách hàng
        data_type: varchar
        nullable: false
        business_definition: Mã khách hàng nhận xe
        example: KH_202403_0012345
      - name: dealer_id
        description: Mã đại lý
        data_type: varchar
        nullable: false
        business_definition: Mã đại lý thực hiện bàn giao
        example: DL_HN_00123
      - name: vin_number
        description: Số VIN của xe
        data_type: varchar
        nullable: true
        business_definition: Số nhận dạng xe (Vehicle Identification Number) duy nhất cho mỗi xe
        example: VIN6543210987654321
      - name: license_plate
        description: Biển số xe
        data_type: varchar
        nullable: true
        business_definition: Biển số đăng ký của xe do cơ quan công an cấp
        example: 30A-99999
      - name: delivery_status
        description: Trạng thái giao hàng
        data_type: varchar
        nullable: true
        business_definition: "Trạng thái: Đã lên lịch, Đang giao, Đã bàn giao, Trả lại"
        example: Đã bàn giao
      - name: delivery_type
        description: Hình thức bàn giao
        data_type: varchar
        nullable: true
        business_definition: "Hình thức: Tại đại lý, Tại nhà, Tại công ty"
        example: Tại đại lý
      - name: delivery_notes
        description: Ghi chú bàn giao
        data_type: varchar
        nullable: true
        business_definition: Các ghi chú đặc biệt trong quá trình bàn giao xe
        example: Khách hàng yêu cầu hướng dẫn sử dụng pin chi tiết
    owners:
      - sales_ops
    refresh_frequency: Daily

  - name: fact_sales_target
    description: Chỉ tiêu bán hàng theo đại lý và thời gian
    domain: Kinh doanh
    platform: Redshift
    tags:
      - sales
      - target
      - kpi
    columns:
      - name: target_id
        description: Mã chỉ tiêu
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất cho chỉ tiêu bán hàng
        example: TGT_2024_Q3_DL123
      - name: dealer_id
        description: Mã đại lý
        data_type: varchar
        nullable: false
        business_definition: Mã đại lý được giao chỉ tiêu
        example: DL_HN_00123
      - name: target_year
        description: Năm chỉ tiêu
        data_type: int
        nullable: false
        business_definition: Năm tài chính áp dụng chỉ tiêu
        example: 2024
      - name: target_month
        description: Tháng chỉ tiêu
        data_type: int
        nullable: true
        business_definition: Tháng áp dụng chỉ tiêu (NULL nếu chỉ tiêu năm)
        example: 7
      - name: model_id
        description: Mã model xe
        data_type: varchar
        nullable: true
        business_definition: Mã model xe được giao chỉ tiêu (NULL nếu chỉ tiêu tổng)
        example: VF8
      - name: target_quantity
        description: Số lượng chỉ tiêu
        data_type: int
        nullable: false
        business_definition: Số lượng xe cần bán trong kỳ
        example: 50
      - name: target_value
        description: Giá trị chỉ tiêu
        data_type: decimal
        nullable: true
        business_definition: Tổng doanh số chỉ tiêu theo giá trị (VNĐ)
        example: 52500000000.00
      - name: actual_quantity
        description: Số lượng thực tế
        data_type: int
        nullable: true
        business_definition: Số lượng xe đã bán thực tế trong kỳ
        example: 42
      - name: completion_rate
        description: Tỷ lệ hoàn thành
        data_type: decimal
        nullable: true
        business_definition: Tỷ lệ phần trăm hoàn thành chỉ tiêu (actual/target)
        example: 0.84
      - name: target_status
        description: Trạng thái chỉ tiêu
        data_type: varchar
        nullable: true
        business_definition: "Trạng thái: Đang thực hiện, Hoàn thành, Không hoàn thành"
        example: Không hoàn thành
    owners:
      - sales_planning
    refresh_frequency: Daily

  - name: fact_dealer_performance
    description: Đánh giá hiệu suất hoạt động của đại lý
    domain: Kinh doanh
    platform: Redshift
    tags:
      - dealer
      - performance
      - kpi
    columns:
      - name: performance_id
        description: Mã đánh giá
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất cho bản ghi đánh giá hiệu suất
        example: PERF_202407_DL123
      - name: dealer_id
        description: Mã đại lý
        data_type: varchar
        nullable: false
        business_definition: Mã đại lý được đánh giá
        example: DL_HN_00123
      - name: review_period
        description: Kỳ đánh giá
        data_type: varchar
        nullable: false
        business_definition: Kỳ đánh giá hiệu suất theo tháng/quý/năm
        example: 2024-07
      - name: total_sales_quantity
        description: Tổng số xe bán ra
        data_type: int
        nullable: true
        business_definition: Tổng số xe đã bán trong kỳ đánh giá
        example: 42
      - name: target_achievement_rate
        description: Tỷ lệ đạt chỉ tiêu
        data_type: decimal
        nullable: true
        business_definition: Tỷ lệ hoàn thành chỉ tiêu bán hàng (%)
        example: 84.00
      - name: customer_satisfaction_score
        description: Điểm hài lòng KH
        data_type: decimal
        nullable: true
        business_definition: Điểm đánh giá mức độ hài lòng của khách hàng (thang 10)
        example: 8.5
      - name: inventory_turnover_days
        description: Số ngày tồn kho
        data_type: int
        nullable: true
        business_definition: Số ngày tồn kho trung bình của xe tại đại lý
        example: 21
      - name: test_drive_conversion_rate
        description: Tỷ lệ chuyển đổi lái thử
        data_type: decimal
        nullable: true
        business_definition: Tỷ lệ khách lái thử chuyển thành đơn hàng (%)
        example: 35.50
      - name: after_sales_revenue
        description: Doanh thu hậu mãi
        data_type: decimal
        nullable: true
        business_definition: Doanh thu từ dịch vụ sửa chữa, bảo dưỡng tại đại lý
        example: 250000000.00
      - name: overall_rating
        description: Xếp hạng tổng thể
        data_type: varchar
        nullable: true
        business_definition: "Xếp hạng tổng thể hiệu suất: A, B, C, D"
        example: B
    owners:
      - dealer_management
    refresh_frequency: Daily

  - name: dim_product_model
    description: Danh mục các model xe VinFast và thông số kỹ thuật
    domain: Kinh doanh
    platform: Redshift
    tags:
      - product
      - master-data
    columns:
      - name: model_id
        description: Mã model xe
        data_type: varchar
        nullable: false
        business_definition: Mã định danh duy nhất cho từng dòng xe
        example: VF8
      - name: model_name
        description: Tên thương mại
        data_type: varchar
        nullable: false
        business_definition: Tên thương mại chính thức của dòng xe
        example: VinFast VF 8
      - name: model_year
        description: Năm sản xuất
        data_type: int
        nullable: true
        business_definition: Năm ra mắt của phiên bản xe
        example: 2024
      - name: vehicle_category
        description: Phân khúc xe
        data_type: varchar
        nullable: true
        business_definition: "Phân khúc theo kích thước và mục đích: SUV, Sedan, Hatchback, MPV"
        example: SUV
      - name: engine_type
        description: Loại động cơ
        data_type: varchar
        nullable: true
        business_definition: "Loại động cơ: Điện, Xăng, Diesel, Hybrid"
        example: Điện
      - name: battery_capacity
        description: Dung lượng pin (kWh)
        data_type: decimal
        nullable: true
        business_definition: Dung lượng pin của xe điện, tính bằng kWh
        example: 82.0
      - name: range_km
        description: Tầm xa tối đa (km)
        data_type: int
        nullable: true
        business_definition: Tầm xa di chuyển tối đa sau mỗi lần sạc đầy (tiêu chuẩn NEDC)
        example: 459
      - name: seating_capacity
        description: Số chỗ ngồi
        data_type: int
        nullable: true
        business_definition: Số chỗ ngồi tiêu chuẩn của xe
        example: 5
      - name: base_price
        description: Giá niêm yết cơ bản
        data_type: decimal
