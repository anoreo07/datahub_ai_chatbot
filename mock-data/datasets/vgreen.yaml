datasets:
  - name: dim_charging_station
    description: Danh mục trạm sạc điện VinFast trên toàn quốc
    domain: VGreen (Xe điện)
    platform: Redshift
    tags:
      - charging
      - station
      - vgreen
    columns:
      - name: station_id
        description: Mã trạm sạc
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi trạm sạc trong hệ thống VGreen
        example: VGS-HN-00123
      - name: station_name
        description: Tên trạm sạc
        data_type: varchar
        nullable: false
        business_definition: Tên thương mại của trạm sạc
        example: Trạm sạc VGreen Times City
      - name: address
        description: Địa chỉ trạm
        data_type: varchar
        nullable: true
        business_definition: Địa chỉ đầy đủ của trạm sạc
        example: 458 Minh Khai, Hai Bà Trưng, Hà Nội
      - name: latitude
        description: Vĩ độ
        data_type: decimal
        nullable: true
        business_definition: Tọa độ vĩ độ của trạm sạc
        example: 21.012345
      - name: longitude
        description: Kinh độ
        data_type: decimal
        nullable: true
        business_definition: Tọa độ kinh độ của trạm sạc
        example: 105.856789
      - name: station_type
        description: Loại trạm
        data_type: varchar
        nullable: false
        business_definition: Phân loại (DC Fast/AC Normal/AC Slow/Hybrid)
        example: DC Fast
      - name: total_connectors
        description: Tổng số đầu sạc
        data_type: int
        nullable: false
        business_definition: Số lượng đầu sạc có tại trạm
        example: 6
      - name: power_kw
        description: Công suất trạm
        data_type: decimal
        nullable: true
        business_definition: Tổng công suất tối đa của trạm sạc (kW)
        example: 360.00
      - name: status
        description: Trạng thái hoạt động
        data_type: varchar
        nullable: false
        business_definition: Trạng thái (Active/Inactive/Maintenance/Planned)
        example: Active
      - name: opening_hours
        description: Giờ mở cửa
        data_type: varchar
        nullable: true
        business_definition: Khung giờ hoạt động của trạm
        example: 24/7
      - name: parking_fee
        description: Phí đỗ xe
        data_type: decimal
        nullable: true
        business_definition: Phí đỗ xe tại trạm (VND/giờ)
        example: 5000.00
      - name: install_date
        description: Ngày lắp đặt
        data_type: date
        nullable: true
        business_definition: Ngày trạm sạc được lắp đặt và đưa vào vận hành
        example: 2024-06-15
      - name: last_maintenance_date
        description: Ngày bảo trì gần nhất
        data_type: date
        nullable: true
        business_definition: Ngày bảo trì định kỳ gần nhất
        example: 2025-06-10
    owners:
      - VGREEN_OPERATIONS
    refresh_frequency: Daily

  - name: dim_battery_pack
    description: Danh mục bộ pin xe điện VinFast
    domain: VGreen (Xe điện)
    platform: Redshift
    tags:
      - battery
      - pack
      - master_data
    columns:
      - name: battery_id
        description: Mã bộ pin
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi bộ pin lắp trên xe
        example: BAT-VF9-100KWH-001
      - name: battery_serial
        description: Số serial pin
        data_type: varchar
        nullable: false
        business_definition: Số serial duy nhất của bộ pin, in trên nhãn
        example: VFBAT2025100001
      - name: model_code
        description: Mã model
        data_type: varchar
        nullable: false
        business_definition: Mã model của bộ pin (VF9_100, VF8_90, VF6_60,...)
        example: VF9_100
      - name: battery_type
        description: Loại pin
        data_type: varchar
        nullable: false
        business_definition: Công nghệ pin (NCM 622/NCM 811/LFP/Blade)
        example: NCM 811
      - name: nominal_capacity_kwh
        description: Dung lượng danh định
        data_type: decimal
        nullable: false
        business_definition: Dung lượng pin danh định tính bằng kWh
        example: 100.00
      - name: usable_capacity_kwh
        description: Dung lượng sử dụng
        data_type: decimal
        nullable: true
        business_definition: Dung lượng có thể sử dụng thực tế (kWh)
        example: 94.00
      - name: nominal_voltage_v
        description: Điện áp danh định
        data_type: decimal
        nullable: true
        business_definition: Điện áp danh định của bộ pin (V)
        example: 400.00
      - name: max_power_kw
        description: Công suất tối đa
        data_type: decimal
        nullable: true
        business_definition: Công suất xả tối đa của pin (kW)
        example: 250.00
      - name: weight_kg
        description: Trọng lượng
        data_type: decimal
        nullable: true
        business_definition: Trọng lượng bộ pin (kg)
        example: 550.00
      - name: cell_count
        description: Số cell pin
        data_type: int
        nullable: true
        business_definition: Tổng số cell pin trong bộ pin
        example: 4416
      - name: cooling_type
        description: Loại làm mát
        data_type: varchar
        nullable: true
        business_definition: Hệ thống làm mát (Liquid Cooled/Air Cooled/Passive)
        example: Liquid Cooled
      - name: manufacture_date
        description: Ngày sản xuất
        data_type: date
        nullable: true
        business_definition: Ngày sản xuất bộ pin
        example: 2025-03-15
      - name: warranty_years
        description: Bảo hành
        data_type: int
        nullable: true
        business_definition: Số năm bảo hành pin
        example: 10
      - name: battery_status
        description: Trạng thái
        data_type: varchar
        nullable: false
        business_definition: Trạng thái (Available/In Vehicle/Charging/Defective/Retired)
        example: In Vehicle
    owners:
      - VGREEN_BATTERY
    refresh_frequency: Daily

  - name: dim_ev_model
    description: Danh mục model xe điện VinFast
    domain: VGreen (Xe điện)
    platform: Redshift
    tags:
      - ev
      - model
      - vehicle
    columns:
      - name: model_code
        description: Mã model
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi phiên bản xe điện
        example: VF9-ECO-AWD
      - name: model_name
        description: Tên model
        data_type: varchar
        nullable: false
        business_definition: Tên thương mại của xe
        example: VinFast VF 9 Eco AWD
      - name: segment
        description: Phân khúc
        data_type: varchar
        nullable: true
        business_definition: Phân khúc xe (A/B/C/D/E/SUV/Pickup)
        example: E-SUV
      - name: battery_code
        description: Mã pin
        data_type: varchar
        nullable: true
        business_definition: Mã bộ pin trang bị tiêu chuẩn
        example: VF9_100
      - name: range_nedc_km
        description: Phạm vi NEDC
        data_type: int
        nullable: true
        business_definition: Phạm vi hoạt động theo chuẩn NEDC (km)
        example: 580
      - name: range_wltp_km
        description: Phạm vi WLTP
        data_type: int
        nullable: true
        business_definition: Phạm vi hoạt động theo chuẩn WLTP (km)
        example: 438
      - name: motor_power_kw
        description: Công suất motor
        data_type: int
        nullable: true
        business_definition: Công suất motor điện tối đa (kW)
        example: 300
      - name: motor_torque_nm
        description: Mô-men xoắn
        data_type: int
        nullable: true
        business_definition: Mô-men xoắn cực đại (Nm)
        example: 620
      - name: drive_type
        description: Loại dẫn động
        data_type: varchar
        nullable: true
        business_definition: Hệ dẫn động (FWD/RWD/AWD)
        example: AWD
      - name: seats
        description: Số ghế
        data_type: int
        nullable: true
        business_definition: Số chỗ ngồi
        example: 7
      - name: launch_date
        description: Ngày ra mắt
        data_type: date
        nullable: true
        business_definition: Ngày mẫu xe được ra mắt thị trường
        example: 2024-03-15
      - name: msrp_vnd
        description: Giá niêm yết
        data_type: decimal
        nullable: true
        business_definition: Giá bán lẻ đề xuất (VND)
        example: 1569000000.00
      - name: model_status
        description: Trạng thái
        data_type: varchar
        nullable: true
        business_definition: Trạng thái (Active/Discontinued/Coming Soon)
        example: Active
    owners:
      - VGREEN_PRODUCT
    refresh_frequency: Weekly

  - name: fact_charging_session
    description: Chi tiết phiên sạc tại trạm sạc VGreen
    domain: VGreen (Xe điện)
    platform: Redshift
    tags:
      - charging
      - session
      - transaction
    columns:
      - name: session_id
        description: Mã phiên sạc
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi phiên sạc
        example: SES-20250715-001234
      - name: station_id
        description: Mã trạm sạc
        data_type: varchar
        nullable: false
        business_definition: Mã trạm sạc nơi diễn ra phiên sạc
        example: VGS-HN-00123
      - name: connector_id
        description: Mã đầu sạc
        data_type: varchar
        nullable: true
        business_definition: Mã đầu sạc được sử dụng
        example: CNT-HN-00123-01
      - name: vehicle_vin
        description: Số VIN xe
        data_type: varchar
        nullable: false
        business_definition: Số nhận dạng xe thực hiện sạc
        example: VIN-VF9-2025-0001234
      - name: battery_id
        description: Mã bộ pin
        data_type: varchar
        nullable: true
        business_definition: Mã bộ pin được sạc
        example: BAT-VF9-100KWH-001
      - name: start_time
        description: Thời gian bắt đầu
        data_type: timestamp
        nullable: false
        business_definition: Thời điểm bắt đầu kết nối sạc
        example: 2025-07-15 14:30:00
      - name: end_time
        description: Thời gian kết thúc
        data_type: timestamp
        nullable: true
        business_definition: Thời điểm kết thúc sạc (ngắt kết nối)
        example: 2025-07-15 15:45:00
      - name: duration_minutes
        description: Thời gian sạc
        data_type: int
        nullable: true
        business_definition: Tổng thời gian sạc tính bằng phút
        example: 75
      - name: energy_delivered_kwh
        description: Năng lượng đã sạc
        data_type: decimal
        nullable: false
        business_definition: Lượng điện năng đã sạc vào pin (kWh)
        example: 62.50
      - name: start_soc
        description: SOC bắt đầu
        data_type: decimal
        nullable: true
        business_definition: Trạng thái sạc pin lúc bắt đầu (%)
        example: 15.00
      - name: end_soc
        description: SOC kết thúc
        data_type: decimal
        nullable: true
        business_definition: Trạng thái sạc pin lúc kết thúc (%)
        example: 85.00
      - name: avg_power_kw
        description: Công suất trung bình
        data_type: decimal
        nullable: true
        business_definition: Công suất sạc trung bình trong phiên (kW)
        example: 50.00
      - name: cost_vnd
        description: Chi phí sạc
        data_type: decimal
        nullable: true
        business_definition: Số tiền khách hàng phải trả cho phiên sạc (VND)
        example: 189750.00
      - name: payment_method
        description: Phương thức thanh toán
        data_type: varchar
        nullable: true
        business_definition: Loại thanh toán (VINFAST App/Credit Card/Membership/FOC)
        example: VINFAST App
      - name: session_status
        description: Trạng thái phiên
        data_type: varchar
        nullable: false
        business_definition: Trạng thái (Completed/Interrupted/Failed/Cancelled/In Progress)
        example: Completed
    owners:
      - VGREEN_CHARGING
    refresh_frequency: Daily

  - name: fact_battery_health
    description: Tình trạng sức khỏe pin xe điện
    domain: VGreen (Xe điện)
    platform: Redshift
    tags:
      - battery
      - health
      - soh
    columns:
      - name: health_id
        description: Mã bản ghi sức khỏe pin
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi lần đánh giá sức khỏe pin
        example: BHVF9-202507-001
      - name: battery_id
        description: Mã bộ pin
        data_type: varchar
        nullable: false
        business_definition: Mã bộ pin được theo dõi
        example: BAT-VF9-100KWH-001
      - name: vehicle_vin
        description: Số VIN xe
        data_type: varchar
        nullable: true
        business_definition: Số VIN của xe đang sử dụng pin
        example: VIN-VF9-2025-0001234
      - name: record_date
        description: Ngày ghi nhận
        data_type: date
        nullable: false
        business_definition: Ngày đo đạc các thông số sức khỏe pin
        example: 2025-07-15
      - name: soh_percent
        description: SOH pin
        data_type: decimal
        nullable: false
        business_definition: State of Health - Tỷ lệ sức khỏe pin so với ban đầu (%)
        example: 98.50
      - name: total_cycles
        description: Tổng số chu kỳ sạc
        data_type: int
        nullable: true
        business_definition: Tổng số chu kỳ sạc-xả đã thực hiện
        example: 120
      - name: total_energy_in_kwh
        description: Tổng năng lượng sạc
        data_type: decimal
        nullable: true
        business_definition: Tổng năng lượng đã sạc vào pin từ đầu đời (kWh)
        example: 8500.00
      - name: total_energy_out_kwh
        description: Tổng năng lượng xả
        data_type: decimal
        nullable: true
        business_definition: Tổng năng lượng đã xả từ pin (kWh)
        example: 8200.00
      - name: avg_temperature_c
        description: Nhiệt độ trung bình
        data_type: decimal
        nullable: true
        business_definition: Nhiệt độ hoạt động trung bình của pin (°C)
        example: 35.00
      - name: max_temperature_c
        description: Nhiệt độ tối đa
        data_type: decimal
        nullable: true
        business_definition: Nhiệt độ cao nhất pin từng đạt được (°C)
        example: 48.00
      - name: internal_resistance_mohm
        description: Nội trở
        data_type: decimal
        nullable: true
        business_definition: Nội trở của pin đo được (mOhm)
        example: 2.15
      - name: cell_voltage_deviation_v
        description: Độ lệch điện áp cell
        data_type: decimal
        nullable: true
        business_definition: Độ lệch điện áp lớn nhất giữa các cell (mV)
        example: 15.00
      - name: health_grade
        description: Xếp hạng sức khỏe
        data_type: varchar
        nullable: true
        business_definition: Phân loại (Excellent/Good/Fair/Poor/Critical)
        example: Excellent
      - name: recommendation
        description: Khuyến nghị
        data_type: varchar
        nullable: true
        business_definition: Hành động khuyến nghị (No Action/Monitor/Service/Replace)
        example: No Action
    owners:
      - VGREEN_BATTERY
    refresh_frequency: Daily

  - name: fact_energy_consumption
    description: Tiêu thụ năng lượng của xe điện
    domain: VGreen (Xe điện)
    platform: Redshift
    tags:
      - energy
      - consumption
      - efficiency
    columns:
      - name: consumption_id
        description: Mã bản ghi tiêu thụ
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi bản ghi tiêu thụ năng lượng
        example: EC-VF9-20250715-001
      - name: vehicle_vin
        description: Số VIN xe
        data_type: varchar
        nullable: false
        business_definition: Số VIN của xe
        example: VIN-VF9-2025-0001234
      - name: record_date
        description: Ngày ghi nhận
        data_type: date
        nullable: false
        business_definition: Ngày ghi nhận dữ liệu tiêu thụ
        example: 2025-07-15
      - name: distance_km
        description: Quãng đường
        data_type: decimal
        nullable: false
        business_definition: Quãng đường xe đã di chuyển trong ngày (km)
        example: 85.50
      - name: energy_consumed_kwh
        description: Năng lượng tiêu thụ
        data_type: decimal
        nullable: false
        business_definition: Tổng năng lượng tiêu thụ trong ngày (kWh)
        example: 18.80
      - name: avg_consumption_wh_per_km
        description: Tiêu thụ trung bình
        data_type: decimal
        nullable: true
        business_definition: Mức tiêu thụ năng lượng trung bình (Wh/km)
        example: 220.00
      - name: driving_style
        description: Phong cách lái
        data_type: varchar
        nullable: true
        business_definition: Phân loại phong cách lái (Eco/Comfort/Sport)
        example: Eco
      - name: ac_energy_kwh
        description: Năng lượng điều hòa
        data_type: decimal
        nullable: true
        business_definition: Năng lượng tiêu thụ bởi điều hòa không khí (kWh)
        example: 3.20
      - name: regen_energy_kwh
        description: Năng lượng tái tạo
        data_type: decimal
        nullable: true
        business_definition: Năng lượng thu hồi từ phanh tái tạo (kWh)
        example: 2.50
      - name: terrain_type
        description: Loại địa hình
        data_type: varchar
        nullable: true
        business_definition: Địa hình di chuyển (Urban/Highway/Mixed/Mountain)
        example: Urban
      - name: ambient_temp_c
        description: Nhiệt độ môi trường
        data_type: decimal
        nullable: true
        business_definition: Nhiệt độ môi trường bên ngoài (°C)
        example: 35.00
      - name: tire_pressure_psi
        description: Áp suất lốp
        data_type: decimal
        nullable: true
        business_definition: Áp suất lốp trung bình (psi)
        example: 38.00
      - name: energy_cost_vnd
        description: Chi phí năng lượng
        data_type: decimal
        nullable: true
        business_definition: Chi phí năng lượng tiêu thụ trong ngày (VND)
        example: 57000.00
    owners:
      - VGREEN_ANALYTICS
    refresh_frequency: Daily

  - name: fact_range_tracking
    description: Theo dõi phạm vi hoạt động thực tế của xe điện
    domain: VGreen (Xe điện)
    platform: Redshift
    tags:
      - range
      - tracking
      - performance
    columns:
      - name: range_id
        description: Mã bản ghi phạm vi
        data_type: varchar
        nullable: false
        business_definition: Mã duy nhất cho mỗi bản ghi theo dõi phạm vi
        example: RN-VF9-20250715-001
      - name: vehicle_vin
        description: Số VIN xe
        data_type: varchar
        nullable: false
        business_definition: Số VIN xe được theo dõi
        example: VIN-VF9-2025-0001234
      - name: record_date
        description: Ngày ghi nhận
        data_type: date
        nullable: false
        business_definition: Ngày ghi nhận phạm vi
        example: 2025-07-15
      - name: estimated_range_km
        description: Phạm vi ước tính
        data_type: int
        nullable: false
        business_definition: Phạm vi còn lại ước tính theo BMS (km)
        example: 350
      - name: actual_range_km
        description: Phạm vi thực tế
        data_type: int
        nullable: true
        business_definition: Phạm vi thực tế đạt được từ lần sạc đầy trước (km)
        example: 420
      - name: rated_range_km
        description: Phạm vi danh định
        data_type: int
        nullable: true
        business_definition: Phạm vi danh định theo tiêu chuẩn NEDC (km)
        example: 580
      - name: range_deviation_percent
        description: Độ lệch phạm vi
        data_type: decimal
        nullable: true
        business_definition: Chênh lệch giữa thực tế và danh định (%)
        example: -27.59
      - name: battery_soc
        description: SOC pin
        data_type: decimal
        nullable: true
        business_definition: Trạng thái sạc pin tại thời điểm ghi nhận (%)
        example: 72.00
      - name: avg_speed_kmh
        description: Tốc độ trung bình
        data_type: decimal
        nullable: true
        business_definition: Tốc độ trung bình trong hành trình (km/h)
        example: 42.00
      - name: outside_temp_c
        description: Nhiệt độ ngoài trời
        data_type: decimal
        nullable: true
        business_definition: Nhiệt độ môi trường (°C)
        example: 32.00
      - name: ac_usage_percent
        description: Tỷ lệ sử dụng điều hòa
        data_type: decimal
        nullable: true
        business_definition: Tỷ lệ thời gian bật điều hòa (%)
        example: 85.00
      - name: driving_condition
        description: Điều kiện lái
        data_type: varchar
        nullable: true
        business_definition: Điều kiện giao thông (Heavy Traffic/Normal/Free Flow)
        example: Normal
      - name: range_anomaly_flag
        description: Cờ bất thường
        data_type: varchar
        nullable: true
        business_definition: Đánh dấu nếu phạm vi bất thường (Yes/No)
        example: No
    owners:
      - VGREEN_ANALYTICS
    refresh_frequency: Daily

  - name: dim_bms_config
    description: Cấu hình hệ thống quản lý pin (BMS)
    domain: VGreen (Xe điện)
