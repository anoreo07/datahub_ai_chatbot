        example: CNT-HN-00123-01
      - name: maintenance_type
        description: Loại bảo trì
        data_type: varchar
        nullable: false
        business_definition: Phân loại (Preventive/Corrective/Emergency/Upgrade)
        example: Preventive
      - name: scheduled_date
        description: Ngày dự kiến
        data_type: date
        nullable: true
        business_definition: Ngày dự kiến thực hiện bảo trì
        example: 2025-07-10
      - name: actual_date
        description: Ngày thực tế
        data_type: date
        nullable: false
        business_definition: Ngày thực tế thực hiện bảo trì
        example: 2025-07-10
      - name: technician_name
        description: Kỹ thuật viên
        data_type: varchar
        nullable: true
        business_definition: Tên kỹ thuật viên thực hiện bảo trì
        example: Trần Văn Bình
      - name: issue_description
        description: Mô tả sự cố
        data_type: varchar
        nullable: true
        business_definition: Mô tả vấn đề hoặc nội dung bảo trì
        example: Kiểm tra và vệ sinh đầu cắm sạc, kiểm tra cáp
      - name: action_taken
        description: Hành động đã thực hiện
        data_type: varchar
        nullable: true
        business_definition: Các công việc đã thực hiện trong đợt bảo trì
        example: Vệ sinh đầu cắm, siết lại kết nối, cập nhật firmware
      - name: parts_replaced
        description: Linh kiện thay thế
        data_type: varchar
        nullable: true
        business_definition: Danh sách linh kiện đã thay thế (nếu có)
        example: Không thay thế
      - name: downtime_hours
        description: Thời gian ngừng hoạt động
        data_type: decimal
        nullable: true
        business_definition: Thời gian trạm/đầu sạc ngừng phục vụ (giờ)
        example: 2.50
      - name: cost_vnd
        description: Chi phí bảo trì
        data_type: decimal
        nullable: true
        business_definition: Chi phí thực hiện bảo trì (VND)
        example: 1500000.00
      - name: completion_status
        description: Trạng thái hoàn thành
        data_type: varchar
        nullable: false
        business_definition: Trạng thái (Completed/Partial/Deferred/Cancelled)
        example: Completed
      - name: next_maintenance_due
        description: Hạn bảo trì kế tiếp
        data_type: date
        nullable: true
        business_definition: Ngày dự kiến bảo trì định kỳ tiếp theo
        example: 2025-10-10
    owners:
      - VGREEN_MAINTENANCE
    refresh_frequency: Daily
