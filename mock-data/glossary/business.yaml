glossary_terms:
  - name: MSRP (Manufacturer's Suggested Retail Price)
    definition: Giá bán lẻ đề xuất của nhà sản xuất cho đại lý và người tiêu dùng cuối
    business_meaning: Công cụ định vị thương hiệu và kiểm soát biên độ lợi nhuận trên kênh phân phối
    example: MSRP của mẫu sedan A là 450 triệu VNĐ, đại lý có thể bán thấp hơn tùy chính sách khuyến mãi
    related_terms:
      - Dealer Margin
      - Invoice Price
      - List Price
    domain: KINH DOANH

  - name: Dealer Margin
    definition: Khoản chênh lệch giữa giá bán đại lý và giá xuất kho từ nhà sản xuất
    business_meaning: Động lực kinh doanh cho đại lý, yếu tố quyết định sức khỏe kênh phân phối
    example: Biên độ đại lý hiện tại là 8% trên MSRP, tương đương 36 triệu VNĐ mỗi xe
    related_terms:
      - MSRP
      - Dealer Incentive
      - Gross Margin
    domain: KINH DOANH

  - name: Sales Target
    definition: Chỉ tiêu doanh số được giao theo tháng, quý hoặc năm cho từng khu vực và đại lý
    business_meaning: Cơ sở đánh giá năng lực bán hàng, phân bổ nguồn lực và hoạch định sản xuất
    example: Sales Target quý III năm 2025 là 12.000 xe, tăng 15% so với cùng kỳ
    related_terms:
      - Market Share
      - Forecast
      - Achievement Rate
    domain: KINH DOANH

  - name: Market Share
    definition: Thị phần là tỷ lệ doanh số của hãng so với tổng doanh số toàn thị trường
    business_meaning: Thước đo vị thế cạnh tranh và hiệu quả chiến lược thương hiệu
    example: Thị thần phân khúc SUV tăng từ 12% lên 15% sau khi ra mắt phiên bản nâng cấp
    related_terms:
      - Sales Target
      - Penetration Rate
      - Segment Share
    domain: KINH DOANH

  - name: Incentive Program
    definition: Chương trình khuyến khích tài chính cho đại lý hoặc khách hàng nhằm thúc đẩy doanh số
    business_meaning: Công cụ kích cầu ngắn hạn và điều tiết tồn kho
    example: Chương trình bonus 10 triệu/xe cho đại lý đạt 100% chỉ tiêu tháng 9
    related_terms:
      - Dealer Margin
      - Rebate
      - Sales Promotion
    domain: KINH DOANH

  - name: Trade Spend
    definition: Ngân sách chi tiêu cho các hoạt động xúc tiến thương mại tại đại lý và kênh phân phối
    business_meaning: Đảm bảo hiệu quả đầu tư marketing, đo lường ROI của từng hoạt động kích thích kênh
    example: Trade Spend quý này 15 tỷ đồng, 60% dành cho trưng bày và lái thử tại đại lý
    related_terms:
      - Incentive Program
      - Co-op Marketing
      - POS Material
    domain: KINH DOANH

  - name: Customer Acquisition Cost
    definition: Tổng chi phí marketing và bán hàng để có được một khách hàng mới
    business_meaning: Đánh giá hiệu quả kênh bán hàng và tối ưu hóa ngân sách Marketing & Sales
    example: CAC kênh online là 2,5 triệu/khách, thấp hơn 40% so với kênh truyền thống
    related_terms:
      - LTV
      - Conversion Rate
      - Lead Cost
    domain: KINH DOANH

  - name: Dealer Network
    definition: Hệ thống đại lý phân phối sản phẩm của hãng trên các địa bàn
    business_meaning: Kênh tiếp cận khách hàng trực tiếp, quyết định khả năng bao phủ thị trường
    example: Dealer Network hiện có 68 đại lý 3S trên 45 tỉnh thành
    related_terms:
      - 3S Dealer
      - Exclusive Dealer
      - Channel Strategy
    domain: KINH DOANH

  - name: Sales Mix
    definition: Cơ cấu doanh số theo dòng sản phẩm, phiên bản hoặc màu sắc
    business_meaning: Cơ sở lập kế hoạch sản xuất và tối ưu lợi nhuận theo từng phân khúc
    example: "Sales Mix hiện tại: sedan 40%, SUV 35%, hatchback 25% tổng doanh số"
    related_terms:
      - Product Mix
      - Option Take Rate
      - Segment Analysis
    domain: KINH DOANH

  - name: Conversion Rate
    definition: Tỷ lệ khách hàng tiềm năng trở thành khách hàng mua xe thực tế
    business_meaning: Đo lường hiệu quả quy trình bán hàng từ lead đến chốt đơn
    example: Conversion Rate showroom quận 1 đạt 25%, cao hơn trung bình hệ thống là 18%
    related_terms:
      - Customer Acquisition Cost
      - Lead Management
      - Test Drive Rate
    domain: KINH DOANH

  - name: Months of Inventory
    definition: Số tháng tồn kho dựa trên doanh số bán hiện tại, đo lường áp lực tồn kho
    business_meaning: Chỉ báo sức khỏe kênh, điều chỉnh sản xuất và chính sách bán hàng
    example: Months of Inventory đang ở mức 2,5 tháng, cần kích hoạt chương trình giảm giá
    related_terms:
      - Days to Turn
      - Inventory Coverage
      - Stock Aging
    domain: KINH DOANH

  - name: Customer Lifetime Value
    definition: Tổng giá trị doanh thu dự kiến từ một khách hàng trong suốt thời gian gắn bó với thương hiệu
    business_meaning: Cơ sở quyết định ngân sách acquiring, upsell và chăm sóc khách hàng
    example: LTV trung bình khách mua xe phổ thông là 450 triệu (mua 2 xe trong 8 năm + phụ tùng dịch vụ)
    related_terms:
      - Customer Acquisition Cost
      - Repeat Purchase Rate
      - Loyalty Program
    domain: KINH DOANH

  - name: Wholesale Volume
    definition: Số lượng xe bán sỉ từ nhà máy đến đại lý (không phải bán lẻ đến người tiêu dùng)
    business_meaning: Thước đo doanh thu thực tế của nhà sản xuất, khác biệt với retail volume
    example: Wholesale Volume tháng 7 là 8.500 xe, trong khi Retail Volume là 7.200 xe (chênh do tồn kho đại lý)
    related_terms:
      - Retail Volume
      - Dealer Stock
      - Sell-in vs Sell-out
    domain: KINH DOANH

  - name: Option Take Rate
    definition: Tỷ lệ khách hàng chọn mua các tùy chọn trang bị thêm khi mua xe
    business_meaning: Tối ưu doanh thu phụ kiện và tùy chọn, ảnh hưởng đến kế hoạch sản xuất theo đơn hàng
    example: Option Take Rate của gói an toàn nâng cao đạt 35% trên tổng đơn hàng
    related_terms:
      - Sales Mix
      - Accessory Attachment Rate
      - Upsell Ratio
    domain: KINH DOANH

  - name: Geographic Penetration
    definition: Mức độ thâm nhập thị trường theo địa lý, đo bằng số xe bán trên đầu dân hoặc hộ gia đình
    business_meaning: Xác định tiềm năng tăng trưởng và chiến lược mở rộng khu vực
    example: Geographic Penetration tại TP.HCM đạt 45 xe/1.000 dân, gấp 3 lần mức trung bình cả nước
    related_terms:
      - Market Share
      - Coverage Rate
      - Growth Potential
    domain: KINH DOANH

  - name: Model Lifecycle
    definition: Vòng đời sản phẩm từ khi giới thiệu đến ngừng sản xuất, bao gồm launch, growth, maturity, decline
    business_meaning: Hoạch định chiến lược giá, khuyến mãi và kế hoạch thay thế sản phẩm
    example: Mẫu C đang ở cuối giai đoạn maturity, cần chuẩn bị chiến lược EOL và thay thế bằng mẫu D
    related_terms:
      - Product Lifecycle Management
      - Facelift
      - End of Life
    domain: KINH DOANH

  - name: Competitive Benchmarking
    definition: So sánh định kỳ sản phẩm, giá cả, khuyến mãi và dịch vụ so với đối thủ cạnh tranh
    business_meaning: Phát hiện lợi thế/bất lợi cạnh tranh, điều chỉnh chiến lược kinh doanh kịp thời
    example: Benchmarking cho thấy đối thủ X có giá thấp hơn 10% nhưng bảo hành kém hơn 2 năm
    related_terms:
      - Market Share
      - Price Positioning
      - SWOT Analysis
    domain: KINH DOANH

  - name: Residual Value
    definition: Giá trị còn lại của xe sau một thời gian sử dụng, ảnh hưởng đến quyết định mua của khách
    business_meaning: Yếu tố cạnh tranh dài hạn, ảnh hưởng đến chương trình cho thuê tài chính và đổi xe
    example: Residual Value sau 3 năm của dòng Đạt 65%, dẫn đầu phân khúc và được khách hàng đánh giá cao
    related_terms:
      - Depreciation
      - Trade-in Value
      - Buyback Program
    domain: KINH DOANH

  - name: Fleet Sales
    definition: Doanh số bán xe cho khách hàng tổ chức, doanh nghiệp hoặc cơ quan nhà nước với số lượng lớn
    business_meaning: Kênh bán hàng chiến lược với biên độ thấp hơn nhưng sản lượng lớn, ổn định
    example: Ký hợp đồng Fleet Sales 300 xe cho Tổng công ty X với mức chiết khấu 12%
    related_terms:
      - Corporate Sales
      - Government Contract
      - Bulk Discount
    domain: KINH DOANH
