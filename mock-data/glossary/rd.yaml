glossary_terms:
  - name: CAD Model (Computer-Aided Design)
    definition: Mô hình thiết kế ba chiều được tạo bằng phần mềm CAD để mô phỏng hình học và cấu trúc của chi tiết hoặc hệ thống.
    business_meaning: Là sản phẩm đầu ra chính của đội ngũ thiết kế, làm cơ sở cho mô phỏng, tạo nguyên mẫu và sản xuất khuôn mẫu.
    example: Mô hình CAD của cụm cửa xe được thiết kế trên CATIA, bao gồm kết cấu thân cửa, kính và cơ cấu nâng hạ.
    related_terms:
      - Design Freeze
      - Prototype
    domain: PHÁT TRIỂN XE

  - name: Prototype
    definition: Nguyên mẫu – phiên bản thử nghiệm của xe hoặc bộ phận được chế tạo để kiểm tra thiết kế trước khi sản xuất hàng loạt.
    business_meaning: Hoạt động tạo prototype chiếm phần lớn chi phí phát triển xe mới và quyết định lịch trình dự án.
    example: Xe prototype bản thử đường được chế tạo 24 tháng trước khi sản xuất hàng loạt để kiểm tra NVH và độ bền.
    related_terms:
      - CAD Model
      - DVP&R
    domain: PHÁT TRIỂN XE

  - name: NVH (Noise, Vibration, Harshness)
    definition: Tiếng ồn, rung động và độ êm dịu – tập hợp các chỉ tiêu cảm nhận về âm thanh và rung động của xe.
    business_meaning: Là một trong ba trụ cột chất lượng xe (cùng với độ tin cậy và an toàn), ảnh hưởng trực tiếp đến trải nghiệm khách hàng.
    example: Đội NVH đo độ ồn nội thất ở tốc độ 120 km/h, mục tiêu dưới 68 dB để đạt chuẩn xe hạng sang.
    related_terms:
      - DVP&R
      - Homologation
    domain: PHÁT TRIỂN XE

  - name: HIL Testing (Hardware-in-the-Loop)
    definition: Kiểm thử phần cứng trong vòng lặp – kỹ thuật kiểm tra bộ điều khiển điện tử bằng cách kết nối với mô phỏng thời gian thực.
    business_meaning: Phát hiện lỗi phần mềm và phần cứng trước khi lên xe thật, giảm thời gian hiệu chỉnh trên đường.
    example: Kiểm thử HIL cho bộ điều khiển ABS với 200 tình huống mô phỏng mặt đường trơn trượt.
    related_terms:
      - DVP&R
      - FMEA
    domain: PHÁT TRIỂN XE

  - name: DVP&R (Design Verification Plan & Report)
    definition: Kế hoạch và báo cáo xác nhận thiết kế – tài liệu quản lý tất cả các bài kiểm tra xác nhận thiết kế.
    business_meaning: Khung quản lý chất lượng xuyên suốt quá trình phát triển, đảm bảo mọi yêu cầu kỹ thuật đều được kiểm tra.
    example: DVP&R của hệ thống phanh bao gồm 45 bài kiểm tra từ phòng thí nghiệm đến thử nghiệm đường trường.
    related_terms:
      - FMEA
      - HIL Testing
    domain: PHÁT TRIỂN XE

  - name: FMEA (Failure Mode and Effects Analysis)
    definition: Phân tích kiểu lỗi và ảnh hưởng – phương pháp hệ thống xác định và đánh giá rủi ro hư hỏng tiềm ẩn trong thiết kế.
    business_meaning: Công cụ phòng ngừa lỗi từ sớm, giảm chi phí warranty và thu hồi sản phẩm.
    example: FMEA cho hệ thống túi khí phát hiện nguy cơ cảm biến hoạt động sai ở nhiệt độ thấp, dẫn đến thiết kế lại vỏ cảm biến.
    related_terms:
      - DVP&R
      - Design Freeze
    domain: PHÁT TRIỂN XE

  - name: Design Freeze
    definition: Đóng băng thiết kế – mốc thời gian trong dự án phát triển khi mọi thay đổi thiết kế chính thức dừng lại.
    business_meaning: Design freeze quyết định lịch trình sản xuất khuôn mẫu và chuẩn bị sản xuất hàng loạt.
    example: Design freeze của mẫu xe mới được ấn định vào tháng 6, sau đó mọi thay đổi phải qua hội đồng xét duyệt đặc biệt.
    related_terms:
      - CAD Model
      - Prototype
    domain: PHÁT TRIỂN XE

  - name: Homologation
    definition: Chứng nhận kiểu loại – thủ tục pháp lý chứng nhận xe đáp ứng các quy định kỹ thuật và an toàn của quốc gia sở tại.
    business_meaning: Homologation là điều kiện tiên quyết để đưa xe ra thị trường, mỗi thị trường có tiêu chuẩn riêng.
    example: Xe phải vượt qua 32 bài kiểm tra homologation theo chuẩn UNECE để được lưu hành tại thị trường châu Âu.
    related_terms:
      - NVH
      - DVP&R
    domain: PHÁT TRIỂN XE

  - name: Platform Architecture
    definition: Kiến trúc nền tảng – khung cơ sở kỹ thuật được dùng chung cho nhiều mẫu xe, gồm khung gầm, hệ thống treo và powertrain.
    business_meaning: Kiến trúc platform cho phép chia sẻ linh kiện giữa các mẫu xe, giảm chi phí phát triển và tăng tính kinh tế theo quy mô.
    example: Platform MQB của Volkswagen được dùng cho 60 mẫu xe khác nhau từ Golf đến Audi A3.
    related_terms:
      - CAD Model
      - Modular Design
    domain: PHÁT TRIỂN XE

  - name: CAE (Computer-Aided Engineering)
    definition: Kỹ thuật mô phỏng bằng máy tính – sử dụng phần mềm mô phỏng để phân tích hành vi kết cấu, nhiệt, va chạm và khí động.
    business_meaning: CAE giảm số lượng prototype vật lý cần chế tạo, rút ngắn chu kỳ phát triển và giảm chi phí đến 40%.
    example: Mô phỏng CAE va chạm trước cho thấy vùng hấp thụ lực chưa đủ, thiết kế lại thanh crash box.
    related_terms:
      - CAD Model
      - Prototype
    domain: PHÁT TRIỂN XE

  - name: DFM/DFA (Design for Manufacturing/Assembly)
    definition: Thiết kế cho sản xuất/lắp ráp – nguyên tắc thiết kế nhằm tối ưu khả năng chế tạo và lắp ráp sản phẩm.
    business_meaning: Áp dụng DFM/DFA giúp giảm số linh kiện, thời gian lắp ráp và chi phí sản xuất đơn chiếc.
    example: Tái thiết kế cụm cản trước giảm từ 8 chi tiết xuống 2 chi tiết nhờ DFM, rút ngắn thời gian lắp ráp 40%.
    related_terms:
      - CAD Model
      - Platform Architecture
    domain: PHÁT TRIỂN XE

  - name: VPCR (Verification Prototype Confirmation Review)
    definition: Đánh giá xác nhận nguyên mẫu – cuộc họp kiểm tra kết quả thử nghiệm prototype trước khi chấp thuận sản xuất.
    business_meaning: Là milestone quan trọng xác nhận thiết kế đủ chín muồi để tiến vào sản xuất thử.
    example: VPCR cho thấy prototype vượt 92% bài kiểm tra, cần thêm vòng hiệu chỉnh hệ thống treo trước khi OK.
    related_terms:
      - DVP&R
      - Design Freeze
    domain: PHÁT TRIỂN XE

  - name: Calibration
    definition: Hiệu chỉnh – quá trình tối ưu thông số bộ điều khiển điện tử (ECU) để đạt hiệu suất, khí thải và cảm giác lái mong muốn.
    business_meaning: Công đoạn tốn nhiều thời gian và chuyên môn nhất trong phát triển powertrain, ảnh hưởng đến cảm nhận thương hiệu.
    example: Hiệu chỉnh bản đồ phun nhiên liệu cho động cơ 2.0L để đạt tiêu chuẩn khí thải Euro 6 mà vẫn giữ được cảm giác tăng tốc mượt.
    related_terms:
      - HIL Testing
      - Homologation
    domain: PHÁT TRIỂN XE

  - name: Benchmarking
    definition: Phân tích đối chuẩn – so sánh thông số kỹ thuật và hiệu năng của xe đối thủ để xác định mục tiêu thiết kế.
    business_meaning: Là đầu vào quan trọng cho quá trình định vị sản phẩm và xác định thông số mục tiêu của xe mới.
    example: Benchmarking Toyota Corolla Cross để xác định mục tiêu tiêu hao nhiên liệu cho mẫu SUV đô thị mới.
    related_terms:
      - DVP&R
      - Platform Architecture
    domain: PHÁT TRIỂN XE

  - name: SOR (Statement of Requirements)
    definition: Bảng yêu cầu kỹ thuật – tài liệu liệt kê toàn bộ yêu cầu kỹ thuật và tính năng của xe mới.
    business_meaning: Là tài liệu hợp đồng giữa phòng Marketing và R&D, xác định phạm vi dự án và ngân sách phát triển.
    example: SOR của dòng xe điện mới yêu cầu tầm xa tối thiểu 400 km, thời gian sạc nhanh dưới 30 phút.
    related_terms:
      - DVP&R
      - Design Freeze
    domain: PHÁT TRIỂN XE

  - name: Virtual Validation
    definition: Xác nhận ảo – quá trình kiểm tra và phê duyệt thiết kế thông qua mô phỏng số thay vì thử nghiệm vật lý.
    business_meaning: Xu hướng đang thay thế dần thử nghiệm vật lý, giảm chi phí và đẩy nhanh thời gian phát triển.
    example: Sử dụng virtual validation thay thế 60% thử nghiệm va chạm vật lý trong phát triển mẫu xe mới.
    related_terms:
      - CAE
      - Prototype
    domain: PHÁT TRIỂN XE
