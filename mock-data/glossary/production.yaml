glossary_terms:
  - name: OEE (Overall Equipment Effectiveness)
    definition: Chỉ số đo lường hiệu suất tổng thể của thiết bị sản xuất, tính bằng tích số của Availability, Performance và Quality
    business_meaning: Phản ánh mức độ sử dụng hiệu quả máy móc thiết bị trong quy trình sản xuất ô tô
    example: Máy dập có OEE 85% nghĩa là đạt 85% hiệu suất lý tưởng
    related_terms:
      - Availability
      - Performance
      - Quality Rate
    domain: SẢN XUẤT

  - name: Cycle Time
    definition: Thời gian hoàn thành một chu kỳ sản xuất cho một đơn vị sản phẩm
    business_meaning: Dùng để tính năng lực sản xuất và lập kế hoạch sản xuất
    example: Cycle Time lắp ráp một xe VF8 là 90 giây
    related_terms:
      - Takt Time
      - Lead Time
    domain: SẢN XUẤT

  - name: Takt Time
    definition: Nhịp sản xuất yêu cầu để đáp ứng nhu cầu khách hàng
    business_meaning: Takt Time = Thời gian sản xuất khả dụng / Số lượng yêu cầu
    example: Nếu cần 200 xe/ngày và có 8 giờ sản xuất, Takt Time = 144 giây/xe
    related_terms:
      - Cycle Time
      - Throughput
    domain: SẢN XUẤT

  - name: First Pass Yield (FPY)
    definition: Tỷ lệ sản phẩm đạt chất lượng ngay từ lần đầu mà không cần làm lại
    business_meaning: Đo lường chất lượng quy trình sản xuất
    example: FPY 95% nghĩa là 95% xe đạt kiểm tra chất lượng ngay lần đầu
    related_terms:
      - Defect Rate
      - Rework Rate
    domain: SẢN XUẤT

  - name: WIP (Work In Process)
    definition: Hàng tồn dở dang đang trong quá trình sản xuất
    business_meaning: Lượng sản phẩm đã bắt đầu sản xuất nhưng chưa hoàn thành
    example: WIP tại phân xưởng sơn là 150 thân xe đang chờ sấy
    related_terms:
      - BOM
      - Production Order
    domain: SẢN XUẤT

  - name: BOM (Bill of Materials)
    definition: Danh sách đầy đủ các linh kiện, vật tư cần thiết để sản xuất một sản phẩm
    business_meaning: Cấu trúc sản phẩm bao gồm tất cả components và sub-assemblies
    example: BOM của VF8 gồm hơn 2000 linh kiện từ động cơ, pin đến ốc vít
    related_terms:
      - Production Order
      - Material Requirement Planning
    domain: SẢN XUẤT

  - name: Production Order
    definition: Lệnh sản xuất cho một lô sản phẩm cụ thể
    business_meaning: Tài liệu điều phối toàn bộ quy trình sản xuất từ nguyên vật liệu đến thành phẩm
    example: Lệnh sản xuất PO-2024-0012 cho 300 xe VF8 màu trắng
    related_terms:
      - BOM
      - Routing
    domain: SẢN XUẤT

  - name: Quality Gate
    definition: Điểm kiểm tra chất lượng bắt buộc trong quy trình sản xuất
    business_meaning: Các trạm kiểm tra cố định mà sản phẩm phải vượt qua trước khi chuyển sang công đoạn tiếp theo
    example: Quality Gate tại trạm hàn kiểm tra độ chính xác mối hàn thân xe
    related_terms:
      - First Pass Yield
      - Defect Rate
    domain: SẢN XUẤT

  - name: Defect Rate
    definition: Tỷ lệ sản phẩm lỗi so với tổng sản phẩm sản xuất
    business_meaning: Chỉ số chất lượng quan trọng, thường tính bằng DPU (Defects Per Unit) hoặc DPMO
    example: Defect Rate khung xe dưới 1% đạt tiêu chuẩn xuất khẩu
    related_terms:
      - First Pass Yield
      - Rework Rate
    domain: SẢN XUẤT

  - name: Rework Rate
    definition: Tỷ lệ sản phẩm phải làm lại do không đạt chất lượng lần đầu
    business_meaning: Chi phí làm lại ảnh hưởng trực tiếp đến năng suất và giá thành
    example: Rework Rate sơn giảm từ 5% xuống 2% sau khi cải tiến quy trình
    related_terms:
      - First Pass Yield
      - Defect Rate
    domain: SẢN XUẤT

  - name: Throughput
    definition: Sản lượng đầu ra của dây chuyền sản xuất trong một đơn vị thời gian
    business_meaning: Năng lực sản xuất thực tế của nhà máy
    example: Throughput nhà máy Hải Phòng đạt 300 xe/ngày
    related_terms:
      - Cycle Time
      - Takt Time
    domain: SẢN XUẤT

  - name: Changeover Time
    definition: Thời gian chuyển đổi giữa hai model sản phẩm khác nhau trên cùng dây chuyền
    business_meaning: Thời gian chết không sản xuất khi chuyển đổi model
    example: Chuyển đổi từ VF8 sang VF9 mất 45 phút
    related_terms:
      - OEE
      - Cycle Time
    domain: SẢN XUẤT

  - name: SMED (Single Minute Exchange of Die)
    definition: Phương pháp giảm thời gian chuyển đổi khuôn mẫu xuống dưới 10 phút
    business_meaning: Kỹ thuật Lean giúp giảm lãng phí thời gian chuyển đổi
    example: Áp dụng SMED giảm changeover từ 45 phút xuống 8 phút
    related_terms:
      - Changeover Time
      - Lean Manufacturing
    domain: SẢN XUẤT

  - name: Kanban
    definition: Hệ thống kéo sản xuất dựa trên thẻ tín hiệu
    business_meaning: Phương pháp quản lý sản xuất tinh gọn, sản xuất theo nhu cầu thực tế
    example: Mỗi thùng linh kiện có một thẻ Kanban báo hiệu cần sản xuất thêm
    related_terms:
      - Just-in-Time
      - WIP
    domain: SẢN XUẤT

  - name: Andon
    definition: Hệ thống cảnh báo trực quan khi có vấn đề trên dây chuyền sản xuất
    business_meaning: Cho phép công nhân dừng dây chuyền khi phát hiện lỗi chất lượng
    example: Công nhân kéo dây Andon khi phát hiện mối hàn không đạt
    related_terms:
      - Quality Gate
      - Jidoka
    domain: SẢN XUẤT

  - name: Routing
    definition: Trình tự các bước gia công và nguyên công trong sản xuất
    business_meaning: Định nghĩa quy trình sản xuất chi tiết cho từng linh kiện
    example: Routing của thân xe gồm 5 bước: dập - hàn - sơn - lắp ráp - kiểm tra
    related_terms:
      - BOM
      - Production Order
    domain: SẢN XUẤT

  - name: Capacity Utilization
    definition: Tỷ lệ sử dụng công suất sản xuất thực tế so với công suất thiết kế
    business_meaning: Chỉ số hiệu quả quản lý năng lực sản xuất
    example: Nhà máy đang hoạt động ở 78% công suất thiết kế
    related_terms:
      - Throughput
      - OEE
    domain: SẢN XUẤT

  - name: JIT (Just-in-Time)
    definition: Hệ thống sản xuất đúng số lượng cần thiết, đúng thời điểm cần thiết
    business_meaning: Giảm tồn kho, tăng hiệu quả dòng tiền
    example: Linh kiện được giao đến dây chuyền đúng lúc cần lắp ráp, không tồn kho
    related_terms:
      - Kanban
      - Lean Manufacturing
    domain: SẢN XUẤT

  - name: Traceability
    definition: Khả năng truy xuất nguồn gốc sản phẩm qua từng công đoạn sản xuất
    business_meaning: Yêu cầu bắt buộc trong sản xuất ô tô để quản lý chất lượng và triệu hồi
    example: Mỗi thân xe được gắn mã VIN để trace toàn bộ lịch sử sản xuất
    related_terms:
      - Quality Gate
      - Lot Tracking
    domain: SẢN XUẤT
