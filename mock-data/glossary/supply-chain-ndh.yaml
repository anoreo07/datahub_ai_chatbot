glossary_terms:
  - name: Incoterms
    definition: Bộ quy tắc thương mại quốc tế do ICC ban hành, quy định trách nhiệm của người mua và người bán trong giao nhận hàng hóa.
    business_meaning: Xác định điểm chuyển giao rủi ro và chi phí vận chuyển giữa NĐH và công ty, ảnh hưởng trực tiếp đến giá nhập khẩu linh kiện.
    example: Sử dụng điều kiện CIF cho lô hàng động cơ từ Nhật Bản, nhà cung cấp chịu chi phí vận tải và bảo hiểm đến cảng Việt Nam.
    related_terms:
      - CIF/FOB
      - Import Duty
    domain: CUNG ỨNG (NĐH)

  - name: CIF/FOB
    definition: CIF (Cost, Insurance, Freight) – người bán chịu chi phí, bảo hiểm và cước đến cảng đích; FOB (Free On Board) – người bán giao hàng lên tàu tại cảng xuất.
    business_meaning: Lựa chọn CIF hay FOB quyết định ai kiểm soát logistics và chi phí vận tải, ảnh hưởng đến chiến lược sourcing của công ty.
    example: Công ty ưu tiên mua FOB để tự chọn hãng tàu và kiểm soát lịch trình nhập khẩu linh kiện từ Hàn Quốc.
    related_terms:
      - Incoterms
      - Ocean Freight
    domain: CUNG ỨNG (NĐH)

  - name: Letter of Credit (L/C)
    definition: Thư tín dụng – cam kết thanh toán của ngân hàng phát hành cho người thụ hưởng khi đáp ứng đủ điều kiện trong thư.
    business_meaning: Công cụ thanh toán quốc tế chính cho nhập khẩu linh kiện, giảm rủi ro thanh toán cho cả NĐH và công ty.
    example: Mở L/C không hủy ngang cho lô hàng hệ thống điện tử trị giá $500,000 từ Đức, thanh toán sau khi nhận bộ chứng từ hợp lệ.
    related_terms:
      - Customs Clearance
      - Trade Finance
    domain: CUNG ỨNG (NĐH)

  - name: Customs Clearance
    definition: Thủ tục thông quan – quá trình khai báo hải quan và hoàn tất các yêu cầu pháp lý để nhập khẩu hàng hóa vào lãnh thổ quốc gia.
    business_meaning: Quyết định thời gian thông quan và chi phí lưu bãi, ảnh hưởng trực tiếp đến tiến độ sản xuất.
    example: Bộ phận logistics cần nộp tờ khai hải quan điện tử 24 giờ trước khi tàu cập cảng để tránh phạt lưu container.
    related_terms:
      - HS Code
      - Import Duty
    domain: CUNG ỨNG (NĐH)

  - name: Import Duty
    definition: Thuế nhập khẩu – thuế đánh vào hàng hóa nhập khẩu dựa trên trị giá hải quan và mã HS.
    business_meaning: Chi phí thuế chiếm tỷ trọng đáng kể trong giá vốn linh kiện, cần được tính toán chính xác trong dự toán chi phí sản xuất.
    example: Linh kiện động cơ nhập khẩu từ ASEAN chịu thuế suất 0% theo ATIGA, giúp tiết kiệm 15-20% chi phí so với nhập từ ngoài khối.
    related_terms:
      - HS Code
      - Preferential Tariff
    domain: CUNG ỨNG (NĐH)

  - name: HS Code
    definition: Mã số hài hòa mô tả và mã hóa hàng hóa – hệ thống mã hóa quốc tế dùng để phân loại hàng hóa xuất nhập khẩu.
    business_meaning: Xác định chính xác mã HS giúp tính đúng thuế suất và tránh tranh chấp hải quan.
    example: Mã HS 8708.29 cho linh kiện thân xe nhập khẩu từ Trung Quốc cần được kiểm tra trước khi khai báo.
    related_terms:
      - Import Duty
      - Customs Clearance
    domain: CUNG ỨNG (NĐH)

  - name: Bonded Warehouse
    definition: Kho ngoại quan – kho hàng hóa nhập khẩu chưa nộp thuế, được lưu trữ dưới sự giám sát của hải quan.
    business_meaning: Giúp hoãn nộp thuế nhập khẩu đến khi linh kiện thực sự được đưa vào sản xuất, cải thiện dòng tiền.
    example: Linh kiện điện tử từ Nhật được lưu tại kho ngoại quan Cảng Cát Lái, chỉ nộp thuế khi xuất kho về nhà máy.
    related_terms:
      - Import Duty
      - Just-in-Time
    domain: CUNG ỨNG (NĐH)

  - name: Ocean Freight
    definition: Cước vận tải biển – chi phí vận chuyển hàng hóa bằng đường biển từ cảng xuất đến cảng nhập.
    business_meaning: Chiếm tỷ lệ lớn trong chi phí logistics nhập khẩu, biến động theo giá nhiên liệu và mùa vụ.
    example: Cước vận tải biển cho container 40 feet từ Hamburg về cảng Cái Mép hiện là $2,800.
    related_terms:
      - CIF/FOB
      - Freight Forwarder
    domain: CUNG ỨNG (NĐH)

  - name: Freight Forwarder
    definition: Công ty giao nhận vận tải – trung gian tổ chức vận chuyển hàng hóa từ người gửi đến người nhận trên toàn cầu.
    business_meaning: Đơn vị đối tác logistics chịu trách nhiệm phối hợp vận tải và chứng từ, ảnh hưởng đến độ tin cậy chuỗi cung ứng.
    example: Freight forwarder DHL Global Forwarding quản lý toàn bộ lộ trình từ nhà máy Thái Lan đến nhà máy lắp ráp Vĩnh Phúc.
    related_terms:
      - Ocean Freight
      - Customs Clearance
    domain: CUNG ỨNG (NĐH)

  - name: Bill of Lading (B/L)
    definition: Vận đơn đường biển – chứng từ vận tải biển, bằng chứng sở hữu hàng hóa và hợp đồng vận chuyển.
    business_meaning: Cần B/L gốc để nhận hàng tại cảng và làm thủ tục thanh toán L/C, là chứng từ quan trọng nhất trong giao dịch nhập khẩu.
    example: B/L được phát hành theo lệnh của ngân hàng để đảm bảo quyền kiểm soát hàng hóa đến khi thanh toán hoàn tất.
    related_terms:
      - Letter of Credit
      - Customs Clearance
    domain: CUNG ỨNG (NĐH)

  - name: Packing List
    definition: Phiếu đóng gói – chứng từ liệt kê chi tiết từng kiện hàng, trọng lượng, kích thước và nội dung bên trong.
    business_meaning: Căn cứ để kiểm đếm hàng khi nhập kho và làm thủ tục hải quan, sai lệch có thể dẫn đến phạt.
    example: Packing list lô hàng ghế da gồm 200 kiện, mỗi kiện 4 bộ ghế trước/sau, tổng trọng lượng 12 tấn.
    related_terms:
      - Commercial Invoice
      - Customs Clearance
    domain: CUNG ỨNG (NĐH)

  - name: Commercial Invoice
    definition: Hóa đơn thương mại – chứng từ do nhà xuất khẩu phát hành, ghi nhận giá trị giao dịch và điều kiện thanh toán.
    business_meaning: Là cơ sở tính thuế nhập khẩu và giá trị khai báo hải quan, cần khớp với giá hợp đồng.
    example: Commercial invoice trị giá $120,000 cho lô hàng hộp số tự động, thanh toán trong 60 ngày kể từ ngày nhận hàng.
    related_terms:
      - Packing List
      - Import Duty
    domain: CUNG ỨNG (NĐH)

  - name: Preferential Tariff
    definition: Thuế suất ưu đãi – mức thuế nhập khẩu thấp hơn hoặc bằng 0% áp dụng cho hàng hóa từ nước có FTA với Việt Nam.
    business_meaning: Tận dụng các FTA (ATIGA, CPTPP, EVFTA) để giảm chi phí nhập khẩu và tăng lợi thế cạnh tranh.
    example: Áp dụng thuế suất 0% theo CPTPP cho linh kiện nội thất nhập từ Nhật Bản khi có CO form CPTPP.
    related_terms:
      - Import Duty
      - Certificate of Origin
    domain: CUNG ỨNG (NĐH)

  - name: Certificate of Origin (CO)
    definition: Giấy chứng nhận xuất xứ – chứng từ xác nhận hàng hóa có xuất xứ từ một quốc gia hoặc khu vực nhất định.
    business_meaning: Cần để hưởng thuế suất ưu đãi theo FTA, thiếu CO sẽ mất ưu đãi và phải nộp thuế MFN cao hơn.
    example: Nộp CO form EUR.1 cho lô hàng linh kiện từ EU để hưởng thuế nhập khẩu 0% theo EVFTA.
    related_terms:
      - Preferential Tariff
      - HS Code
    domain: CUNG ỨNG (NĐH)

  - name: Just-in-Time (JIT)
    definition: Phương thức sản xuất và cung ứng kịp thời – linh kiện được giao đến dây chuyền lắp ráp đúng lúc cần sử dụng.
    business_meaning: Giảm tồn kho nhưng đòi hỏi chuỗi cung ứng nhập khẩu phải cực kỳ tin cậy và chính xác.
    example: Hệ thống đèn pha được giao JIT từ nhà máy Đức, khoảng cách 3 giờ giữa đặt hàng và giao đến line lắp ráp.
    related_terms:
      - Bonded Warehouse
      - Supply Chain Risk
    domain: CUNG ỨNG (NĐH)

  - name: Supply Chain Risk
    definition: Rủi ro chuỗi cung ứng – các yếu tố gây gián đoạn dòng chảy nguyên vật liệu từ nhà cung cấp đến nhà máy.
    business_meaning: Quản trị rủi ro chuỗi cung ứng nhập khẩu là ưu tiên hàng đầu, đặc biệt với linh kiện single-source.
    example: Lũ lụt tại Thái Lan năm 2011 gây gián đoạn nguồn cung vi mạch, ảnh hưởng đến sản xuất ô tô toàn cầu.
    related_terms:
      - Just-in-Time
      - Dual Sourcing
    domain: CUNG ỨNG (NĐH)

  - name: Dual Sourcing
    definition: Chiến lược tìm nguồn cung kép – mua cùng một linh kiện từ hai nhà cung cấp khác nhau để giảm rủi ro gián đoạn.
    business_meaning: Đảm bảo an toàn nguồn cung cho linh kiện quan trọng, tăng chi phí nhưng giảm rủi ro đứt gãy sản xuất.
    example: Bộ điều khiển ECU được dual sourcing từ Bosch (Đức) và Denso (Nhật) với tỷ lệ 60:40.
    related_terms:
      - Supply Chain Risk
      - Single Sourcing
    domain: CUNG ỨNG (NĐH)

  - name: Force Majeure
    definition: Điều khoản bất khả kháng – điều khoản hợp đồng miễn trách nhiệm cho bên không thực hiện nghĩa vụ do sự kiện bất khả kháng.
    business_meaning: Điều khoản quan trọng trong hợp đồng nhập khẩu để bảo vệ công ty trước các rủi ro thiên tai, dịch bệnh.
    example: Đại dịch COVID-19 được xem là sự kiện bất khả kháng, cho phép NĐH Nhật Bản hoãn giao hàng 60 ngày.
    related_terms:
      - Supply Chain Risk
      - Contract Terms
    domain: CUNG ỨNG (NĐH)
