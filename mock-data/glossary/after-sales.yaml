glossary_terms:
  - name: Warranty Claim
    definition: Yêu cầu bồi hoàn chi phí sửa chữa bảo hành từ đại lý gửi đến nhà sản xuất
    business_meaning: Kiểm soát chi phí bảo hành, truy xuất lỗi sản phẩm và đánh giá độ tin cậy
    example: Đại lý gửi warranty claim 5,2 triệu VNĐ cho trường hợp thay thế bơm nhiên liệu lỗi
    related_terms:
      - Warranty Rate
      - Goodwill Claim
      - Warranty Reserve
    domain: HẬU MÃI

  - name: Service Campaign
    definition: Chương trình triệu hồi hoặc kiểm tra miễn phí theo chiến dịch của nhà sản xuất
    business_meaning: Đảm bảo an toàn khách hàng, tuân thủ pháp luật và bảo vệ uy tín thương hiệu
    example: Service campaign kiểm tra túi khí cho 45.000 xe dòng A sản xuất từ 2020-2022
    related_terms:
      - Recall
      - Technical Service Bulletin
      - Field Action
    domain: HẬU MÃI

  - name: Preventive Maintenance
    definition: Bảo dưỡng định kỳ theo lịch trình nhà sản xuất nhằm duy trì hiệu suất và phòng ngừa hư hỏng
    business_meaning: Nguồn doanh thu dịch vụ ổn định, kéo dài tuổi thọ xe và tăng hài lòng khách hàng
    example: Lịch bảo dưỡng định kỳ mỗi 5.000 km hoặc 6 tháng, tùy điều kiện nào đến trước
    related_terms:
      - Scheduled Service
      - Service Interval
      - Maintenance Schedule
    domain: HẬU MÃI

  - name: MTBF (Mean Time Between Failures)
    definition: Thời gian trung bình giữa hai lần hỏng hóc của linh kiện hoặc hệ thống
    business_meaning: Chỉ số độ tin cậy sản phẩm, cơ sở thiết kế và dự báo phụ tùng
    example: MTBF của hộp số tự động đạt 150.000 km, cải thiện 20% so với thế hệ trước
    related_terms:
      - MTTR
      - Reliability
      - Failure Rate
    domain: HẬU MÃI

  - name: Customer Satisfaction Index
    definition: Chỉ số đo lường mức độ hài lòng của khách hàng sau dịch vụ bảo hành, bảo dưỡng
    business_meaning: Thước đo chất lượng dịch vụ hậu mãi, ảnh hưởng đến lòng trung thành và referral
    example: CSI tháng 7 đạt 4,2/5 điểm, giảm 0,3 điểm so với mục tiêu do thời gian chờ lâu
    related_terms:
      - NPS
      - Service Quality
      - Customer Retention
    domain: HẬU MÃI

  - name: Part Return Rate
    definition: Tỷ lệ phụ tùng bị trả lại do lỗi hoặc không tương thích so với tổng phụ tùng bán ra
    business_meaning: Đánh giá chất lượng phụ tùng và hiệu quả quy trình xác định nhu cầu
    example: Part Return Rate của hệ thống phanh là 1,2%, cần kiểm tra lại quy trình kiểm soát chất lượng
    related_terms:
      - Warranty Claim
      - Defect Rate
      - Quality Control
    domain: HẬU MÃI

  - name: First Visit Fix Rate
    definition: Tỷ lệ khách hàng được sửa chữa thành công ngay lần đầu đến xưởng dịch vụ
    business_meaning: Đo lường năng lực chẩn đoán và tay nghề kỹ thuật viên, giảm phiền hà cho khách
    example: First Visit Fix Rate đạt 88%, mục tiêu nâng lên 92% trong nửa cuối năm
    related_terms:
      - Customer Satisfaction Index
      - Repeat Repair Rate
      - Technician Skill Level
    domain: HẬU MÃI

  - name: Service Retention Rate
    definition: Tỷ lệ khách hàng quay lại đại lý chính hãng để bảo dưỡng sau khi hết bảo hành
    business_meaning: Thước đo sự gắn bó với thương hiệu và hiệu quả chương trình chăm sóc khách hàng
    example: Service Retention Rate sau 3 năm giảm từ 65% xuống 50%, khách hàng chuyển sang gara ngoài
    related_terms:
      - Customer Loyalty
      - Defection Rate
      - Loyalty Program
    domain: HẬU MÃI

  - name: Parts Availability Rate
    definition: Tỷ lệ phụ tùng có sẵn trong kho đáp ứng ngay yêu cầu của xưởng dịch vụ
    business_meaning: Ảnh hưởng trực tiếp đến thời gian chờ của khách và doanh thu dịch vụ
    example: Parts Availability Rate đạt 95% với mục tiêu tối thiểu 97% cho phụ tùng thường dùng
    related_terms:
      - Fill Rate
      - Stock-out Rate
      - Inventory Turnover
    domain: HẬU MÃI

  - name: MTTR (Mean Time To Repair)
    definition: Thời gian trung bình để hoàn thành một ca sửa chữa kể từ khi khởi tạo phiếu đến bàn giao xe
    business_meaning: Năng suất xưởng dịch vụ, ảnh hưởng đến sự hài lòng khách hàng và doanh thu/giờ
    example: MTTR chuẩn cho thay dầu là 45 phút, thực tế đang ở mức 52 phút chậm hơn chuẩn
    related_terms:
      - MTBF
      - Service Efficiency
      - Labor Productivity
    domain: HẬU MÃI

  - name: Technical Service Bulletin
    definition: Thông báo kỹ thuật từ nhà sản xuất hướng dẫn xử lý các vấn đề đã biết trên xe
    business_meaning: Tiêu chuẩn hóa quy trình sửa chữa, giảm chẩn đoán sai và đảm bảo đồng nhất chất lượng
    example: TSB-2024-015 hướng dẫn cập nhật phần mềm ECU cho các xe dòng B gặp lỗi check engine
    related_terms:
      - Service Campaign
      - Diagnostic Procedure
      - Workshop Manual
    domain: HẬU MÃI

  - name: Warranty Reserve
    definition: Quỹ dự phòng bảo hành trích lập trên mỗi xe bán ra để chi trả cho các yêu cầu bảo hành tương lai
    business_meaning: Quản lý rủi ro tài chính từ chi phí bảo hành, ảnh hưởng đến giá vốn hàng bán
    example: Warranty Reserve trích 3% giá xuất xưởng mỗi xe, dự phòng cho 5 năm bảo hành
    related_terms:
      - Warranty Claim
      - Warranty Accrual
      - Warranty Cost per Unit
    domain: HẬU MÃI

  - name: Fleet Availability Rate
    definition: Tỷ lệ thời gian xe hoạt động được so với tổng thời gian theo kế hoạch (dành cho xe thương mại)
    business_meaning: Cam kết chất lượng dịch vụ cho khách hàng doanh nghiệp, điều khoản SLA
    example: Fleet Availability Rate cho xe taxi đạt 97% nhờ chương trình bảo trì phòng ngừa ban đêm
    related_terms:
      - Uptime
      - SLA
      - Downtime Cost
    domain: HẬU MÃI

  - name: Extended Warranty
    definition: Gói bảo hành mở rộng sau thời gian bảo hành tiêu chuẩn, do khách hàng mua thêm
    business_meaning: Nguồn doanh thu dịch vụ mới, tăng gắn kết khách hàng và giữ chân khách dài hạn
    example: Gói Extended Warranty thêm 2 năm hoặc 50.000 km với giá 25 triệu VNĐ
    related_terms:
      - Warranty Claim
      - Service Contract
      - Customer Lifetime Value
    domain: HẬU MÃI

  - name: Service Absorption Rate
    definition: Tỷ lệ chi phí hoạt động của đại lý được bù đắp bởi doanh thu dịch vụ và phụ tùng
    business_meaning: Chỉ số sức khỏe tài chính của đại lý, giảm phụ thuộc vào doanh số xe mới
    example: Service Absorption Rate đạt 72% nghĩa là dịch vụ sau bánh trang trải 72% chi phí vận hành đại lý
    related_terms:
      - Parts Margin
      - Service Revenue
      - Dealer Profitability
    domain: HẬU MÃI

  - name: Overturn Rate
    definition: Tốc độ quay vòng của một vị trí sửa chữa trong xưởng dịch vụ trong ngày
    business_meaning: Tối ưu năng suất xưởng, quyết định số lượng xe phục vụ trên mỗi gian
    example: Overturn Rate của gian bảo dưỡng nhanh đạt 6 xe/ngày, mục tiêu 8 xe
    related_terms:
      - MTTR
      - Bay Utilization
      - Service Capacity
    domain: HẬU MÃI

  - name: RSM (Regional Service Manager)
    definition: Quản lý dịch vụ khu vực chịu trách nhiệm hỗ trợ kỹ thuật và vận hành cho hệ thống đại lý
    business_meaning: Cầu nối giữa nhà máy và đại lý, đảm bảo tiêu chuẩn dịch vụ đồng nhất
    example: RSM miền Bắc tổ chức training định kỳ tại 20 đại lý về quy trình bảo hành mới
    related_terms:
      - Dealer Network
      - Service Standard
      - Field Technical Support
    domain: HẬU MÃI

  - name: Vehicle Off-road Rate
    definition: Tỷ lệ xe nằm xưởng chờ phụ tùng hoặc sửa chữa kéo dài so với tổng số xe vào xưởng
    business_meaning: Đo lường hiệu quả quản lý phụ tùng và quy trình sửa chữa, ảnh hưởng đến trải nghiệm khách
    example: Vehicle Off-road Rate giảm từ 8% xuống 5% nhờ tối ưu tồn kho phụ tùng thay thế nhanh
    related_terms:
      - Parts Availability Rate
      - Cycle Time
      - Customer Wait Time
    domain: HẬU MÃI

  - name: Goodwill Policy
    definition: Chính sách hỗ trợ chi phí sửa chữa ngoài bảo hành dựa trên thiện chí và lịch sử khách hàng
    business_meaning: Công cụ giữ chân khách hàng và xử lý các khiếu nại nhạy cảm, bảo vệ hình ảnh thương hiệu
    example: Áp dụng goodwill 50% chi phí thay hộp số cho khách hàng đã hết bảo hành 3 tháng nhưng đều bảo dưỡng chính hãng
    related_terms:
      - Warranty Claim
      - Customer Retention
      - Customer Satisfaction Index
    domain: HẬU MÃI
