glossary_terms:
  - name: COGS (Cost of Goods Sold)
    definition: Giá vốn hàng bán, bao gồm chi phí nguyên vật liệu, nhân công và sản xuất
    business_meaning: Chi phí trực tiếp tạo ra sản phẩm bán ra, dùng để tính lợi nhuận gộp
    example: COGS của một xe VF8 bao gồm chi phí linh kiện, pin, lắp ráp và kiểm định
    related_terms:
      - Gross Margin
      - Standard Cost
    domain: TÀI CHÍNH

  - name: Gross Margin
    definition: Tỷ suất lợi nhuận gộp = (Doanh thu - COGS) / Doanh thu
    business_meaning: Chỉ số đo lường khả năng sinh lời cơ bản của sản phẩm
    example: Gross Margin 25% nghĩa là mỗi xe bán ra lãi 25% sau khi trừ giá vốn
    related_terms:
      - COGS
      - Net Profit Margin
    domain: TÀI CHÍNH

  - name: OPEX (Operating Expenses)
    definition: Chi phí hoạt động, bao gồm chi phí bán hàng, quản lý doanh nghiệp
    business_meaning: Chi phí vận hành doanh nghiệp không bao gồm giá vốn và chi phí tài chính
    example: OPEX bao gồm lương nhân viên văn phòng, chi phí marketing, thuê mặt bằng
    related_terms:
      - CAPEX
      - EBITDA
    domain: TÀI CHÍNH

  - name: CAPEX (Capital Expenditure)
    definition: Chi phí đầu tư tài sản cố định như máy móc, thiết bị, nhà xưởng
    business_meaning: Đầu tư dài hạn vào năng lực sản xuất, khấu hao qua nhiều năm
    example: Đầu tư dây chuyền sản xuất pin trị giá 50 triệu USD là CAPEX
    related_terms:
      - OPEX
      - Depreciation
    domain: TÀI CHÍNH

  - name: EBITDA
    definition: Lợi nhuận trước lãi vay, thuế, khấu hao và chi phí trả dần
    business_meaning: Chỉ số đo lường hiệu quả hoạt động kinh doanh thuần
    example: EBITDA 15% cho thấy doanh nghiệp có lợi nhuận hoạt động tốt
    related_terms:
      - OPEX
      - Net Profit
    domain: TÀI CHÍNH

  - name: Standard Cost
    definition: Chi phí tiêu chuẩn được xây dựng dựa trên định mức nguyên vật liệu, nhân công
    business_meaning: Cơ sở để tính giá thành sản phẩm và đánh giá biến động chi phí
    example: Standard Cost một bộ ghế da VF8 là 12 triệu đồng
    related_terms:
      - Actual Cost
      - Variance Analysis
    domain: TÀI CHÍNH

  - name: Actual Cost
    definition: Chi phí thực tế phát sinh trong quá trình sản xuất
    business_meaning: Chi phí thực dùng để so sánh với standard cost để phân tích biến động
    example: Actual Cost bộ ghế da là 13.5 triệu, chênh 1.5 triệu so với standard
    related_terms:
      - Standard Cost
      - Variance Analysis
    domain: TÀI CHÍNH

  - name: Variance Analysis
    definition: Phân tích chênh lệch giữa chi phí thực tế và chi phí tiêu chuẩn
    business_meaning: Công cụ kiểm soát chi phí và đánh giá hiệu quả sản xuất
    example: Variance dương 10% ở khoản mục vật liệu cần điều tra nguyên nhân
    related_terms:
      - Standard Cost
      - Actual Cost
    domain: TÀI CHÍNH

  - name: P&L (Profit & Loss)
    definition: Báo cáo kết quả hoạt động kinh doanh trong một kỳ
    business_meaning: Báo cáo tài chính tổng hợp doanh thu, chi phí và lợi nhuận
    example: P&L quý 1/2024 cho thấy lợi nhuận ròng 500 tỷ đồng
    related_terms:
      - Balance Sheet
      - Cash Flow
    domain: TÀI CHÍNH

  - name: Balance Sheet
    definition: Bảng cân đối kế toán phản ánh tài sản, nợ phải trả và vốn chủ sở hữu
    business_meaning: Báo cáo tài chính quan trọng cho thấy tình hình tài chính tại một thời điểm
    example: Balance Sheet cuối năm cho thấy tổng tài sản 100.000 tỷ đồng
    related_terms:
      - P&L
      - Cash Flow
    domain: TÀI CHÍNH

  - name: DSO (Days Sales Outstanding)
    definition: Số ngày thu tiền bình quân từ khách hàng
    business_meaning: Chỉ số hiệu quả quản lý công nợ phải thu
    example: DSO 45 ngày nghĩa là trung bình 45 ngày thu được tiền từ bán xe
    related_terms:
      - DPO
      - Working Capital
    domain: TÀI CHÍNH

  - name: DPO (Days Payable Outstanding)
    definition: Số ngày trả tiền bình quân cho nhà cung cấp
    business_meaning: Chỉ số quản lý công nợ phải trả
    example: DPO 60 ngày cho nhà cung cấp linh kiện
    related_terms:
      - DSO
      - Cash Conversion Cycle
    domain: TÀI CHÍNH

  - name: Cash Conversion Cycle
    definition: Chu kỳ chuyển đổi tiền mặt = DSO + DIO - DPO
    business_meaning: Thời gian từ khi trả tiền mua vật tư đến khi thu tiền bán hàng
    example: CCC 30 ngày là chỉ số tốt cho ngành sản xuất ô tô
    related_terms:
      - DSO
      - DPO
      - DIO
    domain: TÀI CHÍNH

  - name: Budget Variance
    definition: Chênh lệch giữa ngân sách kế hoạch và thực tế
    business_meaning: Công cụ đánh giá hiệu quả quản lý ngân sách
    example: Budget Variance chi phí marketing vượt 15% so với kế hoạch
    related_terms:
      - Variance Analysis
      - Rolling Forecast
    domain: TÀI CHÍNH

  - name: Unit Economics
    definition: Kinh tế đơn vị sản phẩm, phân tích doanh thu và chi phí trên mỗi đơn vị sản phẩm
    business_meaning: Đánh giá lợi nhuận trên từng xe bán ra
    example: "Unit Economics VF8: giá bán 800 triệu, COGS 600 triệu, gross margin 25%"
    related_terms:
      - COGS
      - Gross Margin
    domain: TÀI CHÍNH

  - name: Transfer Price
    definition: Giá chuyển giao giữa các pháp nhân trong cùng tập đoàn
    business_meaning: Định giá giao dịch nội bộ cho mục đích thuế và quản trị
    example: Transfer Price giữa công ty sản xuất linh kiện và công ty lắp ráp
    related_terms:
      - Standard Cost
      - COGS
    domain: TÀI CHÍNH

  - name: WACC (Weighted Average Cost of Capital)
    definition: Chi phí vốn bình quân gia quyền
    business_meaning: Suất chiết khấu dùng để thẩm định dự án đầu tư
    example: WACC 12% được dùng để đánh giá dự án mở rộng nhà máy
    related_terms:
      - CAPEX
      - IRR
    domain: TÀI CHÍNH

  - name: IRR (Internal Rate of Return)
    definition: Tỷ suất hoàn vốn nội bộ của dự án đầu tư
    business_meaning: Chỉ số đánh giá hiệu quả đầu tư, so sánh với WACC
    example: Dự án nhà máy pin có IRR 18% > WACC 12%, nên đầu tư
    related_terms:
      - WACC
      - CAPEX
    domain: TÀI CHÍNH

  - name: Depreciation
    definition: Khấu hao tài sản cố định trong kỳ
    business_meaning: Phân bổ chi phí tài sản cố định vào chi phí sản xuất kinh doanh
    example: Máy dập 100 tỷ khấu hao 10 năm, mỗi năm 10 tỷ
    related_terms:
      - CAPEX
      - EBITDA
    domain: TÀI CHÍNH

  - name: Working Capital
    definition: Vốn lưu động = Tài sản ngắn hạn - Nợ ngắn hạn
    business_meaning: Nguồn vốn phục vụ hoạt động hàng ngày của doanh nghiệp
    example: Working Capital 5.000 tỷ đảm bảo thanh toán cho nhà cung cấp
    related_terms:
      - DSO
      - DPO
      - Cash Conversion Cycle
    domain: TÀI CHÍNH
