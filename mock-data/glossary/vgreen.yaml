glossary_terms:
  - name: SOC (State of Charge)
    definition: Trạng thái sạc – tỷ lệ phần trăm năng lượng còn lại trong pin so với dung lượng tối đa của pin.
    business_meaning: Chỉ số quan trọng nhất hiển thị cho người lái, ảnh hưởng đến tầm xa còn lại và quyết định sạc.
    example: SOC từ 20% đến 80% là khoảng sạc nhanh tối ưu, sạc từ 80% lên 100% mất thời gian gấp đôi.
    related_terms:
      - BMS
      - Range
    domain: VGreen

  - name: NMC Battery
    definition: Pin NMC (Nickel Manganese Cobalt) – loại pin lithium-ion dùng cathode hỗn hợp niken-mangan-coban.
    business_meaning: Hóa chất pin phổ biến nhất trên xe điện hiện nay do mật độ năng lượng cao và chi phí hợp lý.
    example: Xe VGreen VF8 sử dụng pin NMC 811 với mật độ năng lượng 250 Wh/kg, tầm xa 420 km.
    related_terms:
      - Lithium-ion
      - kWh
    domain: VGreen

  - name: Lithium-ion
    definition: Pin lithium-ion – công nghệ pin sạc dùng ion lithium di chuyển giữa cực âm và dương để lưu trữ và giải phóng năng lượng.
    business_meaning: Công nghệ pin chủ đạo cho xe điện và thiết bị di động, chiếm hơn 90% thị trường pin xe điện.
    example: Pin lithium-ion trong xe VGreen có tuổi thọ thiết kế 1,500 chu kỳ sạc tương đương khoảng 600,000 km.
    related_terms:
      - NMC Battery
      - LFP Battery
    domain: VGreen

  - name: LFP Battery
    definition: Pin LFP (Lithium Iron Phosphate) – pin lithium-ion dùng cathode sắt-phosphate, không chứa coban.
    business_meaning: An toàn hơn và tuổi thọ cao hơn NMC, chi phí thấp hơn, phù hợp cho xe điện phổ thông.
    example: VGreen VF5 dùng pin LFP với 2,500 chu kỳ sạc, bền hơn nhưng mật độ năng lượng thấp hơn NMC khoảng 20%.
    related_terms:
      - Lithium-ion
      - NMC Battery
    domain: VGreen

  - name: Fast Charging
    definition: Sạc nhanh – công nghệ sạc với công suất lớn (thường từ 50 kW đến 350 kW) để nạp năng lượng trong thời gian ngắn.
    business_meaning: Là yếu tố then chốt giúp xe điện trở nên tiện dụng, thời gian sạc nhanh càng rút ngắn, người dùng càng chấp nhận.
    example: Trạm sạc nhanh DC 150 kW có thể sạc pin từ 10% đến 80% trong 28 phút cho VGreen VF9.
    related_terms:
      - CCS
      - kWh
    domain: VGreen

  - name: Range (Tầm xa)
    definition: Tầm xa – quãng đường tối đa xe điện có thể di chuyển với một lần sạc đầy, đo theo chuẩn WLTP hoặc NEDC.
    business_meaning: Là thông số hàng đầu người mua xe điện quan tâm, ảnh hưởng trực tiếp đến quyết định mua.
    example: Xe VGreen VF9 đạt tầm xa 580 km theo chuẩn WLTP, vượt xa nhu cầu di chuyển trung bình hàng ngày 50 km.
    related_terms:
      - SOC
      - kWh
    domain: VGreen

  - name: Regenerative Braking
    definition: Phanh tái tạo – hệ thống thu hồi động năng khi giảm tốc hoặc phanh, chuyển thành điện năng nạp lại pin.
    business_meaning: Tăng hiệu suất nhiên liệu và tầm xa xe điện, giảm mài mòn má phanh.
    example: Phanh tái tạo trên VGreen VF8 có thể thu hồi đến 70% động năng khi phanh nhẹ, tăng tầm xa 15-20%.
    related_terms:
      - SOC
      - One Pedal Driving
    domain: VGreen

  - name: CCS (Combined Charging System)
    definition: Hệ thống sạc kết hợp – chuẩn cổng sạc cho phép sạc AC và DC qua cùng một đầu nối phổ biến toàn cầu.
    business_meaning: CCS là tiêu chuẩn sạc châu Âu và Bắc Mỹ, tương thích với hầu hết trạm sạc công cộng.
    example: Xe VGreen VF9 được trang bị cổng CCS2, tương thích cả sạc AC 11 kW và sạc nhanh DC 350 kW.
    related_terms:
      - Fast Charging
      - Type 2 Connector
    domain: VGreen

  - name: kWh (Kilowatt-giờ)
    definition: Kilowatt-giờ – đơn vị đo năng lượng, dùng để chỉ dung lượng pin và lượng điện tiêu thụ.
    business_meaning: Dung lượng pin tính bằng kWh quyết định tầm xa và chi phí sản xuất, là thông số kỹ thuật quan trọng nhất của pin.
    example: Pin VGreen VF8 có dung lượng 94 kWh, tiêu thụ 19.5 kWh/100 km, tương đương chi phí 0.9% thu nhập hộ gia đình.
    related_terms:
      - Range
      - SOC
    domain: VGreen

  - name: BMS (Battery Management System)
    definition: Hệ thống quản lý pin – bộ điều khiển điện tử giám sát nhiệt độ, điện áp, dòng điện và SOC của pin.
    business_meaning: BMS đảm bảo an toàn và tuổi thọ pin, là công nghệ cốt lõi trong thiết kế xe điện.
    example: BMS cân bằng điện áp giữa các cell pin và giới hạn dòng sạc khi pin nóng trên 45°C.
    related_terms:
      - SOC
      - Thermal Management
    domain: VGreen

  - name: Thermal Management
    definition: Quản lý nhiệt – hệ thống duy trì nhiệt độ pin trong khoảng làm việc tối ưu khi vận hành và sạc.
    business_meaning: Ảnh hưởng trực tiếp đến tuổi thọ pin, an toàn và hiệu suất sạc nhanh.
    example: Hệ thống thermal management dùng chất lỏng làm mát pin VGreen VF9, duy trì nhiệt độ 25-35°C khi sạc nhanh.
    related_terms:
      - BMS
      - Fast Charging
    domain: VGreen

  - name: WLTP (Worldwide Harmonized Light Vehicles Test Procedure)
    definition: Quy trình thử nghiệm xe hạng nhẹ hài hòa toàn cầu – chuẩn đo tầm xa và mức tiêu thụ năng lượng quốc tế.
    business_meaning: Giúp so sánh tầm xa giữa các mẫu xe điện khác nhau. Tầm xa WLTP thực tế hơn NEDC.
    example: Tầm xa WLTP của VGreen VF8 là 420 km, thấp hơn tầm xa NEDC 480 km do chu trình thử nghiệm khắc nghiệt hơn.
    related_terms:
      - Range
      - kWh
    domain: VGreen

  - name: One Pedal Driving
    definition: Lái một bàn đạp – chế độ lái xe điện chỉ dùng bàn đạp ga, nhả ga sẽ kích hoạt phanh tái tạo đến khi xe dừng hẳn.
    business_meaning: Tính năng tăng trải nghiệm lái và tối ưu thu hồi năng lượng, đặc trưng của xe điện.
    example: Bật chế độ one pedal driving trên VGreen VF8 giúp thu hồi năng lượng tối đa và giảm mệt mỏi khi lái trong phố.
    related_terms:
      - Regenerative Braking
      - BMS
    domain: VGreen

  - name: DC Fast Charger
    definition: Bộ sạc nhanh DC – thiết bị sạc dòng điện một chiều công suất cao, nạp pin trực tiếp không qua bộ sạc trên xe.
    business_meaning: Hạ tầng sạc DC quyết định khả năng di chuyển đường dài của xe điện, là ưu tiên triển khai hạ tầng.
    example: Trạm sạc DC 350 kW tại trạm dừng chân cao tốc có thể sạc VGreen VF9 từ 10% đến 80% trong 18 phút.
    related_terms:
      - Fast Charging
      - CCS
    domain: VGreen

  - name: V2G (Vehicle-to-Grid)
    definition: Xe nối lưới – công nghệ cho phép xe điện xả điện từ pin vào lưới điện quốc gia khi không sử dụng.
    business_meaning: Tạo thêm nguồn thu cho chủ xe và giúp ổn định lưới điện, là mô hình kinh doanh mới cho xe điện.
    example: Xe VGreen V2G cung cấp 30 kWh cho lưới điện giờ cao điểm, chủ xe nhận được khoản bồi thường $5/phiên.
    related_terms:
      - BMS
      - kWh
    domain: VGreen

  - name: SoH (State of Health)
    definition: Trạng thái sức khỏe pin – tỷ lệ phần trăm dung lượng thực tế so với dung lượng ban đầu của pin.
    business_meaning: Chỉ số quyết định giá trị bán lại của xe điện và thời điểm cần thay pin.
    example: Sau 5 năm sử dụng, SoH pin VGreen VF8 còn 90%, vẫn đáp ứng tốt nhu cầu di chuyển hàng ngày.
    related_terms:
      - SOC
      - BMS
    domain: VGreen

  - name: IP Rating (Ingress Protection)
    definition: Chỉ số bảo vệ chống bụi và nước – tiêu chuẩn IEC đánh giá khả năng chống xâm nhập của thiết bị điện.
    business_meaning: Yêu cầu tối thiểu IP67 cho pin xe điện để đảm bảo an toàn khi vận hành trong điều kiện ngập nước và bụi bẩn.
    example: Pin VGreen VF9 được chứng nhận IP68, cho phép xe lội nước sâu 1 mét trong 30 phút.
    related_terms:
      - Thermal Management
      - BMS
    domain: VGreen
