services:
  api:
    build:
      context: ../../datahub-ai-chatbot
      dockerfile: ../platform/docker/chatbot.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../datahub-ai-chatbot/.env
    networks:
      - datahub-network

  sync-worker:
    build:
      context: ../../datahub-ai-chatbot
      dockerfile: ../platform/docker/worker.Dockerfile
    env_file:
      - ../../datahub-ai-chatbot/.env
    networks:
      - datahub-network

  indexing-worker:
    build:
      context: ../../datahub-ai-chatbot
      dockerfile: ../platform/docker/worker.Dockerfile
    command: python -m workers.indexing_worker
    env_file:
      - ../../datahub-ai-chatbot/.env
    networks:
      - datahub-network

networks:
  datahub-network:
    driver: bridge
