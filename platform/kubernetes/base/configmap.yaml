apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: datahub-chatbot
data:
  APP_NAME: "DataHub AI Chatbot"
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  LOG_LEVEL: "INFO"
  DATAHUB_GMS_URL: "http://datahub-gms:8080"
  DATAHUB_FRONTEND_URL: "http://datahub-frontend:9002"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/datahub_chatbot"
  REDIS_URL: "redis://redis:6379/0"
  OPENSEARCH_URL: "http://opensearch:9200"
  EMBEDDING_PROVIDER: "openai"
  EMBEDDING_MODEL: "text-embedding-ada-002"
  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-4o"
  AWS_REGION: "us-east-1"
