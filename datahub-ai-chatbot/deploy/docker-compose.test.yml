version: "3.9"

x-opensearch-config: &opensearch-config
  discovery.type: single-node
  DISABLE_SECURITY_PLUGIN: "true"
  OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs: /var/lib/postgresql/data
    networks:
      - chatbot-test

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs: /data
    networks:
      - chatbot-test

  opensearch-test:
    image: opensearchproject/opensearch:2.15.0
    environment:
      <<: *opensearch-config
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 512m
    tmpfs: /usr/share/opensearch/data
    networks:
      - chatbot-test

networks:
  chatbot-test:
    driver: bridge
