apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datahub-chatbot.fullname" . }}-datahub
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "datahub-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  datahub-token: {{ .Values.datahub.token | default "" | b64enc | quote }}
  jwt-secret-key: {{ .Values.app.jwtSecretKey | default "change-me-in-production" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datahub-chatbot.fullname" . }}-db
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "datahub-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s:%d/%s" .Values.postgresql.username .Values.postgresql.password .Values.postgresql.host .Values.postgresql.port .Values.postgresql.database | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datahub-chatbot.fullname" . }}-redis
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "datahub-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  redis-url: {{ printf "redis://%s:%d/0" .Values.redis.host .Values.redis.port | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datahub-chatbot.fullname" . }}-search
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "datahub-chatbot.labels" . | nindent 4 }}
type: Opaque
data:
  opensearch-url: {{ printf "http://%s:%d" .Values.opensearch.host .Values.opensearch.port | b64enc | quote }}
