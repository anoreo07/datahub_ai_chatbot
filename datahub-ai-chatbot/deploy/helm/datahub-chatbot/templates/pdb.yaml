{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "datahub-chatbot.fullname" . }}-api-pdb
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "datahub-chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "datahub-chatbot.apiSelectorLabels" . | nindent 6 }}
{{- end }}
{{- if and .Values.worker.enabled .Values.worker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "datahub-chatbot.fullname" . }}-worker-pdb
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "datahub-chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "datahub-chatbot.workerSelectorLabels" . | nindent 6 }}
{{- end }}
