apiVersion: v1
kind: Service
metadata:
  name: {{ include "datahub-chatbot.fullname" . }}-api
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "datahub-chatbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "datahub-chatbot.apiSelectorLabels" . | nindent 4 }}
