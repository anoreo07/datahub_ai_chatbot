---
global:
  environment: production

api:
  replicas: 5
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

worker:
  replicas: 2
  sync:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  indexing:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  document:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

app:
  env: production
  logLevel: INFO
  useMockDatahub: false
  enableDevEndpoints: false
  authMode: jwt
  authRequired: true
  embeddingProvider: openai
  llmProvider: openai
  enableMalwareScan: true
  cacheEnabled: true

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: chatbot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: chatbot-tls
      hosts:
        - chatbot.example.com

syncCronjob:
  enabled: true
  schedule: "0 2 * * *"

networkPolicy:
  enabled: true
