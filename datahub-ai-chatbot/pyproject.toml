[project]
name = "datahub-ai-chatbot"
version = "0.1.0"
description = "AI Chatbot for DataHub"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "opensearch-py>=2.7.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.0.0",
    "tenacity>=9.0.0",
    "acryl-datahub>=0.14.0",
    "openai>=1.0.0",
    "numpy>=1.26.0",
    "pyjwt>=2.8.0",
    "PyMuPDF>=1.23.0",
    "reportlab>=4.0.0",
    "ragas>=0.4.0",
    "langchain-google-genai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "acl: live DataHub ACL/auth read-only tests (enable with RUN_ACL_TESTS=1)",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "app*",
  "config*",
  "ingestion*",
  "indexing*",
  "retrieval*",
  "llm*",
  "workers*",
  "database*",
  "infrastructure*",
  "sync*",
  "evaluation*",
  "guardrails*",
]
exclude = ["tests*", "docs*", "scripts*"]
